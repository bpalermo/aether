# The soak's five load-and-roll workloads: svc-1 ... svc-5 (#1462).
#
#   kubectl apply -n aether-test -f e2e/soak/svc.yaml
#
# What the harness does with them:
#
#   churn.sh              rolls deployment/svc-1 ... svc-5 on its schedule (22 of
#                         the 33 rolls, and svc-3 inside the TRIPLE), and scales
#                         deployment/svc-5 to 0 for 90 s at T0+450m (the
#                         demand-set SHRINK), then back to the count it had.
#   sortie-targets.txt    drives svc-1 ... svc-4 by mesh name on the pod-local
#                         outbound listener (http://svc-N.<ns>.<mesh domain>:18081/).
#                         svc-5 is declared as an upstream of the engines
#                         (sortie-values.yaml) and never driven, on purpose: an
#                         idle upstream is what the SHRINK takes out of the
#                         demand set.
#   the new-SA step       dials svc-1 and svc-3 from a ServiceAccount the mesh
#                         has never seen.
#   churn.sh --preflight  refuses to start when one of the five is absent, has
#                         no replica, is not fully available or is mid-roll, is
#                         not in the mesh, or would not roll surge-first.
#
# Until this file, the five existed only on the cluster the soaks ran on: a
# change to them could not be reviewed, and a soak could not be set up from the
# repository. It is written from those objects, with two changes: the quiet
# start below, and svc-5 no longer sets two ports nothing listened on.
#
# What each one is. A Deployment and its ServiceAccount, nothing else:
#
#   no Service        the mesh name comes from the ServiceAccount (the registry
#                     service name IS the ServiceAccount name), and the
#                     registrar generates the selectorless mesh Service
#                     `svc-N` from the registered endpoints.
#   port 8080, HTTP   the mesh's defaults (endpoint.aether.io/port and
#                     /protocol), so no annotation says so. svc-5 is the
#                     exception: see it.
#   4 replicas        soft-spread over the nodes, as echo.yaml spreads its three.
#   the roll          surge-first (maxUnavailable 0), paced by minReadySeconds 10
#                     and held by a native preStop sleep: the two workload-side
#                     settings docs/workload-requirements.md ("Hitless rolling
#                     restarts") asks of every mesh workload. A soak whose
#                     workloads lack them measures the workloads.
#   QUIET (#1395)     echo-basic prints one stdout line per request and has no
#                     switch for it, and its image has no shell. As in
#                     echo.yaml: an init container copies a static busybox in
#                     as `sh`, and the server is exec'd through it with stdout
#                     on /dev/null (still PID 1; stderr kept). To hear it
#                     again, delete `command:`.
#   requests          10m CPU and no memory request: what the soaks so far ran
#                     with, kept so that their baselines still compare.
#
# The five are the same but for three things, and //e2e/soak:harness_test holds
# them to that (svc-2 and svc-3 are the plain ones):
#
#   svc-1   preStop sleep 10 s, the documented value. The other four hold 3 s,
#           the supported minimum, so both ends are rolled every run.
#   svc-4   two free-form endpoint metadata annotations (subset keys).
#   svc-5   a second port: h2c on 3001, declared with endpoint.aether.io/ports.
#
# Both images are the ones echo.yaml runs, by the same digests: bump them
# together (the test compares them).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-1
  labels:
    app: svc-1
spec:
  replicas: 4
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: svc-1
  template:
    metadata:
      labels:
        app: svc-1
        aether.io/managed: "true"
    spec:
      serviceAccountName: svc-1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: svc-1
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: quiet-shell
          image: busybox:1.37.0-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
          command: ["cp", "/bin/busybox", "/quiet/sh"]
          volumeMounts:
            - name: quiet
              mountPath: /quiet
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: echo
          image: gcr.io/k8s-staging-gateway-api/echo-basic@sha256:eb7396722956640221e856b8e8cf44179da131d5bd6fc27a4f0cb91f60c237c3
          command: ["/quiet/sh", "-c", "exec /echo-basic >/dev/null"]
          volumeMounts:
            - name: quiet
              mountPath: /quiet
              readOnly: true
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 10m
          securityContext:
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: quiet
          emptyDir: {}
---
