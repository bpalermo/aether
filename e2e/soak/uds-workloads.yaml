# UDS soak workloads (proposal 034 PR 3b): the two delivery paths under the
# full 8h soak — annotation (uds-echo) and EndpointPolicy (uds-cr-echo) — plus
# a light client keeping ~2 rps of real traffic on both so proxy/agent rolls
# exercise pipe delivery in anger.
#
# Mirrors e2e/uds.sh: no hand-written Service objects (the registrar's
# mesh-Service generator skips names an existing Service owns, which would
# suppress the VIP and break mesh DNS — the generated Service is also what the
# EndpointPolicy targetRef names). Socket names respect the ~15-char
# post-prefix sun_path budget. udsecho serves ONLY on the socket (no TCP
# bind), so every 200 is proof of pipe delivery.
#
# Image: the :dev tag tracks main (published by the release workflow); this is
# a test-only workload, deliberately not digest-pinned like shipped components.
apiVersion: v1
kind: ServiceAccount
metadata: {name: uds-echo, namespace: aether-test}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: uds-echo, namespace: aether-test}
spec:
  replicas: 2
  selector: {matchLabels: {app: uds-echo}}
  template:
    metadata:
      labels: {app: uds-echo, aether.io/managed: "true"}
      annotations:
        endpoint.aether.io/port: "8080"
        endpoint.aether.io/uds-socket: "s/a.sock"
    spec:
      serviceAccountName: uds-echo
      # fsGroup makes the emptyDir group-writable for the distroless nonroot
      # user, so the app can create the socket in it.
      securityContext: {fsGroup: 65532}
      containers:
        - name: app
          image: ghcr.io/bpalermo/aether/udsecho:dev
          imagePullPolicy: Always
          args: ["--socket=/s/a.sock", "--text=served-by-uds-echo"]
          volumeMounts: [{name: s, mountPath: /s}]
      volumes:
        - name: s
          # medium: Memory on purpose: a tmpfs mount created after the proxy
          # starts, so it exercises the HostToContainer propagation on the
          # kubelet-pods hostPath (a plain emptyDir would not).
          emptyDir: {medium: Memory}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: uds-cr-echo, namespace: aether-test}
---
# Policy path: identical pod shape, NO uds-socket annotation — delivery comes
# from the EndpointPolicy below.
apiVersion: apps/v1
kind: Deployment
metadata: {name: uds-cr-echo, namespace: aether-test}
spec:
  replicas: 2
  selector: {matchLabels: {app: uds-cr-echo}}
  template:
    metadata:
      labels: {app: uds-cr-echo, aether.io/managed: "true"}
      annotations:
        endpoint.aether.io/port: "8080"
    spec:
      serviceAccountName: uds-cr-echo
      securityContext: {fsGroup: 65532}
      containers:
        - name: app
          image: ghcr.io/bpalermo/aether/udsecho:dev
          imagePullPolicy: Always
          args: ["--socket=/s/a.sock", "--text=served-by-uds-cr-echo"]
          volumeMounts: [{name: s, mountPath: /s}]
      volumes:
        - name: s
          emptyDir: {medium: Memory}
---
apiVersion: config.aether.io/v1
kind: EndpointPolicy
metadata: {name: uds-cr, namespace: aether-test}
spec:
  targetRef: {kind: Service, name: uds-cr-echo}
  udsSocket: s/a.sock
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: uds-client, namespace: aether-test}
---
# Continuous light load on both UDS services through the mesh (qualified
# names, explicit outbound listener). Logs FAILURES ONLY, so
# `kubectl logs` doubles as the error ledger for soak grading.
apiVersion: apps/v1
kind: Deployment
metadata: {name: uds-client, namespace: aether-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: uds-client}}
  template:
    metadata:
      labels: {app: uds-client, aether.io/managed: "true"}
      # Declare the upstreams so both clusters are warm on this node
      # (demand-scoped distribution) instead of paying an ODCDS round trip.
      annotations: {config.aether.io/upstreams: "uds-echo.aether-test,uds-cr-echo.aether-test"}
    spec:
      serviceAccountName: uds-client
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "uds-client loop start $(date -u +%FT%TZ)"
              ok=0
              while true; do
                for s in uds-echo uds-cr-echo; do
                  code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
                    "http://$s.aether-test.aether.internal:18081/" 2>/dev/null || echo 000)
                  if [ "$code" = "200" ]; then
                    ok=$((ok+1))
                    # Heartbeat every ~1000 successes so "no failures logged"
                    # is distinguishable from "loop wedged".
                    [ $((ok % 1000)) -eq 0 ] && echo "$(date -u +%FT%TZ) OK count=$ok"
                  else
                    echo "$(date -u +%FT%TZ) FAIL $s code=$code"
                  fi
                done
                sleep 1
              done
