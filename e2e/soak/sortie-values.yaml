# Helm values for the soak's load driver (proposal 042): the sortie chart,
# oci://quay.io/sortie/chart-sortie, with one engine per worker node.
#
# run.sh installs this in two steps (engines alone, then the run), and sets the
# values that belong to a run on the command line: the plan (--set-file), the
# report's file name, and job.enabled. Nothing here is per run.
#
# Pinned by DIGEST, all three: the two images below and the chart (run.sh,
# SORTIE_CHART_DIGEST). They are sortie 94cf1035d7aa7d1d36d86866e41d653ff2fa5c02,
# chart version 0.1.0-94cf1035d7aa7d1d36d86866e41d653ff2fa5c02. A published chart
# already defaults both image refs to these digests; they are repeated here so
# the pin is in this repository, where a bump is a reviewed diff.
#
# Verified 2026-10-07 with cosign v3.1.2 (the version //bazel/cosign pins), the
# chart, and the index and both per-arch manifests of each image, bound to that
# commit (--certificate-github-workflow-sha):
#   cosign verify \
#     --certificate-identity-regexp '^https://github\.com/bpalermo/sortie/\.github/workflows/publish\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     quay.io/sortie/chart-sortie@sha256:f5007911c7e0e204ff97bdeeec88bd2e5a135fcd08eb9bb0dea96be0dbd4cc7c
# run.sh repeats that for the chart and for every image the release renders, on
# every run (its pre-flight; see --verify in its header). Bump the three
# together. cosign 3 or newer: the signatures are OCI referrers, and an older
# client reports "no signatures found" for a signed artifact.
image:
  ref: quay.io/sortie/sortie@sha256:6a2dc1f74f05cea126191f0bb886772ec3b3d918c09ad42bf86bd735d5d8813e

engine:
  enabled: true
  # One engine per node behind the headless Service <release>-sortie-engine-nodes,
  # which the plan's `dns:` pool resolves into one backend per node.
  kind: DaemonSet
  image:
    ref: quay.io/sortie/engine@sha256:d6ea5aca3fe0f93c2d02cc9ac0376bf34c66efe3bd196f08ba9a9e44454121cf
  # One execution per target runs at once on every engine. sortie-plan.sh
  # refuses a targets file longer than this.
  maxConcurrentExecutions: 16
  # Created by run.sh (the chart only references it). Same class and same reason
  # as the k6 runner: a DaemonSet pod cannot move, so without it the loader is
  # the scheduler's victim when a surging aether-proxy pod needs room, and that
  # node's share of the run is lost (2026-09-19).
  priorityClassName: aether-soak-loader
  podLabels:
    # REQUIRED, exactly as on the k6 runner: the engine opens the connections,
    # so it is the pod that has to be mesh-managed. Without this label there is
    # no ndots injection and no per-pod CNI capture or :53 DNAT, mesh DNS never
    # resolves, and the whole run is invalid (the 2026-07-19 soak).
    aether.io/managed: "true"
    app.kubernetes.io/part-of: aether-soak
  podAnnotations:
    # Pre-warm the node's clusters so the first requests are not cold-service
    # misses. The k6 runner's list, unchanged: bare names are qualified with the
    # pod's namespace (#636), and svc-5 is declared but never driven on purpose
    # (it is the churn driver's SHRINK target).
    config.aether.io/upstreams: "echo,svc-1,svc-2,svc-3,svc-4,svc-5,mixed-svc,uds-echo,uds-cr-echo"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  # CPU: a request for what the engine uses, and NO limit.
  #
  # The plan asks for the WAIT idle strategy (sortie-plan.sh): a worker thread
  # blocks until its next request is due, so the eight workers of this plan cost
  # 0.125-0.14 core per engine at 60 rps on kind (15 min, cgroup cpu.stat) -- not
  # the 1.7 cores the same engine took while it could only SLEEP, which is what
  # the old 400m limit was for. The request is that, rounded up; talos-main's
  # CPUs have not been read yet.
  # With the limit gone nothing throttles the engine, so the plan no longer
  # queues due requests either (max_pending_requests), and sortie's latency is
  # the mesh's again instead of the CFS period's.
  #
  # Why not keep a limit as a guard rail: any limit can throttle, and a
  # throttled load generator reports its own scheduling delay as the target's
  # latency. Measured: even at 400m, four times what it uses, the engine was
  # throttled in 17-20 CFS periods at the start of every run and each execution
  # ran 0.8 s short. An engine that is not cheap (a plan rendered with SPIN)
  # shows in the node's CPU, where it is looked for; under a limit it would
  # show as pool_overflow and as latency, where it would be read as the mesh.
  # See proposal 042, "CPU and memory".
  #
  # Memory is the engine's latency histograms: ~37Mi per worker per execution.
  # On kind: 300Mi with the eight executions running, flat over 15 minutes;
  # ~600Mi for the instant the final reports are assembled; 270-290Mi held
  # afterwards (sortie's own figures: 421Mi / 722Mi / 340-400Mi). --progress
  # adds nothing to it any more (see `args`). The limit is for the peak: 512Mi
  # is below it and kills the engine as the run ends.
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      memory: 1Gi

# The sortie pod itself: it only drives the engines over gRPC (pod IP :8443) and
# writes the report. It is NOT mesh-managed -- no aether.io/managed label -- so
# it resolves the headless Service through cluster DNS and its control channel
# is not part of the traffic under test.
#
# `--progress 60s`: every minute the pod's log gets one line per execution and
# backend (`mesh/svc-1  10.0.0.11:8443  5m0s  http_2xx 2700 ...  mean X max Y`),
# which is the run's liveness in `kubectl logs` and, saved as sortie.log, a
# one-minute timeline of every counter per target and node -- the nearest thing
# left to the k6 AETHER_FAIL lines. A snapshot no longer copies histograms, so
# it costs no memory (kind, 15 min: 299.9 -> 301.8Mi, the same as without).
# It is not free in CPU: one snapshot of eight executions is a burst of about
# 0.6 CPU-second in each engine, +10m averaged over a minute (+19m at 30 s).
# Hence a minute, not the 5 s sortie's own examples use.
args:
  - run
  - --progress
  - 60s

# The run's single point of failure gets the engines' PriorityClass too: one
# sortie pod drives every engine, and if it is preempted every execution is
# cancelled and the run is reported cancelled, not evaluated. It preempts
# nothing (preemptionPolicy: Never); it is only no longer the first victim.
priorityClassName: aether-soak-loader

job:
  backoffLimit: 0
  # Keep the finished Job and its pod (the readable summary is the pod's log)
  # until sortie-teardown.sh removes them, AFTER sortie-save.sh has copied both.
  ttlSecondsAfterFinished: null

report:
  # path is set per run by run.sh: /var/run/sortie/<run tag>.json
  format: json
  volume:
    persistentVolumeClaim:
      claimName: sortie-soak-reports

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # The report volume has to be writable by the non-root user.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
