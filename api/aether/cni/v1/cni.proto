edition = "2023";

package aether.cni.v1;

import "buf/validate/validate.proto";
import "google/protobuf/wrappers.proto";

// Preserve proto3 implicit field presence so the generated Go/C++ API is
// unchanged by the edition migration (scalars stay value types, not pointers).
option features.field_presence = IMPLICIT;
option go_package = "aethermesh.dev/api/aether/cni/v1;cniv1";

message CNIPod {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  string namespace = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  string network_namespace = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  string container_id = 4 [(buf.validate.field).required = true];

  repeated string ips = 5;

  map<string, string> labels = 6;

  map<string, string> annotations = 7;

  google.protobuf.UInt32Value pid = 8;

  string service_account = 9;

  // terminating is set by the agent when the Kubernetes pod's deletionTimestamp
  // appears (deletion *requested*, before SIGTERM reaches the app). A
  // terminating pod's endpoint is deregistered immediately so new requests stop
  // routing to it while in-flight ones drain through the grace period; the
  // liveness loop must never re-register it. Local xDS resources stay until the
  // CNI DEL performs final teardown.
  bool terminating = 10;

  // uid is the Kubernetes pod UID, fetched from the API server on CNI ADD and
  // persisted so listener regeneration from storage can resolve the pod's UDS
  // socket path (<uds-csi-root>/<uid>/<file>, proposals 034/039) without the
  // API server. Empty on records written before the field existed.
  string uid = 11;

  // uds_csi_volume is the name of the pod's inline `csi: {driver: csi.aether.io}`
  // volume, the only carrier for a UDS-delivered socket since proposal 039
  // Phase 2. Recorded by the agent on CNI ADD from the pod spec and persisted so
  // storage replay resolves the socket without the API server. Empty when the
  // pod declares no such volume, and ALSO when it declares more than one (one
  // mesh socket volume per pod: the agent trusts neither; see uds_csi_volumes).
  string uds_csi_volume = 12;

  // volumes lists the name of every volume the pod declares, whatever its
  // source. It lets the agent tell a UDS request naming a volume the pod mounts
  // with another carrier (an emptyDir left over from before 039 Phase 2:
  // reason "not_csi") from one naming a volume the pod does not declare at all
  // (reason "volume_not_declared").
  repeated string volumes = 13;

  // uds_csi_volumes counts the pod's csi.aether.io volumes, so a pod declaring
  // more than one (uds_csi_volume then empty) is reported as
  // "multiple_csi_volumes" rather than misattributed. Zero on records written
  // before the field existed.
  uint32 uds_csi_volumes = 14;
}
