name: coverage

# Line coverage of the unit suite, and the gate on it. docs/runbook.md, "Code
# coverage".
#
# A pull request fails the `coverage` check when its total line coverage is
# more than COVERAGE_MAX_DROP percentage points (default 1.0,
# scripts/coverage-compare.sh) below the baseline: the report of this
# workflow's run on main for the pull request's base commit, else main's
# latest (scripts/coverage-baseline.sh). The comparison is ours, not GitHub's:
# GitHub's native code coverage (Code Quality) does not accept uploads from
# this repository, so the ruleset's "Restrict code coverage" rule would never
# see data. The native upload is kept, parked behind the repository variable
# CODE_COVERAGE_UPLOAD (see the `upload` job).
#
# Repository variables (Settings > Secrets and variables > Actions > Variables;
# all optional, none set by this file):
#   COVERAGE_MAX_DROP     maximum drop of the total, in percentage points.
#   COVERAGE_MIN          minimum total, in percent. Unset: no minimum.
#   CODE_COVERAGE_UPLOAD  `true` runs the `upload` job. Anything else: skipped.
#
# Its own workflow rather than a job in ci.yaml, for three reasons:
#   - `actions: read` and `code-quality: write` stay out of the workflow that
#     builds and tests every pull request;
#   - the baseline is main's own report, so this must also run on pushes to
#     main, which ci.yaml does not (it is pull-request only, and main.yaml is
#     its post-merge twin);
#   - ci.yaml's legs run bazel-diff's impacted subset. Coverage cannot: a
#     percentage over a different set of tests per pull request is not
#     comparable with main's. This always runs the whole unit suite. The
#     instrumented compiles are remote cache hits when nothing changed; the
#     tests themselves re-run on the runner every time, because the BuildBuddy
#     key CI uses may not write locally executed results to the remote cache
#     (the same is true of ci.yaml's legs). docs/runbook.md has the timings
#     and what would make the test results cache hits too.
#
# What is measured (scripts/coverage.sh holds the reasoning): every go_test not
# tagged integration, requires-root or manual, over every first-party Go
# component, with a zero-hit record for each file no test links, so untested
# code lowers the number instead of vanishing from it. Not integration, e2e,
# kind or netns.
#
# The `coverage` job at the bottom is the one name a ruleset requires. A
# required check must report on every pull request that can merge, hence the
# `upgrade/**` base (stacked pull requests target the branch beneath them, as
# ci.yaml and codeql.yaml allow for).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "upgrade/**"
  # How a missing baseline is repaired: run this on main (Actions > coverage >
  # Run workflow, or `gh workflow run coverage.yaml --ref main`). A successful
  # run on main is a baseline whether a push or this started it; a run on any
  # other branch only produces its report.
  workflow_dispatch: {}

# Nothing at workflow level: each job states what it needs.
permissions: {}

# A newer push to the same pull request supersedes the older run. Runs on main
# are never cancelled and never share a group: each one is the baseline of the
# pull requests based on its commit, and GitHub keeps only ONE pending run per
# concurrency group, so a shared group would drop the middle one of three quick
# merges and leave that commit without a baseline.
concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs the repository's code with a read-only token; the gate and the upload
  # are separate jobs so that `actions: read` and `code-quality: write` never
  # sit next to a test binary.
  #
  # On main (a push or a manual run there) the job runs in the `main`
  # environment, whose BUILDBUDDY_ORG_API_KEY is a Read+Write key (#1314): the
  # whole unit suite's coverage results are stored in the action cache, and a
  # pull request's run (repository-level CAS-only key: read, never write) reuses
  # every test whose inputs it did not change. A pull request must not name the
  # environment at all: it admits the `main` branch only, and GitHub would fail
  # the job. An empty name means no environment.
  report:
    name: Report (unit suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main' || '' }}
    permissions:
      # Check out the repository.
      contents: read
    # The branch name is attacker-controlled text on a pull request: it reaches
    # the build metadata through the environment, never interpolated into a
    # script (actionlint `expression`, as in ci.yaml).
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The pull request's HEAD, not the merge commit GitHub checks out by
      # default: the gate compares this commit with its base, a native upload
      # is attributed to the head commit, and the report's line numbers have
      # to be that commit's.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Restores the repository cache and never saves it: the one saver per
      # cache key is the `diff` job of ci.yaml / main.yaml, whose warm-up
      # fetches for all of //... (.github/actions/setup-bazel).
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      # --collect_code_coverage so analysis also resolves what only a coverage
      # build needs (the coverage report generator and its Java runtime).
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=remote --lockfile_mode=error --collect_code_coverage //...
      # Compiles (instrumented) and the baseline actions go to BuildBuddy RBE;
      # test EXECUTION stays on the runner, exactly as in ci.yaml:
      # `--config=remote` sets `--strategy=TestRunner=local`, because the
      # executor sandbox runs as root without privileged capabilities and the
      # permission- and netns-sensitive tests fail there. `--config=remote`
      # and not `--config=ci`: the lint aspects have their own jobs. Without
      # the key (a fork's pull request) the same flags fall back to a local
      # build.
      - name: Coverage of the whole unit suite (remote build, local tests)
        env:
          OUT: ${{ runner.temp }}/coverage
        run: |
          scripts/coverage.sh --out "$OUT" -- \
            --config=remote \
            --lockfile_mode=error \
            --color=yes \
            --noshow_progress \
            --noshow_loading_progress \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=ROLE=CI \
            --build_metadata=VISIBILITY=PUBLIC \
            --build_metadata=COMMIT_SHA="$COMMIT_SHA" \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME="$BRANCH_NAME"
      - name: Job summary
        env:
          OUT: ${{ runner.temp }}/coverage
        run: |
          {
            echo "## Unit-test line coverage"
            echo
            echo "Commit \`$COMMIT_SHA\`. Every \`go_test\` not tagged \`integration\`, \`requires-root\` or \`manual\`, over all first-party Go; a file no test links counts as zero. The *tests-only* columns are the same run without those zero-hit records."
            echo
            cat "$OUT/summary.md"
            echo
            echo "<details><summary>$(wc -l <"$OUT/unrecorded.txt") tracked non-test .go file(s) not in the report (excluded by build constraints on linux/amd64)</summary>"
            echo
            echo '```'
            cat "$OUT/unrecorded.txt"
            echo '```'
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"
      # 90 days (the most a public repository keeps): on main this artifact is
      # the baseline pull requests are compared with, and it has to outlive a
      # quiet period. When it has not, the gate says so and how to make a new
      # one (`workflow_dispatch` above).
      - name: Keep the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            ${{ runner.temp }}/coverage/coverage.xml
            ${{ runner.temp }}/coverage/coverage.lcov
            ${{ runner.temp }}/coverage/tests-only.lcov
            ${{ runner.temp }}/coverage/summary.md
            ${{ runner.temp }}/coverage/unrecorded.txt
          if-no-files-found: error
          retention-days: 90

  # The gate. No test binary runs here: it reads two reports and compares them
  # (scripts/coverage-compare.sh), which is why this job, not `report`, holds
  # `actions: read`. A fork's pull request is gated too: its token can read.
  #
  # Which baseline (scripts/coverage-baseline.sh): main's run for the pull
  # request's base commit; else main's most recent successful run. A stacked
  # pull request (base `upgrade/**`) always gets the latter, because its base
  # commit was never on main: the stack lands on main, so each member is
  # measured against main, cumulatively with the members beneath it. No
  # baseline at all fails the job with what to do about it.
  gate:
    name: Gate (drop against main)
    needs: report
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # List main's runs of this workflow and download the baseline artifact.
      actions: read
      # Check out the scripts and the history `git diff` needs.
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Full history: the changed-files table is a `git diff` between the
      # baseline commit and the head.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch this pull request's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage
      # Waits up to ten minutes for main's run of the base commit when it is
      # still going (a pull request pushed right after a merge), rather than
      # compare with an older commit.
      - name: Find and fetch the baseline from main
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/coverage-baseline.sh --base-sha "$BASE_SHA" --out "$RUNNER_TEMP/baseline" --wait-seconds 600 >>"$GITHUB_OUTPUT"
      # The thresholds are repository variables so the owner can tune them
      # without a pull request; unset is empty, which the script reads as "the
      # default" (and, for the minimum, "off"). A malformed value fails.
      - name: Compare with the baseline
        env:
          COVERAGE_MAX_DROP: ${{ vars.COVERAGE_MAX_DROP }}
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          BASELINE_MATCH: ${{ steps.baseline.outputs.match }}
          BASELINE_RUN_URL: ${{ steps.baseline.outputs.run_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASELINE_MATCH" = exact ]; then
            label="main at ${BASELINE_SHA:0:8}"
            source="the pull request's base commit"
          else
            label="main at ${BASELINE_SHA:0:8} (main's latest report, not the base commit ${BASE_SHA:0:8})"
            source="main's most recent report: the base commit \`${BASE_SHA:0:8}\` (\`$BASE_REF\`) has no successful coverage run on main. For a stacked pull request that is by design, and the delta then covers the whole stack up to this member"
          fi
          args=(--baseline "$RUNNER_TEMP/baseline/coverage.lcov" --head "$RUNNER_TEMP/coverage/coverage.lcov" --baseline-label "$label")
          # Informational only, so a diff that cannot be computed costs the
          # table, not the gate.
          if git diff --name-only --no-renames "$BASELINE_SHA...$HEAD_SHA" >"$RUNNER_TEMP/changed.txt"; then
            args+=(--changed-files "$RUNNER_TEMP/changed.txt")
          else
            echo "::warning title=Coverage gate::could not diff $BASELINE_SHA...$HEAD_SHA; the changed-files table is left out"
          fi
          rc=0
          scripts/coverage-compare.sh "${args[@]}" >"$RUNNER_TEMP/gate.md" || rc=$?
          {
            cat "$RUNNER_TEMP/gate.md"
            echo "Baseline: [\`$BASELINE_SHA\`]($BASELINE_RUN_URL), $source. Head: \`$HEAD_SHA\`. Changed files are those of \`git diff ${BASELINE_SHA:0:8}...${HEAD_SHA:0:8}\`."
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # PARKED: GitHub's native code coverage (Code Quality) is not available to
  # this repository. The upload API answers HTTP 404 on pull requests and HTTP
  # 500 on main even with `code-quality: write` granted, and a repository owned
  # by a personal account has no settings page to enable it on
  # (actions/upload-code-coverage#16). So this job runs only when the
  # repository variable CODE_COVERAGE_UPLOAD is `true`; by default it is
  # skipped, silently. Kept, permission block and all, so that turning it on is
  # one variable if GitHub ever enables the feature. When it is on, a rejected
  # upload is red: nothing softens it.
  #
  # A fork's pull request gets a read-only token whatever is declared here, so
  # the upload is skipped for it (the action would skip it too).
  upload:
    name: Upload to code coverage
    needs: report
    if: ${{ vars.CODE_COVERAGE_UPLOAD == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Upload the report.
      code-quality: write
      # As in GitHub's documented workflow for this action. Nothing is checked
      # out here.
      contents: read
    steps:
      - name: Fetch the report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage

      # Attributed by the action to the pull request's head commit, or to the
      # pushed commit on main. One report, one stable label: GitHub keeps the
      # latest upload per branch, and a label that changed would start a second
      # series instead of continuing this one.
      - name: Upload the Cobertura report
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ runner.temp }}/coverage/coverage.xml
          language: Go
          label: code-coverage/unit

  # The single check to require. `if: always()` so it reports even when a job
  # above failed. The report must have succeeded. On a pull request the gate
  # must have SUCCEEDED: skipped is not good enough there, because a skipped
  # gate compared nothing. Off a pull request there is nothing to compare with
  # and the gate is skipped by design. The upload is skipped unless it is
  # switched on; switched on, it must not fail.
  coverage:
    if: always()
    needs: [report, gate, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      EVENT: ${{ github.event_name }}
      REPORT: ${{ needs.report.result }}
      GATE: ${{ needs.gate.result }}
      UPLOAD: ${{ needs.upload.result }}
    steps:
      - name: Fail unless the report was produced, the gate passed and the upload did not fail
        run: |
          echo "report=$REPORT gate=$GATE upload=$UPLOAD event=$EVENT"
          failed=0
          if [ "$REPORT" != success ]; then
            echo "::error::the coverage report was not produced (report: $REPORT)"
            failed=1
          fi
          if [ "$EVENT" = pull_request ]; then
            if [ "$GATE" != success ]; then
              echo "::error::the coverage gate did not pass (gate: $GATE); see the 'Gate (drop against main)' job"
              failed=1
            fi
          elif [ "$GATE" != skipped ] && [ "$GATE" != success ]; then
            echo "::error::the coverage gate job ended as $GATE"
            failed=1
          fi
          if [ "$UPLOAD" != skipped ] && [ "$UPLOAD" != success ]; then
            echo "::error::the upload to GitHub code coverage was switched on (CODE_COVERAGE_UPLOAD) and ended as $UPLOAD"
            failed=1
          fi
          exit "$failed"
