name: proxy-release

# Post-merge release for the custom Envoy (//proxy): build per arch — both legs
# offload the Envoy compile to BuildBuddy RBE (amd64 = x64 pool, arm64 = arm64
# pool, driven from a native arm64 runner). Push each arch by DIGEST (no per-arch tags),
# then assemble one multi-arch manifest tagged with the commit SHA.
# `bazel run //:push` runs the pusher locally, so the arm64 leg keeps a native
# ubuntu-24.04-arm runner (RBE compiles the binary, runner executes the pusher).
on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/proxy-release.yml"

permissions:
  contents: read

# Serialise proxy releases for the same reason as `publish` (#692): `bump-chart`
# rewrites `charts/aether/values.yaml` and bumps `Chart.yaml` on top of whatever
# `main` is at checkout time, so two overlapping runs would compute the *same*
# next chart version off the same base and the second PR to merge would land a
# duplicate version (and, before #703's per-release branches, would also have
# clobbered the first run's pin on the shared branch).
# `cancel-in-progress: false` because each run publishes a distinct,
# commit-SHA-tagged multi-arch image that nothing else will republish; cancelling
# one would leave per-arch blobs pushed with no manifest referencing them.
concurrency:
  group: proxy-release-main
  cancel-in-progress: false

# No CARGO_BAZEL_REPIN. Under WORKSPACE it was unavoidable — @envoy's
# bazel/dependency_imports_extra.bzl has a top-level
# `load("@envoy_rust_crate_index//:defs.bzl", ...)`, so WORKSPACE evaluation
# fetched the crate_universe repo whatever the extension set was. Under bzlmod
# the `crate` module extension is only evaluated when something in the build
# graph needs a repo from it, and //bazel/build_config compiles in no
# dynamic-modules extension, so nothing does.
env:
  IMAGE: ghcr.io/bpalermo/aether/aether-proxy

jobs:
  build-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 offloads the heavy compile to BuildBuddy's x64 RBE pool.
          - arch: amd64
            runner: ubuntu-latest
            bazel_config: rbe-buildbuddy-amd64
          # arm64 offloads the heavy compile to BuildBuddy's arm64 RBE pool. The
          # ubuntu-24.04-arm runner is required twice over: @clang_platform /
          # @llvm_toolchain derive their exec constraints from the driver's arch,
          # and `bazel run //:push` executes the oci_push tool natively (the
          # pusher is built for arm64 by RBE and needs an arm64 runner).
          - arch: arm64
            runner: ubuntu-24.04-arm
            bazel_config: rbe-buildbuddy-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # aether #651/#653 acceptance gate, run BEFORE the push so a proxy with the
      # wrong GNU build-ID can never reach the registry. Two cheap assertions
      # compose into "the binary's build-ID is a content hash of this binary":
      #   1. //integration:build_id_test — the linked binary carries a
      #      .note.gnu.build-id and it is 20 bytes wide (the SHA-1 shape only
      #      --build-id=sha1 produces);
      #   2. the link action's own command line ends in --build-id=sha1, i.e.
      #      that width came from the content-hash setting and not from some
      #      other 20-byte id (a commit stamp, say — which is what #653 was).
      # Assertion 2 is analysis-only (`aquery`), so it costs no compile, and the
      # ~150 MB binary never leaves the executor. The Envoy compile is shared
      # with the push step below.
      - name: Verify the Envoy GNU build-ID is a content hash
        working-directory: proxy
        run: |
          bazel test \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            //integration:build_id_test
          # lld honours the LAST --build-id on the command line; the toolchain
          # supplies --build-id=md5 earlier, so assert ours is the final one.
          bazel aquery \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            'mnemonic("CppLink", //:envoy)' | tee /tmp/envoy-link.txt | grep -- '--build-id'
          test "$(grep -o -- '--build-id=[a-z0-9]*' /tmp/envoy-link.txt | tail -1)" = "--build-id=sha1"

      - name: Build + push ${{ matrix.arch }} by digest (${{ matrix.bazel_config }})
        # remote_tags=[] and no --tag → oci_push pushes the image by digest only
        # (no tag lingers in the registry). Capture the pushed manifest digest.
        working-directory: proxy
        run: |
          bazel run \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME=${{ github.ref_name }} \
            //:push 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(grep -oE '@sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | head -1 | cut -d@ -f2)"
          test -n "$digest"
          echo "$digest" > "$RUNNER_TEMP/digest.txt"
          echo "pushed ${{ matrix.arch }}: $digest"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error

  manifest:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Index (multi-arch manifest list) digest — what bump-chart pins the chart
      # to. Read back from the registry rather than computed locally: the chart's
      # `aether.image` helper prefers `digest:` over `tag:`, so this value is
      # what actually gets deployed.
      index_digest: ${{ steps.manifest.outputs.index_digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: digests

      # Combine the two per-arch images (by digest) into one multi-arch manifest,
      # tagged with the commit SHA.
      - name: Assemble multi-arch manifest
        id: manifest
        run: |
          amd64="$(cat digests/digest-amd64/digest.txt)"
          arm64="$(cat digests/digest-arm64/digest.txt)"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ github.sha }}" \
            "${IMAGE}@${amd64}" \
            "${IMAGE}@${arm64}"
          # Read the index digest back from the registry. Do NOT sha256sum
          # `imagetools inspect --raw` locally: that is the digest of whatever
          # bytes the CLI chose to print, not necessarily the descriptor the
          # registry stores.
          index="$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' "${IMAGE}:${{ github.sha }}")"
          case "$index" in
            sha256:*) ;;
            *) echo "::error::unexpected index digest '$index'"; exit 1 ;;
          esac
          echo "index_digest=$index" >> "$GITHUB_OUTPUT"
          echo "index: $index"

  # Pin the aether chart to the just-published image (commit-SHA tag) and, when a
  # release token is available, open the pin PR and hand the merge to GitHub
  # (#727). Two modes, decided per run by the "Resolve release token" step:
  #
  #   auto   `RELEASE_PAT` (fine-grained: Contents RW + Pull requests RW, this
  #          repo only) is present and the API accepts it. The branch is pushed
  #          with that token, the PR is opened with it — a PR opened by a *user*
  #          token fires `pull_request` normally, so `ci` + `proxy` actually run —
  #          and `gh pr merge --auto --squash` lets GitHub merge it the moment the
  #          `main` ruleset is satisfied. Any superseded `chore/proxy-image-bump-*`
  #          PR is closed and its branch deleted.
  #
  #   manual no token, an expired/rejected one, or a `gh pr create` that failed:
  #          exactly #703's behaviour. The branch is pushed with `GITHUB_TOKEN`
  #          and a human runs the `gh pr create` one-liner from the run summary /
  #          the rolling #724 comment. A missing or dead token degrades the run,
  #          it never fails it.
  #
  # Why a token at all (#703): "Allow GitHub Actions to create and approve pull
  # requests" is off, so `GITHUB_TOKEN` cannot create a PR here — and turning it
  # on would not help, because GitHub's recursion guard means a PR opened by
  # `GITHUB_TOKEN` fires no `pull_request` events, so the required `ci` + `proxy`
  # checks would never report and the `main` ruleset (no bypass actors) could
  # never be satisfied. Pushing straight to `main` is blocked by the same ruleset.
  # A PR opened by a user token is an ordinary PR and gets ordinary checks; the
  # ruleset still gates the merge, so this job can merge nothing that is not green.
  #
  # Why `environment: release` (#727 addendum): `RELEASE_PAT` is an *environment*
  # secret of `release`, whose deployment-branch policy names `main` only. GitHub
  # injects environment secrets only into jobs that declare the environment, and
  # refuses to start such a job from any other ref — so a `pull_request` run, or a
  # run of this workflow as edited on a branch, can never read the token. (The
  # residual is inherent to any post-merge secret: a workflow change that lands on
  # `main` runs with it afterwards.)
  #
  # The branch stays per-release (`chore/proxy-image-bump-<short sha>`) rather than
  # one rolling branch: in manual mode a later `GITHUB_TOKEN` push onto a branch
  # that already has an open PR fires no `pull_request: synchronize` either, so the
  # new head would carry no checks and the PR would be stuck.
  bump-chart:
    needs: manifest
    runs-on: ubuntu-latest
    # Scopes `RELEASE_PAT` (an environment secret) to runs on `main` — see above.
    environment: release
    permissions:
      # contents: write to push the branch in manual mode; issues: write for the
      # #724 record, which is always written with GITHUB_TOKEN (the fine-grained
      # RELEASE_PAT deliberately has no Issues permission). No pull-requests:
      # write — GITHUB_TOKEN neither can nor should open PRs here; the PAT does.
      contents: write
      issues: write
    env:
      TRACKING_ISSUE_TITLE: proxy releases pending chart pin
    steps:
      # Decide the mode before anything else, so every later step can branch on
      # it, and report the token's remaining life (the rotation reminder).
      - name: Resolve release token
        id: token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          # The token is NEVER echoed. Actions already masks a secret's value;
          # `add-mask` it again defensively so anything derived from it in a
          # future edit is masked from the first line.
          mode=manual
          reason=""
          expiry=""
          if [ -z "${RELEASE_PAT:-}" ]; then
            reason="no \`RELEASE_PAT\` in the \`release\` environment"
            echo "::notice::RELEASE_PAT is not configured — falling back to the manual hand-off (#703)"
          else
            echo "::add-mask::$RELEASE_PAT"
            # Two probes: `gh auth status` (the token parses and gh accepts it)
            # and `gh api user` (the API accepts it *now* — a revoked or expired
            # token fails only here).
            if GH_TOKEN="$RELEASE_PAT" gh auth status >/dev/null 2>&1 &&
              GH_TOKEN="$RELEASE_PAT" gh api user >/dev/null 2>&1; then
              mode=auto
            else
              reason="\`RELEASE_PAT\` was rejected by the API (revoked, expired or out of scope)"
              echo "::warning::RELEASE_PAT was rejected by the GitHub API — falling back to the manual hand-off (#703)"
            fi
            # Expiry sentinel. GitHub reports a fine-grained token's expiry in a
            # response header; a HEAD request never echoes the Authorization
            # header back, so nothing leaks.
            exp="$(curl -sSI -H "Authorization: Bearer $RELEASE_PAT" https://api.github.com/user |
              tr -d '\r' |
              sed -nE 's/^[Gg]ithub-[Aa]uthentication-[Tt]oken-[Ee]xpiration:[[:space:]]*//p' |
              head -1)"
            if [ -z "$exp" ]; then
              expiry="expiry not reported by the API (no expiration set, or not a fine-grained token)"
            elif ! exp_epoch="$(date -u -d "$exp" +%s 2>/dev/null)"; then
              expiry="expiry unparseable (\`$exp\`)"
              echo "::warning::could not parse the token expiry header '$exp'"
            else
              iso="$(date -u -d "$exp" +%Y-%m-%d)"
              days=$(( (exp_epoch - $(date -u +%s)) / 86400 ))
              if [ "$days" -lt 0 ]; then
                mode=manual
                reason="\`RELEASE_PAT\` expired on \`$iso\`"
                expiry="rotate the \`release\` environment secret (docs/runbook.md §7)"
                echo "::error::RELEASE_PAT expired on ${iso} — falling back to the manual hand-off; rotate it (docs/runbook.md §7)"
              elif [ "$days" -lt 30 ]; then
                expiry="**expires in ${days} day(s)** (\`$iso\`) — rotate the \`release\` environment secret (docs/runbook.md §7)"
                echo "::warning::RELEASE_PAT expires in ${days} day(s) (${iso}) — rotate it (docs/runbook.md §7)"
              else
                expiry="expires in ${days} days (\`$iso\`)"
              fi
            fi
          fi
          {
            echo "mode=$mode"
            echo "reason=$reason"
            echo "expiry=$expiry"
          } >> "$GITHUB_OUTPUT"
          echo "release token mode: ${mode}${reason:+ (${reason})}"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Pin aether chart to aether-proxy:${{ github.sha }}
        id: pin
        env:
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
          SHA: ${{ github.sha }}
        run: |
          test -n "$INDEX_DIGEST"
          # charts/aether/values.yaml carries `repository:` + `tag:` + `digest:`
          # for the proxy image, and `aether.image` (_helpers.tpl) returns
          # `repository@digest` whenever `digest:` is set. A tag-only bump
          # therefore changes NOTHING that gets deployed — both lines must move.
          # (This was a real bug: the chart stayed pinned to the Envoy v1.39.0
          # index across every proxy release.)
          sed -i -E '\|repository: ghcr\.io/bpalermo/aether/aether-proxy|{n;s|^(\s*tag: ).*|\1'"${{ github.sha }}"'|}' \
            charts/aether/values.yaml
          sed -i -E '\|repository: ghcr\.io/bpalermo/aether/aether-proxy|,+4{s|^(\s*digest: ).*|\1"'"$INDEX_DIGEST"'"|}' \
            charts/aether/values.yaml
          # Keep the adjacent provenance comment honest too.
          sed -i -E '\|repository: ghcr\.io/bpalermo/aether/aether-proxy|,+4{s|helper prefers digest over tag\..*|helper prefers digest over tag. Multi-arch index for '"${{ github.sha }}"'.|}' \
            charts/aether/values.yaml
          grep -A5 'repository: ghcr.io/bpalermo/aether/aether-proxy' charts/aether/values.yaml
          # A re-run of an already-pinned sha (or a release whose proxy bits did
          # not change the published index) leaves no diff: skip the branch, the
          # chart bump and the hand-off rather than pushing an empty commit.
          if git diff --quiet -- charts/aether/values.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "chart is already pinned to $SHA / $INDEX_DIGEST — nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Any charts/ change must bump the chart version (CI-enforced).
      - name: Bump chart patch version
        id: chart
        if: steps.pin.outputs.changed == 'true'
        run: |
          # The version is quoted in Chart.yaml (`version: "0.92.1"`).
          cur="$(sed -nE 's|^version: "?([0-9]+\.[0-9]+\.[0-9]+)"?$|\1|p' charts/aether/Chart.yaml)"
          test -n "$cur"
          next="$(echo "$cur" | awk -F. '{printf "%s.%s.%s", $1, $2, $3+1}')"
          sed -i -E "s|^version: \"?${cur}\"?$|version: \"${next}\"|" charts/aether/Chart.yaml
          echo "chart $cur -> $next"
          grep -n '^version:' charts/aether/Chart.yaml
          {
            echo "from=$cur"
            echo "to=$next"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push the chart-pin branch
        id: push
        if: steps.pin.outputs.changed == 'true'
        env:
          MODE: ${{ steps.token.outputs.mode }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:7}"
          branch="chore/proxy-image-bump-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/aether/values.yaml charts/aether/Chart.yaml
          git commit \
            -m "chore(proxy): pin aether chart to aether-proxy:${SHA}" \
            -m "Pushed by the proxy-release run for ${SHA}. Moves both tag: and digest: (aether.image prefers digest over tag) and bumps the chart patch version."
          # In auto mode the branch is pushed with RELEASE_PAT, so branch and PR
          # are attributed to the token's owner and the PR behaves like any human
          # PR. In manual mode the push keeps actions/checkout's GITHUB_TOKEN
          # credentials (#703 behaviour).
          if [ "$MODE" = "auto" ]; then
            echo "::add-mask::$RELEASE_PAT"
            git remote set-url origin \
              "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          # `--force-with-lease` with no value resolves the expected head through
          # the remote's *configured* fetch refspec. actions/checkout clones
          # single-branch (main only), so no other branch has a mapping and the
          # push is rejected as `stale info` even immediately after fetching it.
          # Pass the lease explicitly instead: the fetched head when the branch
          # already exists, the empty string ("must not exist") when it does not.
          lease=""
          if git fetch -q origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null; then
            lease="$(git rev-parse "refs/remotes/origin/${branch}")"
          fi
          git push --force-with-lease="${branch}:${lease}" origin "HEAD:refs/heads/${branch}"
          # Drop the credentialed URL again: nothing after this pushes, and the
          # `gh` calls below carry their token explicitly.
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          {
            echo "branch=$branch"
            echo "short=$short"
          } >> "$GITHUB_OUTPUT"

      # One PR body, written once and used by whichever mode runs: `gh pr create`
      # in auto mode, the copy-paste one-liner in manual mode. Only the paragraph
      # explaining who opens the PR differs between the two.
      - name: Compose the chart-pin PR body
        id: body
        if: steps.pin.outputs.changed == 'true'
        env:
          MODE: ${{ steps.token.outputs.mode }}
          SHA: ${{ github.sha }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
          CHART_FROM: ${{ steps.chart.outputs.from }}
          CHART_TO: ${{ steps.chart.outputs.to }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          prov="$RUNNER_TEMP/provenance.md"
          # Quoted heredoc + __PLACEHOLDERS__: the body is markdown full of
          # backticks, which an expanding heredoc would run as command
          # substitutions.
          cat > "$body" <<'PRBODY'
          Auto-generated by the `proxy-release` run for `__SHA__` (__RUN_URL__).

          Pins the aether chart's proxy image to the multi-arch index published for
          that commit, and bumps the chart patch version.

          | | |
          |---|---|
          | image | `ghcr.io/bpalermo/aether/aether-proxy:__SHA__` |
          | index digest | `__DIGEST__` |
          | chart version | `__CHART_FROM__` -> `__CHART_TO__` |

          `aether.image` (`charts/aether/templates/_helpers.tpl`) prefers `digest:`
          over `tag:`, so both lines move — a tag-only bump would leave the
          previously pinned image deployed (#703, #705). The `proxy-pin` CI job
          re-checks that `tag:`, `digest:` and the registry agree.

          __PROVENANCE__

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          PRBODY
          if [ "$MODE" = "auto" ]; then
            cat > "$prov" <<'AUTOPROV'
          Opened by the `proxy-release` workflow with the `RELEASE_PAT` fine-grained
          token (#727). A PR opened by a *user* token fires `pull_request` normally,
          so `ci` + `proxy` run and report — unlike one opened by `GITHUB_TOKEN`,
          which GitHub's recursion guard leaves without checks and therefore
          permanently unmergeable under the `main` ruleset (#703). Auto-merge
          (squash) is armed: GitHub merges this the moment the required checks pass,
          and the ruleset — which has no bypass actors — is still the only gate.

          Any older `chore/proxy-image-bump-*` PR is superseded and was closed by
          the same run.
          AUTOPROV
          else
            cat > "$prov" <<'MANUALPROV'
          The branch was pushed by the workflow and this PR opened by hand on
          purpose: a PR opened by `GITHUB_TOKEN` fires no `pull_request` events, so
          the required `ci` + `proxy` checks would never report and the `main`
          ruleset (no bypass actors) could never be satisfied (#703).

          If an older `chore/proxy-image-bump-*` PR is still open, this one
          supersedes it — close the older one.
          MANUALPROV
          fi
          awk -v f="$prov" '/__PROVENANCE__/ {while ((getline line < f) > 0) print line; next} {print}' \
            "$body" > "$body.tmp"
          mv "$body.tmp" "$body"
          sed -i \
            -e "s|__SHA__|${SHA}|g" \
            -e "s|__DIGEST__|${INDEX_DIGEST}|g" \
            -e "s|__CHART_FROM__|${CHART_FROM}|g" \
            -e "s|__CHART_TO__|${CHART_TO}|g" \
            -e "s|__RUN_URL__|${RUN_URL}|g" \
            "$body"
          echo "title=chore(proxy): pin aether chart to aether-proxy:${SHA}" >> "$GITHUB_OUTPUT"

      # The rolling audit thread (#724), resolved once and reused by both modes.
      # It is always written with GITHUB_TOKEN: RELEASE_PAT has no Issues
      # permission, and widening it just to comment would be the wrong trade.
      - name: Resolve the tracking issue
        id: issue
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # One rolling tracking issue, exact-title matched (the search is fuzzy,
          # the select is not). Created on first use.
          num="$(gh issue list --state open --limit 100 \
            --search "\"${TRACKING_ISSUE_TITLE}\" in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"${TRACKING_ISSUE_TITLE}\")] | .[0].number // empty")"
          if [ -z "$num" ]; then
            issue_body="$RUNNER_TEMP/issue-body.md"
            cat > "$issue_body" <<'ISSUEBODY'
          Rolling tracker for the `proxy-release` -> chart-pin flow (#703, #727).

          Every `proxy-release` run publishes a commit-SHA-tagged multi-arch
          `aether-proxy` image, pins `charts/aether/values.yaml` to it and pushes
          the result to `chore/proxy-image-bump-<short sha>`.

          With the `RELEASE_PAT` fine-grained token present it also opens the PR and
          arms auto-merge, and comments here with the PR and the token's remaining
          life. Without it (missing, expired, rejected) it falls back to the #703
          hand-off and the comment carries the exact `gh pr create` one-liner to run
          by hand.

          Either way: let `ci` + `proxy` go green, squash-merge, then deploy and
          assert `appVersion` (docs/runbook.md §7).
          ISSUEBODY
            url="$(gh issue create --title "${TRACKING_ISSUE_TITLE}" --body-file "$issue_body")"
            num="${url##*/}"
            echo "created tracking issue #${num}: ${url}"
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # AUTO MODE. Opens the PR with the PAT, arms auto-merge, closes superseded
      # pin PRs. Every failure here is a warning, never a failure: `opened=false`
      # makes the manual hand-off step below run instead, so a bad token costs a
      # human one command and nothing else.
      - name: Open the chart-pin PR and arm auto-merge
        id: pr
        if: steps.pin.outputs.changed == 'true' && steps.token.outputs.mode == 'auto'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
          BRANCH: ${{ steps.push.outputs.branch }}
          TITLE: ${{ steps.body.outputs.title }}
          CHART_FROM: ${{ steps.chart.outputs.from }}
          CHART_TO: ${{ steps.chart.outputs.to }}
          EXPIRY: ${{ steps.token.outputs.expiry }}
          ISSUE: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::add-mask::$RELEASE_PAT"
          if ! url="$(GH_TOKEN="$RELEASE_PAT" gh pr create \
            --base main --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md" | tail -1)"; then
            echo "::warning::gh pr create failed with RELEASE_PAT — falling back to the manual hand-off (#703)"
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          num="${url##*/}"
          echo "opened PR #${num}: ${url}"

          # Hand the merge to GitHub. The ruleset still decides *when*: auto-merge
          # fires only once every required check is green and the branch is current
          # (`main-post-merge` keeps it current — #727).
          automerge="armed (squash)"
          if ! GH_TOKEN="$RELEASE_PAT" gh pr merge "$num" --auto --squash; then
            automerge="**could not be armed** — merge by hand once green"
            echo "::warning::could not arm auto-merge on #${num} — merge it by hand once green"
          fi

          # Close the pin PRs this release supersedes. Two guards, so this can only
          # ever touch PRs the release flow itself produced: the head branch
          # pattern AND the body marker.
          closed=""
          # shellcheck disable=SC2016  # the backticks are jq string literals
          others="$(GH_TOKEN="$RELEASE_PAT" gh pr list --state open --limit 100 \
            --json number,headRefName,body \
            --jq '.[] | select(.headRefName | startswith("chore/proxy-image-bump-"))
                      | select(.body | contains("Auto-generated by the `proxy-release` run"))
                      | .number')"
          for other in $others; do
            [ "$other" = "$num" ] && continue
            if GH_TOKEN="$RELEASE_PAT" gh pr close "$other" \
              --comment "superseded by #${num}" --delete-branch; then
              closed="${closed:+${closed}, }#${other}"
              echo "closed superseded PR #${other}"
            else
              echo "::warning::could not close superseded PR #${other}"
            fi
          done

          record="$RUNNER_TEMP/record.md"
          {
            echo "## Chart pin auto-opened for \`aether-proxy:${SHA}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`ghcr.io/bpalermo/aether/aether-proxy:${SHA}\` |"
            echo "| index digest | \`${INDEX_DIGEST}\` |"
            echo "| chart version | \`${CHART_FROM}\` -> \`${CHART_TO}\` |"
            echo "| branch | \`${BRANCH}\` |"
            echo "| pull request | ${url} |"
            echo "| auto-merge | ${automerge} |"
            echo "| superseded | ${closed:-none} |"
            echo "| release run | ${RUN_URL} |"
            echo "| release token | ${EXPIRY:-expiry unknown} |"
            echo
            echo "Opened by \`proxy-release\` with the \`RELEASE_PAT\` fine-grained token (#727)."
            echo "\`ci\` + \`proxy\` run on it like any PR; GitHub squash-merges it as soon as the"
            echo "\`main\` ruleset is satisfied. Nothing to do here — the deploy stays manual"
            echo "(\`docs/runbook.md\` §7: commit-suffixed chart tag + the \`appVersion\` assert)."
          } > "$record"
          cat "$record" >> "$GITHUB_STEP_SUMMARY"
          GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$ISSUE" --body-file "$record"
          echo "commented on tracking issue #${ISSUE}"
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # MANUAL MODE (#703): no usable token, or the PR could not be opened.
      # Everything a human needs to turn the pushed branch into a PR, written
      # twice — to the run summary (for whoever is looking at the run) and to the
      # rolling tracking issue (the notification channel: a bot comment on an
      # issue the owner subscribes to does notify).
      - name: Hand off the chart-pin branch
        if: steps.pin.outputs.changed == 'true' && steps.pr.outputs.opened != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
          BRANCH: ${{ steps.push.outputs.branch }}
          TITLE: ${{ steps.body.outputs.title }}
          CHART_FROM: ${{ steps.chart.outputs.from }}
          CHART_TO: ${{ steps.chart.outputs.to }}
          REASON: ${{ steps.token.outputs.reason }}
          EXPIRY: ${{ steps.token.outputs.expiry }}
          ISSUE: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          handoff="$RUNNER_TEMP/handoff.md"
          {
            echo "## Chart pin ready for \`aether-proxy:${SHA}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`ghcr.io/bpalermo/aether/aether-proxy:${SHA}\` |"
            echo "| index digest | \`${INDEX_DIGEST}\` |"
            echo "| chart version | \`${CHART_FROM}\` -> \`${CHART_TO}\` |"
            echo "| branch | \`${BRANCH}\` |"
            echo "| release run | ${RUN_URL} |"
            echo "| release token | ${REASON:-unusable}${EXPIRY:+ — ${EXPIRY}} |"
            echo
            echo "The PR was not opened automatically (#727), so this release falls back to"
            echo "the #703 hand-off. Run this from a checkout (bash — it uses process"
            echo "substitution):"
            echo
            echo '```sh'
            echo "gh pr create --base main --head ${BRANCH} --title \"${TITLE}\" --body-file <(cat <<'PRBODY'"
            cat "$body"
            echo "PRBODY"
            echo ")"
            echo '```'
          } > "$handoff"

          cat "$handoff" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$ISSUE" --body-file "$handoff"
          echo "commented on tracking issue #${ISSUE}"

      - name: Chart already pinned to this sha
        if: steps.pin.outputs.changed != 'true'
        env:
          SHA: ${{ github.sha }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
        run: |
          {
            echo "## Chart already pinned to \`aether-proxy:${SHA}\`"
            echo
            echo "\`charts/aether/values.yaml\` needed no change (index \`${INDEX_DIGEST}\`)."
            echo "No branch pushed, no chart bump, no hand-off comment."
          } >> "$GITHUB_STEP_SUMMARY"
