name: proxy-release

# Post-merge release for the custom Envoy (//proxy): build per arch — both legs
# offload the Envoy compile to BuildBuddy RBE (amd64 = x64 pool, arm64 = arm64
# pool, driven from a native arm64 runner). Push each arch by DIGEST (no per-arch tags),
# then assemble one multi-arch manifest tagged with the commit SHA.
# `bazel run //:push` runs the pusher locally, so the arm64 leg keeps a native
# ubuntu-24.04-arm runner (RBE compiles the binary, runner executes the pusher).
on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/proxy-release.yml"

permissions:
  contents: read

# Serialise proxy releases for the same reason as `publish` (#692): the
# `bump-chart` job rewrites `charts/aether/values.yaml` on top of whatever `main`
# is at checkout time and force-pushes the single rolling `chore/proxy-image-bump`
# branch, so two overlapping runs race on that shared branch and the loser's image
# pin is silently dropped. `cancel-in-progress: false` because each run publishes
# a distinct, commit-SHA-tagged multi-arch image that nothing else will republish;
# cancelling one would leave per-arch blobs pushed with no manifest referencing
# them.
concurrency:
  group: proxy-release-main
  cancel-in-progress: false

# No CARGO_BAZEL_REPIN. Under WORKSPACE it was unavoidable — @envoy's
# bazel/dependency_imports_extra.bzl has a top-level
# `load("@envoy_rust_crate_index//:defs.bzl", ...)`, so WORKSPACE evaluation
# fetched the crate_universe repo whatever the extension set was. Under bzlmod
# the `crate` module extension is only evaluated when something in the build
# graph needs a repo from it, and //bazel/build_config compiles in no
# dynamic-modules extension, so nothing does.
env:
  IMAGE: ghcr.io/bpalermo/aether/aether-proxy

jobs:
  build-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 offloads the heavy compile to BuildBuddy's x64 RBE pool.
          - arch: amd64
            runner: ubuntu-latest
            bazel_config: rbe-buildbuddy-amd64
          # arm64 offloads the heavy compile to BuildBuddy's arm64 RBE pool. The
          # ubuntu-24.04-arm runner is required twice over: @clang_platform /
          # @llvm_toolchain derive their exec constraints from the driver's arch,
          # and `bazel run //:push` executes the oci_push tool natively (the
          # pusher is built for arm64 by RBE and needs an arm64 runner).
          - arch: arm64
            runner: ubuntu-24.04-arm
            bazel_config: rbe-buildbuddy-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # aether #651/#653 acceptance gate, run BEFORE the push so a proxy with the
      # wrong GNU build-ID can never reach the registry. Two cheap assertions
      # compose into "the binary's build-ID is a content hash of this binary":
      #   1. //integration:build_id_test — the linked binary carries a
      #      .note.gnu.build-id and it is 20 bytes wide (the SHA-1 shape only
      #      --build-id=sha1 produces);
      #   2. the link action's own command line ends in --build-id=sha1, i.e.
      #      that width came from the content-hash setting and not from some
      #      other 20-byte id (a commit stamp, say — which is what #653 was).
      # Assertion 2 is analysis-only (`aquery`), so it costs no compile, and the
      # ~150 MB binary never leaves the executor. The Envoy compile is shared
      # with the push step below.
      - name: Verify the Envoy GNU build-ID is a content hash
        working-directory: proxy
        run: |
          bazel test \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            //integration:build_id_test
          # lld honours the LAST --build-id on the command line; the toolchain
          # supplies --build-id=md5 earlier, so assert ours is the final one.
          bazel aquery \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            'mnemonic("CppLink", //:envoy)' | tee /tmp/envoy-link.txt | grep -- '--build-id'
          test "$(grep -o -- '--build-id=[a-z0-9]*' /tmp/envoy-link.txt | tail -1)" = "--build-id=sha1"

      - name: Build + push ${{ matrix.arch }} by digest (${{ matrix.bazel_config }})
        # remote_tags=[] and no --tag → oci_push pushes the image by digest only
        # (no tag lingers in the registry). Capture the pushed manifest digest.
        working-directory: proxy
        run: |
          bazel run \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME=${{ github.ref_name }} \
            //:push 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(grep -oE '@sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | head -1 | cut -d@ -f2)"
          test -n "$digest"
          echo "$digest" > "$RUNNER_TEMP/digest.txt"
          echo "pushed ${{ matrix.arch }}: $digest"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error

  manifest:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Index (multi-arch manifest list) digest — what bump-chart pins the chart
      # to. Read back from the registry rather than computed locally: the chart's
      # `aether.image` helper prefers `digest:` over `tag:`, so this value is
      # what actually gets deployed.
      index_digest: ${{ steps.manifest.outputs.index_digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: digests

      # Combine the two per-arch images (by digest) into one multi-arch manifest,
      # tagged with the commit SHA.
      - name: Assemble multi-arch manifest
        id: manifest
        run: |
          amd64="$(cat digests/digest-amd64/digest.txt)"
          arm64="$(cat digests/digest-arm64/digest.txt)"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ github.sha }}" \
            "${IMAGE}@${amd64}" \
            "${IMAGE}@${arm64}"
          # Read the index digest back from the registry. Do NOT sha256sum
          # `imagetools inspect --raw` locally: that is the digest of whatever
          # bytes the CLI chose to print, not necessarily the descriptor the
          # registry stores.
          index="$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' "${IMAGE}:${{ github.sha }}")"
          case "$index" in
            sha256:*) ;;
            *) echo "::error::unexpected index digest '$index'"; exit 1 ;;
          esac
          echo "index_digest=$index" >> "$GITHUB_OUTPUT"
          echo "index: $index"

  # Pin the aether chart to the just-published image (commit-SHA tag) by opening a
  # PR against the protected main branch. peter-evans reuses a single rolling
  # branch, so repeat releases update the same PR; if the chart is already pinned
  # to this SHA there's no diff and no PR.
  bump-chart:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Pin aether chart to aether-proxy:${{ github.sha }}
        env:
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
        run: |
          test -n "$INDEX_DIGEST"
          # charts/aether/values.yaml carries `repository:` + `tag:` + `digest:`
          # for the proxy image, and `aether.image` (_helpers.tpl) returns
          # `repository@digest` whenever `digest:` is set. A tag-only bump
          # therefore changes NOTHING that gets deployed — both lines must move.
          # (This was a real bug: the chart stayed pinned to the Envoy v1.39.0
          # index across every proxy release.)
          sed -i -E '\|repository: ghcr\.io/bpalermo/aether/aether-proxy|{n;s|^(\s*tag: ).*|\1'"${{ github.sha }}"'|}' \
            charts/aether/values.yaml
          sed -i -E '\|repository: ghcr\.io/bpalermo/aether/aether-proxy|,+4{s|^(\s*digest: ).*|\1"'"$INDEX_DIGEST"'"|}' \
            charts/aether/values.yaml
          # Keep the adjacent provenance comment honest too.
          sed -i -E '\|repository: ghcr\.io/bpalermo/aether/aether-proxy|,+4{s|helper prefers digest over tag\..*|helper prefers digest over tag. Multi-arch index for '"${{ github.sha }}"'.|}' \
            charts/aether/values.yaml
          grep -A5 'repository: ghcr.io/bpalermo/aether/aether-proxy' charts/aether/values.yaml

      # Any charts/ change must bump the chart version (CI-enforced).
      - name: Bump chart patch version
        run: |
          # The version is quoted in Chart.yaml (`version: "0.92.1"`).
          cur="$(sed -nE 's|^version: "?([0-9]+\.[0-9]+\.[0-9]+)"?$|\1|p' charts/aether/Chart.yaml)"
          test -n "$cur"
          next="$(echo "$cur" | awk -F. '{printf "%s.%s.%s", $1, $2, $3+1}')"
          sed -i -E "s|^version: \"?${cur}\"?$|version: \"${next}\"|" charts/aether/Chart.yaml
          echo "chart $cur -> $next"
          grep -n '^version:' charts/aether/Chart.yaml

      - name: Open chart-bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          # Default GITHUB_TOKEN works, but PRs it opens don't trigger CI (GitHub
          # recursion guard). If main requires status checks to merge, set a PAT
          # secret CHART_BUMP_PAT so the PR runs CI.
          token: ${{ secrets.CHART_BUMP_PAT || secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/proxy-image-bump
          delete-branch: true
          commit-message: "chore(proxy): pin aether chart to aether-proxy:${{ github.sha }}"
          title: "chore(proxy): pin aether chart to aether-proxy:${{ github.sha }}"
          body: |
            Auto-generated by `proxy-release`. Pins the aether chart's proxy image
            to the multi-arch image published for `${{ github.sha }}`
            (`${{ needs.manifest.outputs.index_digest }}`) and bumps the chart
            patch version.

            `aether.image` prefers `digest:` over `tag:`, so both lines move —
            a tag-only bump would leave the previously pinned image deployed.
