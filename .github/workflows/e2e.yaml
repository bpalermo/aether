# Nightly e2e — conformance (GATEWAY-HTTP + MESH-HTTP), waypoint, replicator, uds,
# uds-csi, authz, l4-routes, eastwest-quic, first-install.
#
# Consolidates the former conformance.yaml, waypoint-e2e.yaml, and
# replicator-e2e.yaml into ONE workflow: a single bazel `build` job builds the
# aether images once (RBE) and ships them as a docker-save artifact; the test
# jobs run in PARALLEL, bazel-free (kind + kubectl/helm + the artifact). This
# removes duplicated toolchain setup + image assembly and gives one nightly
# schedule instead of three staggered ones (parallel jobs on separate runners
# don't contend).
#
# Per-job docs live with each job below; they are lifted verbatim from the
# original workflows (proposals 024, 019, 006, 034 — issues #507/#511). All test
# jobs are hard gates; set the `soft` input to bypass for debugging. Use the
# `only` input to run a subset from workflow_dispatch.
#
# NOT run per PR (too heavy). The per-PR `e2e` job in ci.yaml covers the basic
# data path functionally.
#
# ONE Kubernetes everywhere (#1251): every job gets kind + kubectl + the node
# image from .github/actions/setup-kind, which reads e2e/kind-version.sh — the
# file the local harnesses source too. ONE Helm too (#1580): every job gets it
# from .github/actions/setup-helm, at a release e2e/helm-version.sh pins; only
# first-install asks for a major, and runs under both.
#
# The script-driven jobs share their
# body through .github/actions/run-e2e-script (up -> verify -> diagnostics ->
# down); each stays its own job rather than a matrix leg so `report-failure`
# names the suite that failed, `only=<suite>` selects it, and its check name and
# timeout are unchanged. The two conformance jobs share theirs the same way
# through .github/actions/run-conformance (#1286), which also sets up the
# repository's Go for the suite's `go test` (#1283, //e2e:go_pin_test).

name: e2e

on:
  workflow_dispatch:
    inputs:
      soft:
        description: "Don't fail jobs on a test failure (debugging only; default is a hard gate)"
        type: boolean
        default: false
      only:
        description: "Run a single job (debugging)"
        type: choice
        default: all
        options: [all, gateway-http, mesh-http, waypoint, replicator, uds, uds-csi, authz, l4-routes, eastwest-quic, first-install]
  schedule:
    # Nightly at 04:17 UTC (off the hour to avoid contention).
    - cron: "17 4 * * *"

permissions:
  contents: read

# IMAGE_REGISTRY (<registry>/<namespace> the images are tagged under) is NOT set
# here: it is derived from bazel/registry/registry.bzl, the one registry setting
# (proposal 040), by scripts/image-registry.sh in each job that uses it. The
# script-driven jobs (uds, l4-routes, ...) derive it inside the scripts.
#
# GATEWAY_API_VERSION is a COPY of e2e/gateway-api-version.sh (a workflow cannot
# source it), the one pin every harness reads (#1583);
# //e2e:gateway_api_pin_test fails when they differ.
env:
  GATEWAY_API_VERSION: v1.6.2

jobs:
  # --- The ONLY bazel job: build the aether images once, ship as artifact.
  # The custom aether-proxy is a published image (pulled by kind), not built here.
  # //e2e/udsecho and //e2e/l4echo are TEST workloads (a Go server that binds only
  # a Unix socket; a Go L4 echo backend), built here so the `uds` and `l4-routes`
  # jobs stay bazel-free like their siblings; neither is pushed to a registry.
  # Wrapped in a retry: bazel repository fetches from GitHub releases (gazelle,
  # rules_multitool tools) intermittently 502 on the CDN — transient.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image registry (bazel/registry/registry.bzl)
        run: scripts/image-registry.sh >> "$GITHUB_ENV"

      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel

      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=ci //agent/cmd/agent:image_load //agent/cmd/mesh-dns:image_load //agent/cmd/proxy-supervisor:image_load //agent/cmd/uds-csi:image_load //cni/cmd/cni-install:image_load //registrar/cmd/registrar:image_load //controller/cmd/controller:image_load //e2e/udsecho:image_load //e2e/l4echo:image_load

      - name: Build and load container images
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed; retrying in 20s"; sleep 20; done; return 1; }
          for t in //agent/cmd/agent:image_load //agent/cmd/mesh-dns:image_load \
                   //agent/cmd/proxy-supervisor:image_load //agent/cmd/uds-csi:image_load \
                   //cni/cmd/cni-install:image_load //registrar/cmd/registrar:image_load \
                   //controller/cmd/controller:image_load //e2e/udsecho:image_load \
                   //e2e/l4echo:image_load; do
            retry bazel run --config=ci --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} "$t"
          done

      - name: Save images to artifact
        run: |
          docker save \
            "${IMAGE_REGISTRY}/agent:latest" \
            "${IMAGE_REGISTRY}/mesh-dns:latest" \
            "${IMAGE_REGISTRY}/proxy-supervisor:latest" \
            "${IMAGE_REGISTRY}/uds-csi:latest" \
            "${IMAGE_REGISTRY}/cni-install:latest" \
            "${IMAGE_REGISTRY}/registrar:latest" \
            "${IMAGE_REGISTRY}/controller:latest" \
            "${IMAGE_REGISTRY}/udsecho:latest" \
            "${IMAGE_REGISTRY}/l4echo:latest" \
            -o /tmp/aether-images.tar

      - name: Upload images artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-images
          path: /tmp/aether-images.tar
          retention-days: 1
          compression-level: 1

  # --- Gateway API conformance: GATEWAY-HTTP profile in kind (proposal 024).
  # Throwaway kind cluster, aether EDGE (north-south) with SPIRE disabled,
  # Gateway API CRDs, upstream suite's GATEWAY-HTTP profile. The body (pinned Go,
  # images, kind, CRDs, install, suite, report, diagnostics, teardown) is shared
  # with mesh-http through .github/actions/run-conformance (#1286).
  #
  # Hard gate (43/43 on kind + the reference cluster). Runs the suite's native parallelism:
  # aether's cross-route precedence (oldest creationTimestamp, then ns/name —
  # the reconciler's pre-projection sort + the cache's stable specificity
  # sort) resolves same-match routes deterministically (#533). The earlier
  # wrong-backend failures were per-test-cleanup pollution (1.6 made
  # CleanupTestResources opt-in; the runner now sets it).
  gateway-http:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'gateway-http'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install aether with the EDGE enabled and SPIRE OFF: the edge dials
      # conformance backends over cleartext. edge.tls.enabled=true wires the
      # Kubernetes Secret provider (the HTTPS-listener fixtures need cert
      # resolution or Gateways stay Programmed=False and setup times out).
      # edge.gateway.create=false: the suite brings its own Gateways.
      # cloud-provider-kind gives the edge's per-Gateway LB Services external
      # IPs -> Gateway.status.addresses.
      - name: Run GATEWAY-HTTP conformance
        uses: ./.github/actions/run-conformance
        with:
          profile: GATEWAY-HTTP
          suite: TestAetherGatewayHTTP
          cluster-name: aether-conformance
          gateway-api-version: ${{ env.GATEWAY_API_VERSION }}
          cloud-provider-kind: "true"
          install-description: Install aether (edge, no SPIRE)
          helm-set: |
            edge.enabled=true
            edge.tls.enabled=true
            edge.gateway.create=false
          ready-description: Wait for edge to be Ready
          wait-for-ready: |
            kubectl rollout status deploy/aether-edge -n aether-ingress --timeout=5m || {
              echo "edge not ready; cluster state:"; kubectl get pods -A -o wide; exit 1;
            }
            kubectl rollout status daemonset/aether-agent -n aether-system --timeout=2m || \
              echo "agent DaemonSet not Ready (not required for GATEWAY-HTTP); continuing"
          soft: ${{ github.event.inputs.soft == 'true' }}
          report-file: gateway-http-report.yaml
          report-artifact-name: gateway-http-conformance-report
          logs-dir: /tmp/conformance-logs
          logs-artifact-name: conformance-logs
          diagnostics: |
            echo "=== gatewayclass / gateways / httproutes ==="
            kubectl get gatewayclass,gateways,httproutes -A -o wide || true
            echo "=== edge / registrar / controller / agent logs ==="
            kubectl logs -n aether-ingress -l app.kubernetes.io/name=aether-edge --all-containers --tail=200 || true
            for d in registrar controller; do kubectl logs -n aether-system deploy/aether-$d --all-containers --tail=120 || true; done
            kubectl logs -n aether-system daemonset/aether-agent --all-containers --tail=100 || true
            cp /tmp/cloud-provider-kind.log "$LOGS_DIR/" || true

  # --- MESH-HTTP (east-west GAMMA) conformance: the FULL mesh path on kind —
  # CNI capture (redirect-all default) + GAMMA cap_http tables, SPIRE off
  # (cleartext mesh mode). Hard gate (Core 8/8). Own kind cluster. Same
  # .github/actions/run-conformance body as gateway-http; its diagnostics are
  # collected on every run, not only on failure.
  mesh-http:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'mesh-http'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mesh path on, SPIRE off (cleartext mesh mode); gamma + redirect-all +
      # capture + generateMeshServices + namespace injection are chart defaults.
      - name: Run MESH-HTTP conformance
        uses: ./.github/actions/run-conformance
        with:
          profile: MESH-HTTP
          suite: TestAetherMeshHTTP
          cluster-name: aether-conformance-mesh
          gateway-api-version: ${{ env.GATEWAY_API_VERSION }}
          install-description: Install aether (mesh, no SPIRE)
          helm-set: |
            agent.gamma=true
          ready-description: Wait for mesh control plane to be Ready
          wait-for-ready: |
            kubectl rollout status daemonset/aether-agent -n aether-system --timeout=5m || {
              echo "agent DaemonSet not ready; cluster state:"; kubectl get pods -A -o wide; exit 1;
            }
            kubectl rollout status deploy/aether-registrar -n aether-system --timeout=3m || \
              echo "registrar not Ready; continuing (may still converge)"
            kubectl rollout status deploy/aether-controller -n aether-system --timeout=3m || \
              echo "controller not Ready; continuing (namespace injection may be degraded)"
          soft: ${{ github.event.inputs.soft == 'true' }}
          report-file: mesh-http-report.yaml
          report-artifact-name: mesh-http-conformance-report
          logs-dir: /tmp/mesh-conformance-logs
          logs-artifact-name: mesh-conformance-logs
          logs-when: always
          diagnostics: |
            echo "=== mesh conformance namespaces ==="
            for ns in gateway-conformance-mesh gateway-conformance-mesh-consumer; do
              echo "--- $ns ---"
              kubectl get pods,httproutes,svc,sa -n "$ns" -o wide || true
            done
            echo "=== agent / registrar / controller logs ==="
            kubectl logs -n aether-system daemonset/aether-agent --all-containers --tail=200 || true
            for d in registrar controller; do kubectl logs -n aether-system deploy/aether-$d --all-containers --tail=120 || true; done

  # --- Proposal 019: per-node east/west waypoint cross-cluster data-path e2e.
  # Two kind clusters on the shared docker network + shared etcd + SPIRE on both
  # under one shared upstream CA; asserts client(a) -> echo(b) over the node
  # tunnel with mTLS end-to-end. Harness: e2e/multicluster_waypoint.sh.
  waypoint:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'waypoint'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e/multicluster_waypoint.sh
        uses: ./.github/actions/run-e2e-script
        with:
          script: multicluster_waypoint.sh
          skip-build-var: WAYPOINT_SKIP_BUILD
          verify-description: Verify cross-cluster waypoint call
          soft: ${{ github.event.inputs.soft == 'true' }}
          logs-dir: /tmp/waypoint-logs
          artifact-name: waypoint-e2e-logs
          diagnostics: |
            mkdir -p /tmp/waypoint-logs
            for c in a b; do
              echo "=== cluster $c: all pods ===" | tee -a /tmp/waypoint-logs/pods.txt
              kubectl --context "kind-$c" get pods -A -o wide 2>&1 | tee -a /tmp/waypoint-logs/pods.txt || true
              kind export logs "/tmp/waypoint-logs/$c" --name "$c" || true
              kubectl --context "kind-$c" -n aether-system logs -l app.kubernetes.io/component=agent --all-containers --tail=200 > "/tmp/waypoint-logs/$c-agent.log" 2>&1 || true
              kubectl --context "kind-$c" -n aether-system logs -l app.kubernetes.io/component=proxy -c proxy --tail=200 > "/tmp/waypoint-logs/$c-proxy.log" 2>&1 || true
              kubectl --context "kind-$c" -n spire-mgmt get pods -o wide > "/tmp/waypoint-logs/$c-spire.txt" 2>&1 || true
            done
            echo "=== shared registry (echo endpoint / node_ip) ==="
            docker exec aether-shared-etcd etcdctl get --prefix /aether/v1/regions --keys-only 2>&1 | tee /tmp/waypoint-logs/registry-keys.txt || true

  # --- Proposal 006 Phase 3: two-region etcd replicator failover e2e.
  # Two kind clusters with one etcd PER REGION, registrars cross-wired with
  # --peer-etcd; asserts mirror visibility, data path over the mirror,
  # lease-lapse failover, recovery. Harness: e2e/multicluster_replicator.sh.
  replicator:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'replicator'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e/multicluster_replicator.sh
        uses: ./.github/actions/run-e2e-script
        with:
          script: multicluster_replicator.sh
          skip-build-var: REPLICATOR_SKIP_BUILD
          verify-description: Verify replication + failover
          soft: ${{ github.event.inputs.soft == 'true' }}
          logs-dir: /tmp/replicator-logs
          artifact-name: replicator-e2e-logs
          diagnostics: |
            mkdir -p /tmp/replicator-logs
            for c in a b; do
              echo "=== cluster $c: all pods ===" | tee -a /tmp/replicator-logs/pods.txt
              kubectl --context "kind-$c" get pods -A -o wide 2>&1 | tee -a /tmp/replicator-logs/pods.txt || true
              kind export logs "/tmp/replicator-logs/$c" --name "$c" || true
              kubectl --context "kind-$c" -n aether-system logs -l app.kubernetes.io/component=registrar --tail=300 > "/tmp/replicator-logs/$c-registrar.log" 2>&1 || true
              kubectl --context "kind-$c" -n aether-system logs -l app.kubernetes.io/component=agent --all-containers --tail=200 > "/tmp/replicator-logs/$c-agent.log" 2>&1 || true
              echo "=== regional etcd region-$c keys ===" | tee -a /tmp/replicator-logs/registry-keys.txt
              docker exec "aether-etcd-region-$c" etcdctl get --prefix /aether/v1/regions --keys-only 2>&1 | tee -a /tmp/replicator-logs/registry-keys.txt || true
            done

  # --- Proposal 034 Phases 1 + 1b: UDS delivery to pods.
  # ONE kind cluster, SPIRE off. Deploys a workload that serves only on a Unix
  # socket in its csi.aether.io volume (proposal 039 Phase 2; //e2e/udsecho — it
  # binds no TCP port, so every 200 is proof the node proxy dialed the pipe) and
  # asserts both ways of declaring the socket (pod annotation, EndpointPolicy
  # CR), annotation-over-CR precedence, webhook/CRD rejection of an unusable
  # policy, that a policy naming an unbound socket degrades only its own service
  # (no CDS NACK) and recovers on delete, that an emptyDir-carrier pod is denied
  # at admission, and that the agent counts not_csi / volume_not_declared
  # resolve failures. Harness: e2e/uds.sh. The reference-cluster half of proposal 034's
  # PR 3 (agent restart / storage replay, cross-node) is validated separately.
  uds:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'uds'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e/uds.sh
        uses: ./.github/actions/run-e2e-script
        with:
          script: uds.sh
          skip-build-var: UDS_SKIP_BUILD
          verify-description: Verify UDS delivery, precedence, admission and drift
          soft: ${{ github.event.inputs.soft == 'true' }}
          logs-dir: /tmp/uds-logs
          artifact-name: uds-e2e-logs
          diagnostics: |
            mkdir -p /tmp/uds-logs
            kubectl --context kind-uds get pods -A -o wide 2>&1 | tee /tmp/uds-logs/pods.txt || true
            kind export logs /tmp/uds-logs/kind --name uds || true
            kubectl --context kind-uds get endpointpolicies -A -o yaml > /tmp/uds-logs/endpointpolicies.yaml 2>&1 || true
            kubectl --context kind-uds -n aether-test get deploy,pods,svc -o wide > /tmp/uds-logs/workloads.txt 2>&1 || true
            kubectl --context kind-uds -n aether-system logs -l app.kubernetes.io/component=agent --all-containers --tail=400 > /tmp/uds-logs/agent.log 2>&1 || true
            kubectl --context kind-uds -n aether-system logs -l app.kubernetes.io/component=proxy -c proxy --tail=200 > /tmp/uds-logs/proxy.log 2>&1 || true
            kubectl --context kind-uds -n aether-system logs -l app.kubernetes.io/component=mesh-dns --tail=100 > /tmp/uds-logs/mesh-dns.log 2>&1 || true
            kubectl --context kind-uds -n aether-system logs deploy/aether-controller --all-containers --tail=200 > /tmp/uds-logs/controller.log 2>&1 || true
            kubectl --context kind-uds -n aether-test logs -l app=uds-echo --tail=100 > /tmp/uds-logs/uds-echo.log 2>&1 || true

  # --- Proposal 039 Phase 1: the csi.aether.io CSI node plugin, on its own.
  # ONE kind cluster, SPIRE off, udsCsi.enabled=true. Asserts the kubelet
  # registered the driver (CSINode) through the plugin's OWN registration
  # socket (no node-driver-registrar), that a pod with an fsGroup gets a
  # per-pod tmpfs (mode 2770, gid = fsGroup, nosuid/nodev/noexec/nosymfollow)
  # in which its nonroot app binds a socket that answers, that a pod WITHOUT
  # an fsGroup stays Pending with a FailedMount naming the fix, that deleting
  # the pod removes the host tmpfs, and that a rollout restart of the plugin
  # re-registers and still publishes. Harness: e2e/uds-csi.sh. The driver in
  # isolation; the uds job above covers it as the UDS carrier (Phase 2).
  uds-csi:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'uds-csi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e/uds-csi.sh
        uses: ./.github/actions/run-e2e-script
        with:
          script: uds-csi.sh
          skip-build-var: UDS_CSI_SKIP_BUILD
          verify-description: Verify registration, publish, FailedMount and plugin roll
          soft: ${{ github.event.inputs.soft == 'true' }}
          logs-dir: /tmp/uds-csi-logs
          artifact-name: uds-csi-e2e-logs
          diagnostics: |
            mkdir -p /tmp/uds-csi-logs
            kubectl --context kind-uds-csi get pods -A -o wide 2>&1 | tee /tmp/uds-csi-logs/pods.txt || true
            kind export logs /tmp/uds-csi-logs/kind --name uds-csi || true
            kubectl --context kind-uds-csi get csinode,csidriver -o yaml > /tmp/uds-csi-logs/csi.yaml 2>&1 || true
            kubectl --context kind-uds-csi -n aether-system logs -l app.kubernetes.io/component=uds-csi --tail=400 > /tmp/uds-csi-logs/uds-csi.log 2>&1 || true
            kubectl --context kind-uds-csi -n aether-test get events --sort-by=.lastTimestamp > /tmp/uds-csi-logs/events.txt 2>&1 || true

  # --- Proposal 027 ext_authz sidecar + its pod ordering (#1275).
  # ONE kind cluster, SPIRE off, the chart's OPA preset (failureMode DENY) with
  # the prober canary's allow-header policy on an extAuthz HTTPFilter. Asserts
  # allow -> 200 / deny -> 403 decided by the sidecar, that `authz` is a started
  # native sidecar the proxy container started after, and that a proxy roll
  # whose sidecar image must be pulled again (evicted from the node first: the
  # #1275 trigger) produces ZERO 403s on the allowed path and ZERO ext_authz
  # errors, across a real hot-restart handoff. Then (#1383) the policy is changed
  # by a helm upgrade: the running sidecar reloads it (opa run --watch) with the
  # same pod UID, restart counts and Envoy epoch, a policy that does not parse
  # leaves the last good one deciding, and a valid one recovers it.
  # Harness: e2e/authz.sh.
  authz:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'authz'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e/authz.sh
        uses: ./.github/actions/run-e2e-script
        with:
          script: authz.sh
          skip-build-var: AUTHZ_SKIP_BUILD
          verify-description: Verify ext_authz decisions, sidecar ordering, an error-free proxy roll and an in-place policy reload
          soft: ${{ github.event.inputs.soft == 'true' }}
          logs-dir: /tmp/authz-logs
          artifact-name: authz-e2e-logs
          diagnostics: |
            mkdir -p /tmp/authz-logs
            kubectl --context kind-authz get pods -A -o wide 2>&1 | tee /tmp/authz-logs/pods.txt || true
            kind export logs /tmp/authz-logs/kind --name authz || true
            kubectl --context kind-authz -n aether-system get pods -l app.kubernetes.io/component=proxy -o yaml > /tmp/authz-logs/proxy-pods.yaml 2>&1 || true
            kubectl --context kind-authz -n aether-system logs -l app.kubernetes.io/component=proxy -c proxy --tail=300 > /tmp/authz-logs/proxy.log 2>&1 || true
            kubectl --context kind-authz -n aether-system logs -l app.kubernetes.io/component=proxy -c authz --tail=300 > /tmp/authz-logs/authz.log 2>&1 || true
            kubectl --context kind-authz -n aether-system logs -l app.kubernetes.io/component=agent --all-containers --tail=300 > /tmp/authz-logs/agent.log 2>&1 || true
            kubectl --context kind-authz get httpfilters -A -o yaml > /tmp/authz-logs/httpfilters.yaml 2>&1 || true

  # --- Gateway API L4 routes on the mesh capture path (proposal 018 Phase 3b).
  #
  # All three route types (issue #868). TCPRoute: a weighted 75/25 split and
  # `weight: 0` as DRAIN asserted exactly and in both directions (the #492
  # regression, which no upstream conformance profile covers). TLSRoute: SNI
  # selecting each of two backends, plus the unmatched-SNI fall-through to the
  # TCP floor asserted POSITIVELY. UDPRoute: plaintext delivery with a weight-0
  # backend drained — delivery only, since backend SELECTION is #873 and would
  # fail by design today.
  #
  # Every leg carries `floor` / `unanswered` negative controls so the suite
  # re-proves its own discriminating power on every run rather than once at
  # review time.
  #
  # Unlike `uds` and the conformance jobs this one installs SPIRE: with
  # --spire-enabled=false the mesh has no TCP path at all (no node SVID => no
  # "tcp:" clusters on the source, and the cleartext inbound listener has no TCP
  # floor chain on the destination), so an L4 suite without mTLS would be testing
  # nothing. That is also why the timeout is larger than uds's 45m.
  l4-routes:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'l4-routes'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e/l4routes.sh
        uses: ./.github/actions/run-e2e-script
        with:
          script: l4routes.sh
          skip-build-var: L4_SKIP_BUILD
          verify-description: Verify TCPRoute split/drain/floor, TLSRoute SNI + fall-through, UDPRoute delivery
          soft: ${{ github.event.inputs.soft == 'true' }}
          logs-dir: /tmp/l4-logs
          artifact-name: l4-routes-e2e-logs
          diagnostics: |
            mkdir -p /tmp/l4-logs
            kubectl --context kind-l4routes get pods -A -o wide 2>&1 | tee /tmp/l4-logs/pods.txt || true
            kind export logs /tmp/l4-logs/kind --name l4routes || true
            kubectl --context kind-l4routes get tcproutes -A -o yaml > /tmp/l4-logs/tcproutes.yaml 2>&1 || true
            kubectl --context kind-l4routes get tlsroutes -A -o yaml > /tmp/l4-logs/tlsroutes.yaml 2>&1 || true
            kubectl --context kind-l4routes get udproutes -A -o yaml > /tmp/l4-logs/udproutes.yaml 2>&1 || true
            kubectl --context kind-l4routes -n aether-test get deploy,pods,svc -o wide > /tmp/l4-logs/workloads.txt 2>&1 || true
            kubectl --context kind-l4routes -n aether-system logs -l app.kubernetes.io/component=agent --all-containers --tail=400 > /tmp/l4-logs/agent.log 2>&1 || true
            kubectl --context kind-l4routes -n aether-system logs -l app.kubernetes.io/component=proxy -c proxy --tail=300 > /tmp/l4-logs/proxy.log 2>&1 || true
            kubectl --context kind-l4routes -n aether-system logs -l app.kubernetes.io/component=mesh-dns --tail=100 > /tmp/l4-logs/mesh-dns.log 2>&1 || true
            kubectl --context kind-l4routes -n spire-mgmt logs -l app.kubernetes.io/name=agent --all-containers --tail=200 > /tmp/l4-logs/spire-agent.log 2>&1 || true
            kubectl --context kind-l4routes -n aether-test logs -l app=l4-front --tail=100 > /tmp/l4-logs/l4-front.log 2>&1 || true
            kubectl --context kind-l4routes -n aether-test logs -l app=l4tls-front --tail=100 > /tmp/l4-logs/l4tls-front.log 2>&1 || true
            kubectl --context kind-l4routes -n aether-test logs -l app=l4udp-front --tail=100 > /tmp/l4-logs/l4udp-front.log 2>&1 || true
            # The UDP leg's only voice when a backend is discarded rather than the
            # data path being broken (#873/#874).
            grep -i "UDPRoute input discarded" /tmp/l4-logs/agent.log > /tmp/l4-logs/udp-discards.log 2>&1 || true

  # --- East-west QUIC (proposal 038 Phase 4): the per-pod HTTP/3 inbound on
  # UDP:18008 and the per-source quic: clusters — unconditional, every
  # destination in the node's dependency set (the proving allow-list is gone).
  #
  # Two sources with different ServiceAccounts call two destinations: every
  # request must ride the CALLER'S OWN quic: twin (node proxy admin /clusters
  # host rq_total) and land on the destination's HTTP/3 inbound
  # (listener.inbound_<pod>_h3.http.inbound.downstream_rq_2xx), and the
  # destination must see the caller's own SPIFFE ID in XFCC. A GAMMA weighted
  # route must stay on h2 while a single-backendRef rule rides HTTP/3, and a
  # source pod re-created on a new IP must keep its own identity (Q3).
  #
  # SPIRE is on (QUIC mandates TLS), with the aether#957 DNS SANs on the
  # workloads' ClusterSPIFFEID. The red half of the suite's red-then-green is
  # the negative control `QUIC_DNS_SANS=off ./e2e/eastwest-quic.sh up` (SVIDs
  # without the DNS SANs + the envoy#47740 guard off, so the QUIC client's
  # hostname check fails closed at E2), which is NOT run here — this job is the
  # green half; the header of e2e/eastwest-quic.sh has both commands.
  eastwest-quic:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'eastwest-quic'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e/eastwest-quic.sh
        uses: ./.github/actions/run-e2e-script
        with:
          script: eastwest-quic.sh
          skip-build-var: EWQ_SKIP_BUILD
          verify-description: Verify demand-scoped twins with nothing listed, per-source HTTP/3 + XFCC identity, GAMMA weighted stays h2, identity across a client address change
          soft: ${{ github.event.inputs.soft == 'true' }}
          logs-dir: /tmp/ewq-logs
          artifact-name: eastwest-quic-e2e-logs
          diagnostics: |
            mkdir -p /tmp/ewq-logs
            kubectl --context kind-eastwest-quic get pods -A -o wide 2>&1 | tee /tmp/ewq-logs/pods.txt || true
            kind export logs /tmp/ewq-logs/kind --name eastwest-quic || true
            kubectl --context kind-eastwest-quic get httproutes -A -o yaml > /tmp/ewq-logs/httproutes.yaml 2>&1 || true
            kubectl --context kind-eastwest-quic -n aether-test get deploy,pods,svc -o wide > /tmp/ewq-logs/workloads.txt 2>&1 || true
            kubectl --context kind-eastwest-quic -n aether-system logs -l app.kubernetes.io/component=agent --all-containers --tail=600 > /tmp/ewq-logs/agent.log 2>&1 || true
            kubectl --context kind-eastwest-quic -n aether-system logs -l app.kubernetes.io/component=proxy -c proxy --tail=400 > /tmp/ewq-logs/proxy.log 2>&1 || true
            kubectl --context kind-eastwest-quic -n aether-system logs -l app.kubernetes.io/component=mesh-dns --tail=100 > /tmp/ewq-logs/mesh-dns.log 2>&1 || true
            kubectl --context kind-eastwest-quic -n spire-mgmt logs -l app.kubernetes.io/name=agent --all-containers --tail=200 > /tmp/ewq-logs/spire-agent.log 2>&1 || true
            # The node proxy's admin (hostNetwork; see the script header): the
            # quic: twins with their host counters, and the listeners.
            docker exec eastwest-quic-control-plane curl -s --max-time 5 http://127.0.0.1:9901/clusters > /tmp/ewq-logs/envoy-clusters.txt 2>&1 || true
            docker exec eastwest-quic-control-plane curl -s --max-time 5 http://127.0.0.1:9901/listeners > /tmp/ewq-logs/envoy-listeners.txt 2>&1 || true
            grep -i "east-west QUIC" /tmp/ewq-logs/agent.log > /tmp/ewq-logs/quic-fanout.log 2>&1 || true

  # --- The documented first install, with the chart's default values (#1404).
  # Every other job passes `namespace.create=false` and a set of feature
  # switches, so nothing installed the chart the way docs/getting-started.md
  # says: a default that no helm command could install (#1403) went unnoticed.
  # ONE kind cluster whose API server enforces Pod Security `baseline` by
  # default, SPIRE installed as the documented prerequisite, then the documented
  # commands: the crds chart, `kubectl create namespace` + the three
  # pod-security labels, one `helm upgrade --install ... --create-namespace`
  # with default values (only the image coordinates point at this build), and
  # the same command again. Asserts the docs give those commands, that the
  # cluster does refuse the agent's kind of pod without the labels, that every
  # workload becomes Ready with no pod refused, that namespace.create=true for
  # the release's own namespace fails the render and leaves nothing behind, and
  # that a release which owns its namespace (the pre-2.4.21 default) keeps it
  # across an upgrade, and that a failed first install whose manifest lists a
  # Namespace it does not own (aether and prober charts) cannot be upgraded
  # into deleting it. Harness: e2e/first-install.sh.
  #
  # Under BOTH Helm majors (#1543), one leg each: what the suite asserts about
  # rollback and about a release that owns its namespace differs between Helm 3
  # and Helm 4, and an operator may run either. Every other job runs the default
  # major of e2e/helm-version.sh; //e2e:helm_pin_test holds this matrix.
  first-install:
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.only == 'all' || github.event.inputs.only == 'first-install'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        helm: ["3", "4"]
    # Checkout only; the images arrive as an artifact of this same run.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e/first-install.sh
        uses: ./.github/actions/run-e2e-script
        with:
          script: first-install.sh
          skip-build-var: FIRST_INSTALL_SKIP_BUILD
          verify-description: Verify the documented first install with default values, one upgrade, and that no upgrade deletes the namespace
          soft: ${{ github.event.inputs.soft == 'true' }}
          helm-major: ${{ matrix.helm }}
          logs-dir: /tmp/first-install-logs
          artifact-name: first-install-e2e-logs-helm${{ matrix.helm }}
          diagnostics: |
            mkdir -p /tmp/first-install-logs
            kubectl --context kind-first-install get pods -A -o wide 2>&1 | tee /tmp/first-install-logs/pods.txt || true
            kind export logs /tmp/first-install-logs/kind --name first-install || true
            # Every release whatever its status, with the flags this leg's Helm
            # major takes: `list -A -a` is an error under Helm 4, and `|| true`
            # hid it behind an empty file (#1581).
            . e2e/helm-version.sh || true
            helm --kube-context kind-first-install list $(helm_list_all_flags) > /tmp/first-install-logs/releases.txt 2>&1 || true
            kubectl --context kind-first-install get namespaces -o yaml > /tmp/first-install-logs/namespaces.yaml 2>&1 || true
            kubectl --context kind-first-install -n aether-system get ds,deploy -o wide > /tmp/first-install-logs/workloads.txt 2>&1 || true
            kubectl --context kind-first-install -n aether-system get events --sort-by=.lastTimestamp > /tmp/first-install-logs/events.txt 2>&1 || true
            kubectl --context kind-first-install -n aether-system logs -l app.kubernetes.io/component=agent --all-containers --tail=300 > /tmp/first-install-logs/agent.log 2>&1 || true
            kubectl --context kind-first-install -n spire-mgmt logs -l app.kubernetes.io/name=agent --all-containers --tail=200 > /tmp/first-install-logs/spire-agent.log 2>&1 || true

  # --- Auto-file when the NIGHTLY run fails.
  #
  # This suite sat red for three consecutive nights (07-23..07-25) before anyone
  # noticed: a scheduled run that fails notifies nobody and leaves no artifact, so
  # a real regression (the mesh-DNS decoupling breaking the multi-cluster harness,
  # #589) stayed invisible. This job turns that into a tracked issue.
  #
  # Deliberately scoped to `schedule`: PR runs already surface failures in the PR,
  # so auto-filing those would be pure noise. And it updates ONE rolling issue
  # rather than filing per night — three duplicate issues is how people learn to
  # ignore them, which is the very failure mode this exists to prevent.
  report-failure:
    needs: [build, gateway-http, mesh-http, waypoint, replicator, uds, uds-csi, authz, l4-routes, eastwest-quic, first-install]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Only the two scripts the step runs, from the commit the schedule runs
      # (the default branch's head), and no token left behind. Until #1532 this
      # job had no checkout and the logic was inline.
      - name: Checkout (the report script and its library)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/e2e-report-failure.sh
            scripts/rolling-issue-lib.sh
          sparse-checkout-cone-mode: false
      # ONE rolling issue, the workflow's own, opened with its labels:
      # scripts/e2e-report-failure.sh (//scripts:e2e_report_failure_test).
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` infers the target repository from git remotes. This job had no
          # checkout until #1532, so every `gh issue` call died with "failed to
          # run git: fatal: not a git repository" and the job that exists to
          # report failures reported nothing: it ran for the first time on
          # 2026-09-13 (nothing had failed before that) and failed on every
          # nightly run after, so eight consecutive e2e failures went
          # unannounced. GH_REPO names the repository explicitly; the script
          # refuses to run without it.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: |
            build=${{ needs.build.result }}
            gateway-http=${{ needs.gateway-http.result }}
            mesh-http=${{ needs.mesh-http.result }}
            waypoint=${{ needs.waypoint.result }}
            replicator=${{ needs.replicator.result }}
            uds=${{ needs.uds.result }}
            uds-csi=${{ needs.uds-csi.result }}
            authz=${{ needs.authz.result }}
            l4-routes=${{ needs.l4-routes.result }}
            eastwest-quic=${{ needs.eastwest-quic.result }}
            first-install=${{ needs.first-install.result }}
        run: ./scripts/e2e-report-failure.sh
