name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # Keyless cosign signing (#873 is unrelated; see the Sign step below). The
  # signer exchanges this OIDC token with Fulcio for a short-lived certificate
  # bound to this workflow's identity, so NO private key exists to store or
  # rotate. Without it the sign step fails closed rather than signing with
  # something weaker.
  id-token: write

# Serialise publishes (#692). Every run pushes the *same* mutable chart tags
# (`charts/aether:<Chart.yaml version>` in particular, which does not change per
# commit), so two runs overlapping — a publish takes ~4 minutes, merges can be
# closer than that — race on the registry and the loser is whichever finishes
# first, not the older commit. On 2026-09-05 the older of two runs (77a7d45) won
# over the newer (95b158e) and a deploy silently shipped without #689.
# `cancel-in-progress: false` because a publish is not a redundant check to be
# superseded: cancelling one mid-push would leave the images pushed and the chart
# not (or the chart pushed against a half-published image set).
#
# WHAT THIS DOES NOT GIVE YOU (#880). It protects the RUNNING publish. It does
# NOT make the queue a queue: GitHub holds at most ONE pending run per
# concurrency group, so a merge that lands while a publish is running is queued,
# and the NEXT merge cancels it before it starts a single job. That run ends
# `cancelled` — grey, not red — having pushed nothing, and the commit-suffixed
# chart tag below simply does not exist for that commit. f332061 (#875) was lost
# that way on 2026-09-20.
#
# Widening the group (e.g. per-sha) would drop the mid-push protection above,
# which is the older and worse bug. So the serialisation stays as it is and the
# supersession is made LOUD instead: `.github/workflows/publish-verify.yaml`
# asks the registry, after every publish run reaches a conclusion and on a
# schedule, whether this commit's artifacts are actually there.
concurrency:
  group: publish-main
  cancel-in-progress: false

# The registry (host, namespace, naming) is ONE setting, bazel/img/registry.bzl
# (proposal 040). Bazel reads it directly; the steps below read it through
# scripts/image-registry.sh, which each job appends to $GITHUB_ENV right after
# checkout — never a literal here.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Image registry (bazel/img/registry.bzl)
        run: scripts/image-registry.sh >> "$GITHUB_ENV"
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Log in to the image registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        # BuildBuddy RBE (see .bazelrc `--config=remote`) — runs the build on the
        # hosted executor pool and reuses the cache warmed by PR `ci` builds.
        run: |
          bazel build --stamp --config=remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //...
      # Acceptance guard for #651 and #653. //tools/buildid:release_build_ids
      # fails the build unless every binary that ships in a released image
      # carries a GNU build-ID that (a) is present, (b) equals the SHA-1
      # recomputed from that binary's own bytes, and (c) is shared with no other
      # released binary. It is already covered by the `//...` build above; this
      # step re-states it so a failure names the cause and prints the per-binary
      # report the Pyroscope symbol upload is keyed on.
      - name: Verify released GNU build-IDs
        run: |
          bazel build --stamp --config=remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            //tools/buildid:release_build_ids
          echo "per-binary GNU build-IDs (content-derived, pairwise distinct):"
          cat bazel-bin/tools/buildid/release_build_ids.txt
      # `*.push` publishes each chart together with the images it references
      # (aether.push -> agent + mesh-dns + cni-install + registrar + controller
      # images + the aether chart; crds.push -> the MeshConfig CRD chart;
      # prober.push -> prober chart + image), so a single GHCR login covers images
      # and charts. Adding an image to a chart's `images` attr is all that is needed
      # to get it published — no separate push step (mesh-dns, #583).
      - name: Push charts + images
        env:
          HELM_REGISTRY_USERNAME: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bazel run --stamp --config=remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //charts/crds:crds.push
          bazel run --stamp --config=remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //charts/aether:aether.push
          # …and the same chart again under `charts/aether:<version>-<full sha>`
          # (#692). The bare `<version>` tag above does not change per commit, so
          # it alone cannot tell you which commit is deployed; this one can never
          # be reused. Chart only — the images were just pushed by digest above.
          bazel run --stamp --config=remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //charts/aether:aether_commit.push_registry
          bazel run --stamp --config=remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //charts/prober:prober.push
          # udsecho: UDS validation workloads (proposal 034 PR 3b) — chart + image
          # bundle like prober; the chart pins the image digest at package time.
          bazel run --stamp --config=remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //charts/udsecho:udsecho.push

      - name: Build cosign (Bazel-pinned, local)
        # cosign comes from the rules_img_signer_cosign bazel_dep (MODULE.bazel):
        # the official release binary for this runner, sha256-pinned in that
        # module's lock (v3.1.2 at 0.0.1). //tools/cosign runs it. This replaces
        # sigstore/cosign-installer, whose action pin also pinned the binary --
        # here the pin is the MODULE.bazel.lock entry, reviewed like any other
        # dependency bump, and the same binary signs here, verifies below and in
        # publish-verify.yaml, and is what `bazel run //tools/cosign` gives a
        # workstation. Bumping cosign is bumping that bazel_dep.
        #
        # LOCAL, deliberately: no --config=remote on these invocations, so the
        # binary is fetched and exec'd on this runner and nothing about signing
        # touches the RBE executor. `bazel run` execs the binary with THIS
        # step's environment (the Bazel client's), so the GitHub OIDC variables
        # keyless signing reads -- ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN, present
        # because of `id-token: write` -- reach cosign unchanged;
        # --incompatible_strict_action_env and --action_env only shape BUILD
        # actions, never the run. Built once here so a fetch failure is its own
        # red step rather than a mid-loop one.
        run: bazel build //tools/cosign

      # Sign every published image, keyless.
      #
      # WHERE THE SIGNATURE GOES: cosign's tag scheme puts it in the SAME
      # repository as the image, under a tag derived from the image digest --
      # `sha256:abc…` becomes the tag `sha256-abc….sig`. It is an ordinary OCI
      # image manifest whose layer is
      # application/vnd.dev.cosign.simplesigning.v1+json, with the signature,
      # certificate and Rekor bundle in its annotations.
      #
      # **ghcr.io does not implement the Referrers API.** Verified against four
      # repositories including our own and oras-project/oras -- GET
      # /v2/<repo>/referrers/<digest> returns 404 on all of them while
      # /v2/<repo>/tags/list and /manifests/ succeed with the same token.
      #
      # So the signature lands in a TAG either way, and which tag depends on the
      # cosign major:
      #
      #   cosign 2.x            `sha256-<digest>.sig`   plain signature manifest
      #   cosign 3.x (default)  `sha256-<digest>`       OCI 1.1 fallback index
      #
      # We ran cosign 2 until 2026-09-24, so everything published before then carries
      # the legacy shape. scripts/registry-lib.sh accepts EITHER and rejects BOTH --
      # see registry_signature_layout(). On a registry that DOES serve the
      # Referrers API (quay.io, proposal 040 phase 2) cosign 3 attaches the bundle
      # as a real referrer and writes no tag; the library reads that layout too.
      #
      # An earlier attempt (#924) tried to KEEP the legacy shape with
      # `--new-bundle-format=false` and failed in CI: cosign 3's keyless path rejects
      # it outright ("must provide --new-bundle-format or --bundle where applicable
      # with --signing-config"). Holding the layout is not a reachable state on v3
      # keyless. Do not re-add that flag.
      #
      # DO NOT pin --new-bundle-format on the verify below expecting it to assert the
      # layout. Measured: `=false` fails closed against a v3 signature (exit 10), but
      # `=true` still ACCEPTS a legacy `.sig` (exit 0) -- it asserts nothing. The
      # layout assertion lives in publish-verify.yaml, which asks the REGISTRY rather
      # than asking the same binary that just wrote the signature whether it likes it.
      #
      # On rules_img's own signing (signing_config + the rules_img_signer_cosign
      # `sign-oci-artifact` plugin): NOT used, even though that same module now
      # supplies our cosign CLI. rules_img 0.3.21's signing_config docstring says
      # "The signature is then pushed to the image's repository as an OCI
      # referrer", and ghcr.io has no Referrers API (above); our whole sign /
      # verify / sweep layout is cosign's `sha256-<hex>` tag. We take the module's
      # CLI only, and sign here with it exactly as before.
      #
      # cosign v3.1.2 (from v3.0.6) hides --new-bundle-format from --help as
      # deprecated-for-v4; the bundle format is the default either way, and this
      # step passes no bundle flag. Whether v3.1.2 still writes the `sha256-<hex>`
      # fallback tag on ghcr.io is asserted after every publish by publish-verify's
      # registry-side layout check, not assumed here.
      #
      # --recursive signs the index AND every child manifest. Our images are
      # multi-arch (amd64/arm64), so signing only the index would leave anyone who
      # pulls by per-arch digest with an unsigned manifest. The same reasoning
      # applies to VERIFYING, and `cosign verify` has no --recursive: the verify
      # step below walks the children itself (#925).
      #
      # Signing is a separate step AFTER the pushes rather than part of them: a
      # signature that fails to attach must not leave the images unpublished, and
      # the images are pushed by digest above so nothing here can change what was
      # published.
      - name: Sign published images (keyless)
        env:
          COSIGN_YES: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The registry-read helpers and, crucially, the list of published image
          # repositories live in ONE place, shared with the #880 verifier that
          # later asserts these same artifacts landed. Two copies of the repo
          # list could drift, and a verifier missing a repo would pass while that
          # image was never published at all.
          #
          # registry_all_tags() paginates. It was written after this step failed
          # on e3b58e6 by reading 100 of 667 tags (#875) -- the tag existed and
          # the lookup could not see it, so a correct step reported the images
          # unpublished. See scripts/registry-lib.sh for the full story.
          GHCR_TOKEN="${GH_TOKEN}"
          export GHCR_TOKEN
          # shellcheck source=scripts/registry-lib.sh
          . ./scripts/registry-lib.sh

          # A missing entry in REGISTRY_IMAGE_REPOS silently ships an UNSIGNED
          # image, so the verify step below re-reads this same list.
          repos=("${REGISTRY_IMAGE_REPOS[@]}")
          if [ "${#repos[@]}" -eq 0 ]; then
            echo "::error::no image repositories (scripts/image-registry.sh could not read bazel/img/registry.bzl)"
            exit 1
          fi

          signed=0
          for repo in "${repos[@]}"; do
            tok="$(registry_registry_token "$repo")"

            # The commit-suffixed tag (`<tag>-<full sha>`) is the only immutable
            # one -- `dev` is rewritten by every publish (#692).
            tags="$(registry_all_tags "$repo" "$tok")"
            n_tags="$(printf '%s\n' "$tags" | grep -c . || true)"
            tag="$(printf '%s\n' "$tags" | grep -E -- "-${COMMIT}$" | head -1)"
            if [ -z "$tag" ]; then
              # Report the scan size. "not found in 667" is a real absence;
              # "not found in 100" means the pagination regressed, and the two
              # must never look the same again.
              echo "::error::no tag ending in -${COMMIT} in ${repo} (scanned ${n_tags} tags); refusing to sign a tag that is not this commit"
              exit 1
            fi
            echo "resolved ${repo}: ${tag} (scanned ${n_tags} tags)"

            # Resolve each image's INDEX DIGEST rather than signing a tag. Signing
            # a tag re-resolves it inside cosign, which is a TOCTOU window against
            # a mutable tag; the digest is what was actually published.
            digest="$(registry_manifest_digest "$repo" "$tag" "$tok")"
            if [ -z "$digest" ]; then
              echo "::error::could not resolve a digest for ${REGISTRY_HOST}/${repo}:${tag}"
              exit 1
            fi

            echo "signing ${REGISTRY_HOST}/${repo}@${digest} (from ${tag})"
            bazel run //tools/cosign -- sign --yes --recursive "${REGISTRY_HOST}/${repo}@${digest}"
            # Hand the EXACT reference to the verify step. It must not re-resolve
            # the list itself: a second copy of the repo list can drift from this
            # one, and re-resolving a tag would let verify pass against something
            # other than what was signed.
            echo "${REGISTRY_HOST}/${repo}@${digest}" >> signed-images.txt
            signed=$((signed + 1))
          done

          # A loop that signs nothing must not report success. This is the same
          # class of defect as the shellcheck aspect that linted zero files
          # (#853): a step that passes because it did nothing is worse than a
          # failing one.
          if [ "$signed" -ne "${#repos[@]}" ]; then
            echo "::error::signed ${signed} of ${#repos[@]} images"
            exit 1
          fi
          echo "signed ${signed} image(s)"

      # Prove the signatures are actually there AND verifiable. Without this the
      # sign step could succeed while attaching something nothing can verify, and
      # nobody would find out until an admission controller began rejecting
      # images.
      #
      # It verifies the exact digests the sign step recorded -- not a re-derived
      # list and not a tag -- so it cannot pass against a different artefact than
      # the one that was signed.
      #
      # AND every child manifest of each of them (#925). `cosign sign --recursive`
      # above signs the per-arch manifests, but `cosign verify` has no
      # `--recursive` (not v2.4.1, v3.0.6 or v3.1.2): verifying the recorded index
      # digests alone checked eight signatures and left the sixteen per-arch ones
      # -- the manifests a node actually pulls -- signed and never checked. The
      # script walks each index's `.manifests[]` from the registry and verifies
      # every child with the same identity and issuer; an index it cannot
      # enumerate, or one with no children, fails the step rather than passing a
      # walk over nothing.
      - name: Verify the signatures (every index and every child manifest)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # An empty or missing list means the sign step signed nothing while
          # reporting success. Fail rather than "verify" zero images (#853).
          if [ ! -s signed-images.txt ]; then
            echo "::error::no signed images were recorded -- the sign step signed nothing"
            exit 1
          fi
          # Identity: publish.yaml on this repository, any ref. Issuer: GitHub
          # Actions OIDC. Both are the script's defaults; spelled out so this step
          # reads without opening the script.
          CERT_IDENTITY_REGEXP="^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/publish\\.yaml@" \
          CERT_OIDC_ISSUER=https://token.actions.githubusercontent.com \
            bazel run //tools/cosign:verify_image_signatures -- --file signed-images.txt
