name: ci

# Always triggers on every PR (no path filters) so the `ci` gate check below
# always reports — a required check that is skipped by a path filter would block
# merges forever. The `changes` job does the coarse path scoping (proxy vs
# control-plane); the `diff` job then uses bazel-diff to scope the build/test
# legs to only the targets a PR actually impacts. The proxy workspace has its own
# `proxy` workflow with the symmetric `proxy` gate.
on:
  pull_request:
    branches:
      - main
      # Stacked PRs: a PR whose base is another `upgrade/**` branch must still
      # get the `ci` gate, otherwise the required check never reports on it.
      - "upgrade/**"

permissions:
  contents: read
  pull-requests: read

# No registry literal here: the registry is ONE setting, bazel/registry/registry.bzl
# (proposal 040), read through scripts/image-registry.sh where a job needs it.
# The `shell` job's scripts/check-registry-config.sh keeps it that way.

jobs:
  # Coarse path scoping lives here (not in `on:`) so the workflow always runs and
  # the `ci` gate always reports. control_plane = any changed file outside the
  # //proxy sibling workspace, which has its own `proxy` gate.
  #
  # `predicate-quantifier` is load-bearing, not decoration. Under the action's
  # default (`some`) the rule items are simply OR-ed, and picomatch compiles a
  # leading `!` into "matches everything the positive pattern does NOT" — so
  # `'!proxy/**'` matched `agent/...`, `docs/...`, everything, and the filter was
  # true for every file ever changed. The negations below were inert from the day
  # they were written: `control_plane` has never once been `false`, and every
  # proxy-only PR still paid for bazel-diff, the chart-bump check and the dep
  # audit. `some-with-excludes` (v4) is the quantifier that means what the list
  # says: a file counts when at least one positive pattern matches it and no
  # negated pattern does. An exclusion is final — the action returns `false` the
  # moment one matches, so a later positive cannot add a path back.
  #
  # Only the proxy workspace is excluded. Documentation deliberately is NOT:
  # `//:website_docs` (BUILD.bazel) feeds `README.md`, `AGENTS.md`,
  # `charts/README.md`, `docs/**/*.md` and `.github/workflows/e2e.yaml` into
  # `//website:site_test`, an ordinary test, so a docs-only PR must reach
  # bazel-diff and run the strict site build (a dead link fails review instead of
  # production). `!(*.md)` carves the proxy's Markdown back out of the exclusion
  # for the same reason: `website/staged/proxy-README.md` is a symlink to
  # `proxy/README.md`, so it is an input to that same test — and proxy.yml now
  # excludes Markdown from the Envoy compile, which leaves this as its only gate.
  # Only a *leading* `!` negates a pattern; the `!( )` extglob inside is ordinary
  # picomatch syntax and does not make the pattern an exclusion.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control_plane: ${{ steps.filter.outputs.control_plane }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            control_plane:
              - '**'
              - '!proxy/**/!(*.md)'
              - '!.github/workflows/proxy.yml'
              - '!.github/workflows/proxy-release.yml'

  # Fine-grained scoping: bazel-diff computes the targets impacted by this PR and
  # splits the impacted tests into unit/integration/e2e. The legs below build/test
  # only what changed and skip entirely when nothing they cover is impacted. Falls
  # back to a full run if the base is unreachable or bazel-diff fails (see the
  # script). Analysis only — no BuildBuddy key needed here.
  diff:
    needs: changes
    if: needs.changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_any: ${{ steps.impacted.outputs.has_any }}
      has_unit: ${{ steps.impacted.outputs.has_unit }}
      has_integration: ${{ steps.impacted.outputs.has_integration }}
      has_e2e: ${{ steps.impacted.outputs.has_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history so the base commit is reachable for the diff.
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
        with:
          # The repository-cache SAVER (see .github/actions/setup-bazel): this
          # job's warm-up fetches a superset of what every other job restores.
          cache-save: true
      - name: Warm the Bazel repository cache (fetch + analysis of //..., retried)
        run: scripts/ci-bazel-warmup.sh --config=ci //...
      - name: Download bazel-diff
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel-diff.jar" \
            https://github.com/Tinder/bazel-diff/releases/download/v26.0.1/bazel-diff_deploy.jar
      - name: Compute impacted targets
        id: impacted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BAZEL_DIFF_JAR: ${{ runner.temp }}/bazel-diff.jar
          OUT_DIR: ${{ runner.temp }}/bazel-diff-out
        run: |
          # Run from a copy outside the tree: the script git-checkouts the base and
          # head revisions, which would otherwise swap the script file mid-run.
          cp scripts/ci-impacted-targets.sh "$RUNNER_TEMP/impacted.sh"
          bash "$RUNNER_TEMP/impacted.sh"
      - name: Upload impacted target lists
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/bazel-diff-out/impacted_*.txt
          if-no-files-found: error

  chart-version-bump:
    needs: changes
    if: needs.changes.outputs.control_plane == 'true'
    # Any change under charts/<name>/ must bump that chart's Chart.yaml version.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base commit is reachable for the diff.
          fetch-depth: 0
      - name: Require a Chart.yaml version bump for chart changes
        run: scripts/check-chart-version-bump.sh "${{ github.event.pull_request.base.sha }}"

  deps-audit:
    needs: changes
    if: needs.changes.outputs.control_plane == 'true'
    # go.mod/go.sum must carry no residue: no go.sum module outside the build
    # list, no direct require that nothing imports, no unannotated Bazel-only
    # tool. `go mod tidy` cannot police this here (the generated proto packages
    # exist only as Bazel outputs, so it fails on every import of them), so the
    # audit is driven from the module graph + the Bazel graph instead. Cheap by
    # design: `go list -m all` plus greps, no bazel build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The go tool runs as a subprocess of `bazel run`, so --repo_env does not
      # reach it; set the proxy in the environment.
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh @rules_go//go
      - name: Audit the Go dependency surface
        run: scripts/go-deps-audit.sh

  # ShellCheck over the ROOT workspace's own shell (#853). The sibling of
  # proxy.yml's `shell` job, and here for the mirror-image reason: that job lives
  # in `proxy` because `ci`'s `changes` filter excludes `proxy/**/!(*.md)`, so a
  # proxy-only PR skips this whole workflow. This gate covers scripts/, e2e/ and
  # bazel/, none of which is excluded — `control_plane` is `'**'` minus the proxy
  # tree — so a PR that touches nothing but a root shell script lands here and
  # nowhere else. Putting it in `proxy` would make it skip in exactly the case it
  # exists for, which is the same bug #853 is about.
  #
  # Its own job rather than steps inside `test`, for three reasons. `test` needs
  # the BuildBuddy key and the RBE path to offload compiles, and this has no
  # compile to offload — `--config=lint` plus fail_on_violation, NOT
  # `--config=ci`. `test` is `needs: [changes, diff]` and skips when bazel-diff
  # finds nothing impacted, so the shell gate would inherit a scoping decision it
  # has no reason to trust. And the completeness check below is not a Bazel
  # target at all. `test` still lints any impacted sh_* target as a side effect of
  # `--config=ci`; that is a second net, not this one.
  #
  # Cheap by construction: shellcheck over the root workspace's shell (70
  # scripts as of #1276), no toolchain, no Go, so it reports in a few minutes
  # instead of riding the critical path.
  shell:
    needs: changes
    if: needs.changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the publish-verify control harness drives the REAL
          # verifier, whose aether-proxy pin check walks charts/aether/values.yaml
          # history to find the commit that introduced a pin (#984). A shallow
          # checkout makes that lookup fail closed (exit 2) and the control red.
          fetch-depth: 0
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=lint --@aspect_rules_lint//lint:fail_on_violation //scripts:all @aspect_rules_lint//lint:shellcheck_bin

      # First: is every script actually reachable by the aspect? The srcs are
      # per-package globs and a glob cannot cross a package boundary, so a script
      # added under a directory with no sh_* target would pass the lint step below
      # by simply not being in it — the vacuous-gate failure mode one level down.
      - name: Every root-workspace shell script is covered by an sh_* target
        run: scripts/check-shell-lint.sh

      # The //proxy workspace is behind //.bazelignore, out of every aspect's
      # reach, so its shell is ShellCheck'd by a direct run of the same tool
      # (its Starlark is buildifier-linted by the `format` job, #1245). The
      # `proxy` workflow runs it on proxy/ changes; it is here too because a
      # root change (a ShellCheck bump, .shellcheckrc) can newly flag a proxy
      # file.
      - name: Lint the //proxy workspace's shell
        run: scripts/lint-proxy.sh

      # scripts/ci-bazel-warmup.sh (#1001) retries a repository-fetch failure
      # 3x with backoff and any other failure not at all. A stub bazel pins
      # both, so a refactor cannot quietly drop the retry or start masking a
      # broken BUILD file behind a minute of backoff.
      - name: CI warm-up retry contract is exact
        run: scripts/check-ci-bazel-warmup.sh

      # The verifier accepts two cosign signature-tag layouts (cosign 2's
      # `.sig` and cosign 3's bare fallback index) so artifacts published
      # before the v3 migration stay verifiable. "Accept either" is one grep
      # away from "accept anything", and the state that matters is BOTH tags
      # present — a half-finished migration, which presence-only checking
      # reports as healthy. No registry access; the tag lists are literals.
      - name: Signature layout resolution is exact
        run: scripts/check-signature-layout.sh

      # Signature checks walk every child manifest of each multi-arch index
      # (#925: `cosign verify` has no --recursive). A walk that yields zero
      # children turns "verify every child" into a loop over nothing, so every
      # shape that is not an index with well-formed children must be refused.
      # No registry access; the documents are literals.
      - name: Child-manifest enumeration refuses empty walks
        run: scripts/check-index-children.sh

      # publish-verify's sweep checks only commits that were the HEAD of a push
      # to main (#975: a stack merge lands several commits in one push and
      # publish runs only for the last). A narrowing is where a gate goes
      # vacuous, so this pins that intermediates are skipped, every head is
      # checked, and an empty or abbreviated head list fails closed. No network.
      - name: Push-head selection is exact
        run: scripts/check-push-head-selection.sh

      # publish-verify runs an expected-red control before its gate (#930): a
      # never-published commit must make the verifier exit 1 with every
      # artifact MISSING. This drives the REAL verifier against a fake registry
      # (no network), and shows the control rejects every wrong red — a
      # verifier that stopped counting MISSING, an empty tag listing, a MISSING
      # line for another commit, a stray `ok` — so the control cannot go
      # vacuous either.
      - name: publish-verify expected-red control is exact
        run: scripts/check-publish-verify-control.sh

      # publish-verify checks the aether-proxy digest each commit's chart PINS
      # (#984), every one of them (#1191 removed the pre-signing skip). This
      # pins that the digest is read from the proxy block (never the
      # supervisor's, right below it), that only image_reference("proxy") is
      # accepted, and that the bump-chart rewrite moves exactly that pin. No
      # network.
      - name: aether-proxy pin extraction and rewrite are exact
        run: scripts/check-proxy-pin.sh

      # The Envoy pin (proxy/MODULE.bazel envoy/envoy_api + proxy/.bazelrc's
      # registry commit) is one fact in two files. This is the harness for the
      # gate that checks it (run for real, online, in `envoy-api-parity`) and
      # for scripts/bump-envoy-pin.sh's rewrite, registry-commit selection,
      # carried-patch report and upstream .bazelrc diff: every red case
      # (envoy/envoy_api skew, a branch-name registry, two registry lines, a
      # module dir the registry dropped, ...) must be red. No network.
      - name: Envoy pin checks are exact
        run: scripts/check-envoy-pin.sh --self-test

      # publish-verify looks each expected tag up by name (HEAD
      # /v2/<repo>/manifests/<tag>) instead of paging through every tag (#985):
      # a publish writing tags mid-walk shifted a page boundary past a present
      # signature and the sweep reported it MISSING. This reproduces that race
      # on a fake registry (the old walk must lose the tag, the direct lookup
      # must find it), pins 200/404/other as present/absent/inconclusive, and
      # drives the real verifier end to end. It also plays quay.io (proposal
      # 040): the /v2/auth token endpoint, and the OCI 1.1 Referrers API — a
      # sign-bundle referrer is a signature, a referrers 404 falls back to the
      # tag layouts, a 5xx is inconclusive — and runs the verifier on a
      # throwaway history: a post-cut-over head on the fake quay.io with
      # referrers; pre-cut-over heads refused (exit 2, no request at all: the
      # old registry is decommissioned, proposal 040 phase 4); plus the reds: a
      # post-cut-over head published only to the old registry, a fallback tag
      # where a referrer is promised, and a double-write. No network.
      - name: Registry direct lookup survives a concurrent publish
        run: scripts/check-registry-lookup.sh

      # The registry is ONE setting (bazel/registry/registry.bzl, proposal 040), so
      # the Quay cut-over was a one-file flip. This asserts the setting parses,
      # the //proxy workspace's copy is identical, the aether-proxy pin names
      # image_reference("proxy"), no file outside a written-down allow-list
      # spells the registry out, and no file outside the legacy allow-list
      # spells a pre-cut-over (ghcr.io) coordinate. No network, no Bazel.
      - name: The image registry is one setting
        run: scripts/check-registry-config.sh

      # Then: lint them. The target list comes from a query rather than being
      # written out here, so a new package's sh_library is covered the moment the
      # check above starts demanding one. The empty test is a query-failure
      # tripwire — an empty list would otherwise "pass" by linting nothing, which
      # is the shape of the bug this job exists for.
      - name: ShellCheck the root workspace's shell
        run: |
          mapfile -t targets < <(bazel query 'kind("sh_(binary|library|test)", //...)')
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::the sh_* query returned nothing — refusing to pass a lint gate on an empty set (#853)"
            exit 1
          fi
          printf 'linting %d shell target(s)\n' "${#targets[@]}"
          bazel build \
            --config=lint \
            --@aspect_rules_lint//lint:fail_on_violation \
            "${targets[@]}"

  # actionlint over every workflow, with the pinned actionlint and the same
  # ShellCheck the lint aspects run (//bazel/actionlint; config in
  # .github/actionlint.yaml). It was run by hand, never enforced, and ~20
  # findings had accumulated — among them `github.head_ref` interpolated into
  # four inline scripts in this file. Deliberately unconditional, like
  # envoy-api-parity: `changes` excludes proxy.yml and proxy-release.yml from
  # control_plane, and those are workflows too. No RBE, no BuildBuddy key: one
  # local test over YAML.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh //bazel/actionlint:actionlint_test
      - name: actionlint (every workflow under .github/workflows)
        run: bazel test --test_output=all //bazel/actionlint:actionlint_test

  # Formatting was configured but never enforced. `make format-check` exists in
  # the Makefile, gofumpt/buildifier/shfmt/buf are wired up in
  # bazel/format/BUILD.bazel, CLAUDE.md documents the target — and no job ran it,
  # so `e2e/multiprotocol.sh` merged in #901 with two-space indentation against
  # shfmt's tabs, green, and sat unformatted on main (#906).
  #
  # Note what made that easy to miss: the `shell` job above DID shellcheck that
  # exact file. Lint coverage was real; format coverage was absent. A green
  # shell job is not evidence the file was formatted.
  format:
    needs: changes
    if: needs.changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh //:format.check

      # Every language bazel/format/BUILD.bazel configures; the action fails if
      # the formatter did not report running for one of them (#853).
      - name: Check formatting
        uses: ./.github/actions/format-check
        with:
          languages: |
            Starlark
            Go
            Shell
            Protocol Buffer

  envoy-api-parity:
    needs: changes
    # The agent's xDS bindings (go.mod: go-control-plane/envoy) must track the
    # Envoy the proxy is built from (proxy/MODULE.bazel: envoy_api). Cheap, and
    # deliberately unconditional: either side can move on its own.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the xDS bindings to match the proxy's Envoy
        run: scripts/check-envoy-api-parity.sh
      # Here rather than in `shell` because this job is unconditional: a
      # proxy-only pin bump skips `shell` (control_plane is false) and is exactly
      # the change this gate exists for. Online: the pinned bazel-registry
      # commit must still serve envoy, envoy_api and every `.envoy` sibling at
      # the declared versions (raw.githubusercontent.com, HTTP 200), and the
      # snapshot's source.json must name the Envoy commit the version does.
      - name: Require the Envoy pin to be self-consistent and resolvable
        run: scripts/check-envoy-pin.sh --online

  # The chart's aether-proxy pin has three parts that must agree: `tag:`,
  # `digest:`, and what the registry actually serves under that tag. Two shipped
  # bugs were exactly this class and both were invisible until a deploy: #648 (a
  # hand-pin whose digest came from a different build) and #705 (proxy-release
  # moved only `tag:`, and `aether.image` prefers `digest:`, so every proxy
  # release silently kept deploying the Envoy v1.39.0 index). Deliberately
  # unconditional — no `if`, no path filter: the pin can rot without
  # values.yaml changing (tags are mutable), //bazel/proxy_pin reads these same
  # lines to pick the binary //test/envoy_validate runs, and a required check
  # that skips is a required check that never reports.
  proxy-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The aether-proxy image (image_reference("proxy"), bazel/registry/registry.bzl)
      # is a PUBLIC package — anonymous pull works and nothing below logs in.
      # Declared for the day it is made private (then a docker/login-action step
      # is needed too, as //bazel/proxy_pin says).
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image registry (bazel/registry/registry.bzl)
        run: scripts/image-registry.sh >> "$GITHUB_ENV"
      - name: Setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Assert the aether-proxy pin agrees with the registry and the chart
        run: |
          values=charts/aether/values.yaml

          # Parse exactly the way bazel/proxy_pin/extensions.bzl does, so the two
          # can never disagree about what the pin is: the first `repository:`
          # that is exactly image_reference("proxy") ($PROXY_IMAGE, from the
          # step above) — no other registry is accepted (proposal 040 phase 4)
          # — then `tag:` / `digest:` inside that same mapping — indentation >=
          # the repository key's, with blank and comment-only lines not ending
          # the block. The tag is resolved against that registry below.
          accepted="${PROXY_IMAGE:?scripts/image-registry.sh did not export PROXY_IMAGE}"
          scalar() {
            raw="${1%%#*}"
            raw="$(printf '%s' "$raw" | sed -e 's|^[[:space:]]*||' -e 's|[[:space:]]*$||')"
            case "$raw" in
              \"*\") raw="${raw#\"}" ; raw="${raw%\"}" ;;
              \'*\') raw="${raw#\'}" ; raw="${raw%\'}" ;;
            esac
            printf '%s' "$raw"
          }

          repository=""
          tag=""
          digest=""
          in_block=0
          key_indent=0
          while IFS= read -r line; do
            stripped="${line#"${line%%[![:space:]]*}"}"
            indent=$((${#line} - ${#stripped}))
            if [ "$in_block" -eq 0 ]; then
              case "$stripped" in
                repository:*)
                  candidate="$(scalar "${stripped#repository:}")"
                  if [ -n "$candidate" ] && grep -qxF -- "$candidate" <<<"$accepted"; then
                    repository="$candidate"
                    key_indent="$indent"
                    in_block=1
                  fi
                  ;;
              esac
              continue
            fi
            if [ -z "$stripped" ]; then
              continue
            fi
            case "$stripped" in
              \#*) continue ;;
            esac
            if [ "$indent" -lt "$key_indent" ]; then
              break
            fi
            case "$stripped" in
              tag:*) tag="$(scalar "${stripped#tag:}")" ;;
              digest:*)
                digest="$(scalar "${stripped#digest:}")"
                break
                ;;
            esac
          done < "$values"

          fail=0
          if [ -z "$repository" ]; then
            echo "::error file=${values}::no aether-proxy image pin found. Expected a line \`repository: <ref>\` with <ref> exactly ${accepted} (image_reference(\"proxy\"), bazel/registry/registry.bzl) — the same contract bazel/proxy_pin/extensions.bzl parses."
            fail=1
          fi
          if [ -z "$tag" ]; then
            echo "::error file=${values}::the aether-proxy image mapping has no \`tag:\`. proxy-release pins tag AND digest together (#703)."
            fail=1
          fi
          if [ -z "$digest" ]; then
            echo "::error file=${values}::the aether-proxy image mapping has no \`digest:\`. aether.image prefers digest over tag, so a tag-only pin deploys whatever the OLD digest was (#705)."
            fail=1
          elif ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error file=${values}::the aether-proxy \`digest:\` is \"${digest}\", which is not a sha256:<64 hex chars> reference."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "chart pin: ${repository}"
          echo "  tag:    ${tag}"
          echo "  digest: ${digest}"

          # (1) registry: the tag must resolve to exactly the pinned digest.
          registry_digest=""
          if ! registry_digest="$(docker buildx imagetools inspect "${repository}:${tag}" \
            --format '{{.Manifest.Digest}}' 2> "$RUNNER_TEMP/imagetools.err")"; then
            echo "::error file=${values}::could not resolve ${repository}:${tag} in the registry. aether-proxy is a public package, so this is not an auth problem — the tag does not exist (a hand-typed sha, or a proxy-release that never published):"
            sed 's|^|  |' "$RUNNER_TEMP/imagetools.err"
            fail=1
          fi
          if [ -z "$registry_digest" ]; then
            :
          elif [ "$registry_digest" = "$digest" ]; then
            echo "registry: ${repository}:${tag} -> ${registry_digest} (agrees with digest:)"
          else
            echo "::error file=${values}::\`tag:\` and \`digest:\` disagree with the registry — ${repository}:${tag} resolves to ${registry_digest}, but \`digest:\` pins ${digest}. Both lines must come from the same build; move them together (#648, #703)."
            fail=1
          fi

          # (2) + (3) the chart must actually deploy repository@digest. This is
          # the assertion that catches a stale or missing digest, because
          # aether.image falls back to the tag and nothing else would notice.
          helm template aether charts/aether > "$RUNNER_TEMP/rendered.yaml"
          if grep -qF "\"${repository}@${digest}\"" "$RUNNER_TEMP/rendered.yaml"; then
            echo "helm: proxy container renders ${repository}@${digest}"
          else
            echo "::error file=${values}::helm template does not render the proxy container as ${repository}@${digest}. Rendered aether-proxy references:"
            grep -n "$repository" "$RUNNER_TEMP/rendered.yaml" || echo "  (none at all)"
            fail=1
          fi
          if grep -qF "\"${repository}:${tag}\"" "$RUNNER_TEMP/rendered.yaml"; then
            echo "::error file=${values}::helm template renders the proxy container by TAG (${repository}:${tag}). aether.image must resolve to ${repository}@${digest} — a tag reference is mutable and is exactly the #705 bug."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "aether-proxy pin is consistent: values.yaml tag + digest, the registry, and the rendered chart all agree."

  # Build every impacted target (compile + lint on BuildBuddy RBE; warms the
  # remote cache the integration/e2e legs reuse) and run the impacted unit tests.
  test:
    needs: [changes, diff]
    if: needs.changes.outputs.control_plane == 'true' && needs.diff.outputs.has_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The PR's branch name is attacker-controlled text: it reaches the build
    # metadata through the environment, never interpolated into a script
    # (actionlint `expression`, as in proxy.yml).
    env:
      BRANCH_NAME: ${{ github.head_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Download impacted target lists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/impacted
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=ci --target_pattern_file=${{ runner.temp }}/impacted/impacted_build.txt
      - name: Build impacted targets
        run: |
          bazel build --config=ci \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.event.pull_request.head.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME="$BRANCH_NAME" \
            --target_pattern_file=${{ runner.temp }}/impacted/impacted_build.txt
      - name: Unit tests
        if: needs.diff.outputs.has_unit == 'true'
        run: |
          bazel test --config=ci \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --target_pattern_file=${{ runner.temp }}/impacted/impacted_unit.txt
      # #673/#683: the aether-proxy and aether-mesh-dns readiness probes must stay
      # stdlib-only binaries — their entire value is what they do NOT link
      # (package init() runs before main(), so a heavy import costs every pod on
      # every probe and no argv check can avoid it). Each target's :deps_test
      # asserts this on the linked ELF; this is the build-graph half, which fails
      # on a forbidden dependency even before the linker drops it as unreachable.
      # Analysis-only and cheap — the query runs against the cache the build step
      # above just warmed.
      - name: Guard readiness-prober linkage
        run: scripts/check-proxy-ready-deps.sh --config=ci
      # #772 phase B2: the aether-proxy pod's PID 1 must stay the carved-out
      # supervisor, not the agent binary it used to be. It is staged onto the pod's
      # volume and re-launched on every hot restart, so every linked package is paid
      # in Go package init() — which runs before main(), so no argv check can avoid
      # it. //agent/cmd/proxy-supervisor:deps_test asserts this on the linked ELF;
      # this is the build-graph half.
      - name: Guard proxy-supervisor linkage
        run: scripts/check-proxy-supervisor-deps.sh --config=ci
      # Proposal 039: the csi.aether.io node plugin runs privileged on every node
      # with Bidirectional mount propagation, and talks only to the kubelet and
      # the kernel — a Kubernetes client, the xDS stack or SPIRE in its link set
      # is attack surface in the most privileged aether process.
      # //agent/cmd/uds-csi:deps_test asserts this on the linked ELF; this is
      # the build-graph half.
      - name: Guard uds-csi linkage
        run: scripts/check-uds-csi-deps.sh --config=ci
      # The two other slim binaries on every node. The CNI plugin is exec'd by the
      # container runtime for every pod ADD/DEL, and mesh-dns was carved out of the
      # agent (#583) so the node's resolver survives agent rolls without the
      # agent's payload. Each :deps_test pins the module set (allow-list + budget)
      # on the linked ELF; these are the build-graph halves.
      - name: Guard cni plugin linkage
        run: scripts/check-cni-deps.sh --config=ci
      - name: Guard mesh-dns linkage
        run: scripts/check-mesh-dns-deps.sh --config=ci

  # Race gate (#772). Runs the same impacted test set as `test` + `integration`,
  # rebuilt with the Go race detector. Scoped by bazel-diff exactly like the
  # other legs, so an unrelated PR pays nothing; a whole-tree race run measured
  # 169 s locally, which is the worst case here.
  #
  # Test EXECUTION is local: `--config=ci` pulls in `--config=remote`, which sets
  # `--strategy=TestRunner=local`. Only the (race-instrumented) compiles go to
  # RBE. That matters twice over — the Docker-bound integration tests need the
  # runner's Docker, and the race config is a different Bazel configuration, so
  # nothing is shared with the `test` job's cache.
  #
  # Depends on `test` so a PR that is already red does not burn a second runner,
  # and so this runs in parallel with `integration`/`e2e` rather than extending
  # the critical path.
  race:
    needs: [changes, diff, test]
    if: needs.changes.outputs.control_plane == 'true' && (needs.diff.outputs.has_unit == 'true' || needs.diff.outputs.has_integration == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The PR's branch name is attacker-controlled text: it reaches the build
    # metadata through the environment, never interpolated into a script
    # (actionlint `expression`, as in proxy.yml).
    env:
      BRANCH_NAME: ${{ github.head_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Download impacted target lists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/impacted
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=ci --target_pattern_file=${{ runner.temp }}/impacted/impacted_build.txt
      # The 19 concurrency-heavy packages from the 2026-09-15 races review get
      # three runs each: the one production race the detector has ever caught
      # (etcd Close vs. watchLoop, #772/R1) reproduced 2 of 3 runs and was
      # invisible to a single pass. Everything else impacted runs once.
      - name: Split impacted tests into hot / normal
        id: split
        env:
          IMPACTED: ${{ runner.temp }}/impacted
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/hot_packages.txt" <<'EOF'
          agent/internal/capture
          agent/internal/cni/server
          agent/internal/cniconflist
          agent/internal/configimport
          agent/internal/edge/portalloc
          agent/internal/meshdns
          agent/internal/node
          agent/internal/proxy/hotrestart
          agent/internal/spire
          agent/internal/xds/cache
          agent/internal/xds/server
          agent/storage
          common/grpcserver
          common/spire
          common/xds
          prober/internal/prober
          registrar/internal/replicator
          registrar/internal/server
          registry/internal/etcd
          registry/internal/registrar
          EOF
          : >"$RUNNER_TEMP/race_hot.txt"
          : >"$RUNNER_TEMP/race_normal.txt"
          # go_test only. The race config forces cgo on, which rules_go cannot
          # do for the pure/static binaries the image and chart targets link
          # ("race instrumentation can't be enabled when cgo is disabled"), so a
          # literal `bazel test //... --config=race` fails analysis on ~8 of
          # them. They are not race candidates anyway — buf-lint, helm-template
          # and image-structure tests run no Go under test.
          bazel query 'kind(go_test, tests(//...))' --noshow_progress 2>/dev/null |
            sort -u >"$RUNNER_TEMP/go_tests.txt"
          # A failed query would empty the race list and silently pass the gate.
          if [ ! -s "$RUNNER_TEMP/go_tests.txt" ]; then
            echo "::error::go_test query returned nothing — refusing to pass the race gate on an empty set"
            exit 1
          fi
          # `|| true`: an empty leg makes grep exit 1, which pipefail would turn
          # into a job failure. An empty combined list is handled by has_* below.
          { cat "$IMPACTED/impacted_unit.txt" "$IMPACTED/impacted_integration.txt" 2>/dev/null |
            grep -v '^[[:space:]]*$' | sort -u |
            grep -Fxf "$RUNNER_TEMP/go_tests.txt" >"$RUNNER_TEMP/race_all.txt"; } || true
          while IFS= read -r label; do
            pkg="${label%%:*}"
            pkg="${pkg#//}"
            if grep -qxF "$pkg" "$RUNNER_TEMP/hot_packages.txt"; then
              printf '%s\n' "$label" >>"$RUNNER_TEMP/race_hot.txt"
            else
              printf '%s\n' "$label" >>"$RUNNER_TEMP/race_normal.txt"
            fi
          done <"$RUNNER_TEMP/race_all.txt"
          echo "has_hot=$([ -s "$RUNNER_TEMP/race_hot.txt" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "has_normal=$([ -s "$RUNNER_TEMP/race_normal.txt" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo ">> race: hot=$(wc -l <"$RUNNER_TEMP/race_hot.txt") normal=$(wc -l <"$RUNNER_TEMP/race_normal.txt")"
      - name: Race tests
        if: steps.split.outputs.has_normal == 'true'
        run: |
          bazel test --config=ci --config=race \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.event.pull_request.head.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME="$BRANCH_NAME" \
            --target_pattern_file=${{ runner.temp }}/race_normal.txt
      - name: Race tests (concurrency-heavy packages, 3 runs)
        if: steps.split.outputs.has_hot == 'true'
        run: |
          bazel test --config=ci --config=race --runs_per_test=3 \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.event.pull_request.head.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME="$BRANCH_NAME" \
            --target_pattern_file=${{ runner.temp }}/race_hot.txt

  # Proposal 038: the CNI's transparent-capture divert against a REAL kernel.
  # cni/internal/plugin:capture_netns_test creates network namespaces, programs
  # the nft table + policy route, and drives sockets through it -- including
  # deleting the `ct direction reply accept` rule mid-test to prove it is the
  # rule that keeps every pod's inbound connections alive. That needs root and
  # nft_tproxy, which the Bazel sandbox has neither of, so the test SKIPS as a
  # normal user and this job builds the binary and runs it under sudo. The
  # binary never skips as root: a kernel without tproxy fails, because the same
  # kernel would ship uncaptured pods.
  netns:
    needs: [changes, diff]
    if: needs.changes.outputs.control_plane == 'true' && needs.diff.outputs.has_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The PR's branch name is attacker-controlled text: it reaches the build
    # metadata through the environment, never interpolated into a script
    # (actionlint `expression`, as in proxy.yml).
    env:
      BRANCH_NAME: ${{ github.head_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Download impacted target lists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/impacted
      - name: Is the netns gate impacted
        id: impacted
        run: |
          if grep -qxF '//cni/internal/plugin:capture_netns_test' "${{ runner.temp }}/impacted/impacted_unit.txt"; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo ">> //cni/internal/plugin:capture_netns_test not impacted by this change; nothing to run"
          fi
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        if: steps.impacted.outputs.run == 'true'
        run: scripts/ci-bazel-warmup.sh --config=ci //cni/internal/plugin:capture_netns_test
      - name: Build the netns test binary
        if: steps.impacted.outputs.run == 'true'
        run: |
          bazel build --config=ci \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.event.pull_request.head.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME="$BRANCH_NAME" \
            //cni/internal/plugin:capture_netns_test
          bazel cquery --config=ci --output=files \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            //cni/internal/plugin:capture_netns_test >"$RUNNER_TEMP/netns_test_bin"
          test -x "$(cat "$RUNNER_TEMP/netns_test_bin")"
      - name: Run it as root against the runner kernel
        if: steps.impacted.outputs.run == 'true'
        run: |
          sudo modprobe nf_tables nft_tproxy
          bin="$(cat "$RUNNER_TEMP/netns_test_bin")"
          sudo "$bin" -test.v 2>&1 | tee "$RUNNER_TEMP/netns_test.log"
          # Anti-vacuity: a skip (non-root, or a wrong binary) prints no PASS
          # line for the gate. The job is green only if the test actually ran.
          grep -q -- '--- PASS: TestCaptureDivertInNetns' "$RUNNER_TEMP/netns_test.log" || {
            echo "::error::TestCaptureDivertInNetns did not run to a PASS (skipped?) -- the kernel gate is vacuous"
            exit 1
          }

  integration:
    needs: [changes, diff, test]
    if: needs.changes.outputs.control_plane == 'true' && needs.diff.outputs.has_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Download impacted target lists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/impacted
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=ci --target_pattern_file=${{ runner.temp }}/impacted/impacted_integration.txt
      - name: Integration tests
        run: |
          bazel test --config=ci \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --target_pattern_file=${{ runner.temp }}/impacted/impacted_integration.txt

  e2e:
    needs: [changes, diff, test]
    if: needs.changes.outputs.control_plane == 'true' && needs.diff.outputs.has_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=ci //agent/cmd/agent:image_load //cni/cmd/cni-install:image_load //registrar/cmd/registrar:image_load //test/e2e:e2e_test
      - name: Build and load container images
        run: |
          bazel run --config=ci --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //agent/cmd/agent:image_load
          bazel run --config=ci --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //cni/cmd/cni-install:image_load
          bazel run --config=ci --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //registrar/cmd/registrar:image_load
      # kind + kubectl from e2e/kind-version.sh (#1251), installed only: the
      # cluster is created by //test/e2e from test/e2e/testdata/kind-config.yaml,
      # whose node image //e2e:kind_pin_test holds to the same pin.
      - name: Setup kind (pinned)
        uses: ./.github/actions/setup-kind
      - name: Run e2e tests
        run: |
          bazel test --config=ci \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --test_output=streamed //test/e2e:e2e_test --test_arg=-test.v
      - name: Collect logs on failure
        if: failure()
        run: |
          # The e2e framework destroys the cluster after tests, so logs
          # may not be available. Attempt collection best-effort.
          if kind get clusters 2>/dev/null | grep -q aether-e2e; then
            kind export logs /tmp/e2e-logs --name aether-e2e || true
            echo "=== aether-system pods ==="
            kubectl --context kind-aether-e2e get pods -n aether-system -o wide 2>/dev/null || true
            echo "=== registrar logs ==="
            kubectl --context kind-aether-e2e logs -n aether-system -l app=aether-registrar --all-containers --tail=100 2>/dev/null || true
            echo "=== agent logs ==="
            kubectl --context kind-aether-e2e logs -n aether-system -l app=aether-agent --all-containers --tail=100 2>/dev/null || true
            echo "=== events ==="
            kubectl --context kind-aether-e2e get events -n aether-system --sort-by='.lastTimestamp' 2>/dev/null || true
          else
            echo "kind cluster already destroyed by test teardown"
          fi
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: /tmp/e2e-logs
          if-no-files-found: ignore
      - name: Cleanup kind cluster
        if: always()
        run: |
          kind delete cluster --name aether-e2e || true

  # Single required status check. Always runs (if: always()) so it reports on
  # every PR — including proxy-only PRs where the control-plane jobs skip — and
  # fails only if a job that actually ran failed. This is the context required by
  # the main branch ruleset.
  #
  # The `skipped` result is deliberately not in the failure test below: a skipped
  # required check is a *missing* check to GitHub and would block the PR forever,
  # which is the whole reason the gate is a separate fan-in job instead of the
  # legs themselves. `needs.*.result` yields one entry per need, so `contains`
  # sees 'skipped' for every leg bazel-diff or the path filter scoped out and
  # ignores it. Not theoretical: this already reports green on PRs where `e2e`
  # (and often `integration`) skip for an empty impact set.
  ci:
    if: always()
    needs: [changes, diff, chart-version-bump, deps-audit, envoy-api-parity, proxy-pin, actionlint, shell, format, test, race, netns, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any control-plane job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a required control-plane job failed or was cancelled"
          exit 1
