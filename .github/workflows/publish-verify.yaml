# Did the commit actually publish? (#880)
#
# THE HOLE THIS CLOSES
#
# `publish.yaml` serialises on `concurrency: { group: publish-main,
# cancel-in-progress: false }` (#692). That keeps a RUNNING publish from being
# killed mid-push, which is right and must stay. What it does not do — and what
# its comment used to imply — is make the queue a queue: GitHub holds at most
# ONE pending run per concurrency group, so a second merge inside a publish
# window cancels the first merge's pending run. The superseded run ends
# `cancelled`, starts zero jobs, pushes nothing, and shows up in the Actions UI
# as a grey circle rather than a red X. On 2026-09-20 f332061 (#875) was lost
# exactly that way and nobody noticed until someone went looking at the registry.
#
# This workflow makes that loud. It does NOT check that a workflow exited 0 — a
# run that exits 0 having pushed nothing, a run that was cancelled at queue time
# and a run that never existed all have to be caught, and only one question
# separates them: are the artifacts for this commit in the registry?
# `scripts/verify-published-artifacts.sh` asks the registry that question
# directly — the registry that commit's own bazel/registry/registry.bzl names (read
# AS OF each head, like the chart versions; quay.io with signature referrers).
# Heads from before the Quay cut-over are not checked: their registry is
# decommissioned (proposal 040 phase 4), and the verifier exits 2 on one.
#
# It does not touch publish.yaml's serialisation: it is a separate workflow, in
# a separate concurrency group, and it never pushes anything (the release
# workflow is the only publisher, always).
#
# TWO TRIGGERS, ON PURPOSE
#
#   workflow_run  — the primary detector. Fires the moment a publish run reaches
#     a conclusion, whatever that conclusion is, and verifies THAT run's commit.
#     There is no race to lose: a run that ended `cancelled` is never going to
#     push anything later, so a missing artifact at that point is final. One
#     exception: a run that did not succeed for a commit main has already
#     moved past is SUPERSEDED and skipped with a notice (the newer push's
#     publish carries the change); main's head is always verified.
#
#   schedule      — the backstop, and it exists because the primary detector
#     rests on an assumption: that `workflow_run: [completed]` really does fire
#     for a run cancelled before it started a job. If that assumption is ever
#     wrong, or the event is dropped, or this workflow itself fails to start,
#     the sweep re-checks the last day of main every two hours and the gap still
#     surfaces — a few hours late instead of immediately.
#
#     It starts where the last GREEN scheduled sweep left off, not a full day
#     back every time (#1281): a fixed window verified every head about eleven
#     times, and a busy day's 34-40 heads at 45 s-2 min each (registry lookups
#     plus ~27 cosign verifications) ran three sweeps into the timeout, which
#     reported nothing. With no green sweep within the day it reads the full
#     day. Step timeouts keep an overrun a FAILED step (reported below), not a
#     cancelled job (silent).
#
#     The sweep checks every PUSH HEAD in that window, not every commit (#975).
#     publish runs once per push, for its head; an atomic stack merge (gh-stack
#     #963 put five squash commits on main in one push headed by 4930733) leaves
#     intermediates that no publish run ever built, so they have no artifacts by
#     construction and nobody can pin them. The heads come from GitHub's
#     activity log for refs/heads/main — the record of the push itself, NOT the
#     list of publish runs, so a push whose publish run was cancelled or never
#     created is still a head and still goes red. A head whose publish was
#     SUPERSEDED (did not succeed, main has moved on) is skipped with a notice,
#     by the workflow_run path's rule (#1282, #1277). Skipped commits are
#     printed by name. See scripts/push-heads-lib.sh.
#
#     The workflow_run path needs no such filter: the commit it verifies is the
#     head of the publish run that just finished, a push head by definition.
#
# Both paths end in the same place: a red run plus a rolling GitHub issue naming
# the commit and the exact registry coordinates that are missing.
name: publish-verify

on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  schedule:
    # Every two hours, off the hour.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to verify (default: the last day of main)"
        type: string
        default: ""

permissions:
  contents: read

# NOT `publish-main` — joining that group would serialise this check behind the
# publishes it is watching. And keyed per commit rather than per workflow,
# because a single shared group is the very defect being fixed here: two
# verifications queued at once would supersede each other and the second commit
# would go unchecked.
concurrency:
  group: publish-verify-${{ github.event.workflow_run.head_sha || github.event.inputs.commit || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Direct manifest lookups (#985) cost ~23 s per commit against ~13 s for
    # the old tag listing; a busy day's --recent sweep (14 heads) took 5m23s.
    # By 2026-10-04 a full-day sweep was 34-40 heads and ~30 min, and three in
    # a row hit this limit (#1281). The sweep now reads only what the last
    # green sweep did not verify, and the gate and cosign steps carry their own
    # timeouts so an overrun FAILS a step and is reported; this job limit is
    # the backstop above both (2 x 20 + ~5 min of setup and reporting).
    timeout-minutes: 50
    permissions:
      contents: read
      # For the rolling failure issue below.
      issues: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ALWAYS the trusted default branch, never the triggering run's head:
          # the scripts this job executes come from main; the commit under
          # verification (TARGET below) is data the scripts read from git
          # history, not code they run (CodeQL actions/untrusted-checkout).
          ref: main
          # Full history: the check reads each charts/*/Chart.yaml AS OF the
          # commit being verified (a commit that bumped a chart publishes under
          # the bumped version), and resolves every abbreviation to a full
          # 40-char sha with git rather than trusting a typed one.
          fetch-depth: 0

      # EXPECTED-RED CONTROL, then the GATE (#930). Two steps so the log never
      # mixes them: the control's MISSING lines are the point of the control and
      # must never be read as a publish failure — it writes neither verify.log
      # nor the job summary.
      #
      # The gate's only demonstrated red used to be a real defect (1e31e3a,
      # #929), and it aged out of the sweep window with nothing fixed, leaving a
      # gate whose failure path was asserted rather than shown (#853). So every
      # run first hands the verifier a commit that can never have artifacts —
      # built here with `git commit-tree` on origin/main's tree, never pushed,
      # so it exists on every run and can never age out — and asserts it goes
      # red for the right reason: exit exactly 1, one MISSING line per
      # coordinate (20) all naming that sha, no `ok` line, and every chart and
      # image absence backed by a witness (a tag the same repository lists,
      # answering 200 to the same lookup — #985) and every line naming the
      # registry the control's tree names. A green for that commit, or a red for
      # another reason, fails the run; exit 2 (registry unreadable) is
      # inconclusive and fails it too. See scripts/publish-verify-control.sh; its offline check
      # runs in ci.yaml.
      - name: Expected-red control (must fail on a never-published commit)
        id: control
        run: ./scripts/publish-verify-control.sh

      # A publish run that ended without success for a commit main has since
      # moved past was superseded (a newer merge replaced its pending run), not
      # lost: the newer publish carries the change. Skip the registry check for
      # it with a notice instead of going red on every such merge, which buried
      # real failures. A successful publish, or main's own head, is still
      # verified and still red when anything is missing.
      # scripts/publish-verify-superseded.sh; //scripts:publish_verify_superseded_test.
      - name: Superseded? (publish not successful, commit no longer main's head)
        id: superseded
        if: github.event_name == 'workflow_run'
        env:
          TARGET: ${{ github.event.workflow_run.head_sha }}
          TRIGGERING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGERING_RUN: ${{ github.event.workflow_run.html_url }}
        run: ./scripts/publish-verify-superseded.sh

      # The gate runs whatever the control concluded: a broken control must not
      # also cost the real check. Only a failed checkout stops it.
      - name: Gate (verify the artifacts for this commit exist in the registry)
        id: verify
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.superseded.outputs.skip != 'true' }}
        # A step timeout FAILS the step, so the issue step below reports it; a
        # job timeout cancels the job, which used to report nothing (#1281).
        timeout-minutes: 20
        env:
          # --recent: start from the last green scheduled sweep (#1281).
          RECENT_SINCE_LAST_GREEN: "1"
          # A publish run's head commit, a manually named commit, or --recent.
          TARGET: ${{ github.event.workflow_run.head_sha || github.event.inputs.commit }}
          TRIGGERING_RUN: ${{ github.event.workflow_run.html_url }}
          TRIGGERING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # The repositories are public: the registry hands out an anonymous
          # pull token, so no registry credential is needed here.
          # `--recent` reads main's push heads from the repository activity log
          # (#975); that endpoint needs only the metadata read every token has.
          # The repository is the runner's own GITHUB_REPOSITORY.
          GH_TOKEN: ${{ github.token }}
          # Each resolved `<registry>/<repo>@<index digest>`, for the cosign pass
          # below to verify (index + every child, #925).
          SIGNED_REFS_OUT: signed-refs.txt
          # The aether-proxy index each commit's chart pins (#984), for the same
          # pass under proxy-release.yml's identity.
          PROXY_SIGNED_REFS_OUT: proxy-signed-refs.txt
        run: |
          set -euo pipefail
          if [ -n "${TARGET}" ]; then
            echo "verifying ${TARGET} (publish run ${TRIGGERING_RUN:-n/a}, conclusion ${TRIGGERING_CONCLUSION:-n/a})"
            # A publish dispatched from a branch has a head commit that the
            # default-branch checkout does not contain. Fetch it rather than
            # failing: "I could not find that commit" and "that commit was never
            # published" must not produce the same alert.
            git rev-parse --verify --quiet "${TARGET}^{commit}" >/dev/null ||
              git fetch --no-tags --depth=1 origin "${TARGET}"
            ./scripts/verify-published-artifacts.sh "${TARGET}" | tee verify.log
          else
            ./scripts/verify-published-artifacts.sh --recent | tee verify.log
          fi

      # The step above asks the registry whether a signature TAG exists for each
      # index and each child manifest. This one asks whether those signatures
      # VERIFY — same identity and issuer publish.yaml's own verify step uses —
      # for every index the step above resolved AND every child manifest under
      # it (#925: `cosign verify` has no --recursive, so the children must be
      # walked explicitly or they are never checked).
      #
      # Same cosign as publish.yaml and proxy-release.yml: `bazel run
      # //bazel/cosign...`, the rules_img_signer_cosign bazel_dep's release
      # binary (sha256 in MODULE.bazel.lock, v3.1.2), fetched and run LOCALLY --
      # no BuildBuddy key, no --config. One pin for all three workflows, by
      # construction. Note the checkout above is `main`, so this is main's
      # cosign whatever commit is under verification.
      - name: Setup Bazel
        if: (success() || steps.verify.conclusion == 'failure') && steps.superseded.outputs.skip != 'true'
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          # Repository cache (#1001): keyed on everything that changes the
          # fetched set, in the root workspace's own namespace. Restore only —
          # the savers are the `diff` jobs of ci.yaml and main.yaml, one per
          # workflow (docs/runbook.md, "CI: external repository fetches").
          cache-version: root-1
          repository-cache: '["MODULE.bazel", "MODULE.bazel.lock", "go.mod", "go.sum"]'
          cache-save: false

      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        if: (success() || steps.verify.conclusion == 'failure') && steps.superseded.outputs.skip != 'true'
        run: scripts/ci-bazel-warmup.sh //bazel/cosign:verify_image_signatures

      - name: Verify the signatures (every index and every child manifest)
        id: cosign
        if: (success() || steps.verify.conclusion == 'failure') && steps.superseded.outputs.skip != 'true'
        # As for the gate: an overrun fails this step and is reported (#1281).
        timeout-minutes: 20
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          if [ ! -s signed-refs.txt ]; then
            # A failed artifact check can legitimately resolve no image (nothing
            # was published); that failure is already red and already reported.
            # A PASSING one that resolved nothing is a vacuous gate (#853).
            if [ "${VERIFY_OUTCOME}" = "failure" ]; then
              echo "no published images resolved; the artifact check above already failed"
              exit 0
            fi
            echo "::error::the artifact check passed but recorded no image digests to verify"
            exit 1
          fi
          rc=0
          CERT_IDENTITY_REGEXP="^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/publish\\.yaml@" \
          CERT_OIDC_ISSUER=https://token.actions.githubusercontent.com \
            bazel run //bazel/cosign:verify_image_signatures -- --file signed-refs.txt | tee cosign.log || rc=$?

          # aether-proxy (#984): the digest each checked commit's chart PINS,
          # signed by proxy-release.yml -- a different workflow, so a different
          # certificate identity, and on main only. Deduplicated: consecutive
          # commits usually ship the same pin. Every pin is checked (#1191 removed
          # the pre-signing skip), so a present pin is always in this file; it can
          # only be empty when the artifact check above already failed (the pin
          # is MISSING). A PASSING check that recorded no proxy pin is a vacuous
          # gate (#853), exactly like signed-refs.txt above.
          if [ -s proxy-signed-refs.txt ]; then
            sort -u proxy-signed-refs.txt > proxy-signed-refs.uniq
            CERT_IDENTITY_REGEXP="^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/proxy-release\\.yml@refs/heads/main\$" \
            CERT_OIDC_ISSUER=https://token.actions.githubusercontent.com \
              bazel run //bazel/cosign:verify_image_signatures -- --file proxy-signed-refs.uniq | tee -a cosign.log || rc=$?
          elif [ "${VERIFY_OUTCOME}" = "failure" ]; then
            echo "aether-proxy: no pinned digest resolved; the artifact check above already failed"
          else
            echo "::error::the artifact check passed but recorded no aether-proxy pin to verify"
            rc=1
          fi
          exit "$rc"

      # A failure here is invisible unless it is written down somewhere a person
      # reads: this workflow is attached to no PR, and the nightly e2e suite sat
      # red for three nights before anyone noticed a scheduled failure (see the
      # `report-failure` job in e2e.yaml, whose shape this copies). ONE rolling
      # issue, reused for consecutive gaps — duplicate issues are how people
      # learn to ignore them, which is the failure mode this exists to prevent.
      #
      # Gated on the verify step specifically: an infrastructure failure (no
      # network, bad checkout) must not file "nothing was published".
      #
      # A CANCELLED run reports too (#1281): three sweeps in a row hit the job
      # timeout, concluded `cancelled`, and this step — then `failure()` only —
      # stayed silent while the backstop verified nothing for a day. The step
      # timeouts above turn an overrun into a failed step; `cancelled()` covers
      # the job limit and anything else that stops a run before it can say
      # whether the artifacts exist. Either way the body says it did not finish.
      - name: Open or update the missing-artifacts issue
        if: github.event_name != 'workflow_dispatch' && (cancelled() || (failure() && (steps.verify.conclusion == 'failure' || steps.cosign.conclusion == 'failure')))
        env:
          VERIFY_CONCLUSION: ${{ steps.verify.conclusion }}
          COSIGN_CONCLUSION: ${{ steps.cosign.conclusion }}
          GH_TOKEN: ${{ github.token }}
          # `gh` infers the repository from git remotes; this job has a checkout,
          # but naming it explicitly is what #858 had to fix in e2e.yaml and it
          # costs nothing to do here.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGERING_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          title="publish: artifacts missing for a commit on main"
          missing="$(sed -nE 's/^[[:space:]]*MISSING[[:space:]]+/MISSING /p' verify.log 2>/dev/null || true)"
          # Signatures that exist but do not verify (wrong identity, unsigned
          # child) come from the cosign step (#925).
          unverified="$(sed -nE 's/^[[:space:]]*FAILED[[:space:]]+/UNVERIFIED /p' cosign.log 2>/dev/null || true)"
          missing="$(printf '%s\n%s\n' "$missing" "$unverified" | grep . || true)"
          lead="A commit on \`main\` is missing artifacts in the image registry (bazel/registry/registry.bzl) — never published, or published only in part. A deploy pinned to it will 404, and \`helm upgrade\` against its commit-suffixed chart tag cannot work."
          if [ -z "$missing" ]; then
            # Nothing recorded as missing: the check did not finish (#1281).
            missing="(none recorded — the check did not finish: gate ${VERIFY_CONCLUSION:-not run}, signatures ${COSIGN_CONCLUSION:-not run}; see the run log)"
            lead="publish-verify did not finish (a step timed out, the run was cancelled, or a lookup was inconclusive), so the commits it was to check are UNVERIFIED — a gap here would have gone unreported."
          fi

          # shellcheck disable=SC2016 # literal Markdown code fences, nothing to expand
          body=$(printf '%s\n\n```\n%s\n```\n\n%s\n%s\n\n%s\n' \
            "$lead" \
            "$missing" \
            "Verification run: ${RUN_URL}" \
            "Publish run: ${TRIGGERING_RUN:-n/a}" \
            "_Filed automatically by \`publish-verify\`; this issue is reused for consecutive gaps. To republish: re-run the cancelled publish run (\`gh run rerun <id>\`), which re-runs at that same commit. Never push images or charts by hand — the release workflow is the only publisher. See docs/runbook.md, \"Pre-flight: did that commit actually publish?\"._")

          num=$(gh issue list --state open --search "in:title \"${title}\"" -L 1 --json number -q '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
            echo "commented on #$num"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # A failed control is a different defect from a missing artifact: the gate
      # itself can no longer be trusted to go red. It gets its own rolling issue
      # so it is never folded into, or mistaken for, "artifacts missing". The
      # title and the body say WHICH failure it was (#1340): the control went
      # GREEN (a vacuous gate), went red for the wrong reason, or was
      # inconclusive (exit 2: the registry stayed unreadable through the
      # control's own re-runs). scripts/publish-verify-control-issue.sh, from
      # the verdict the control step recorded.
      - name: Open or update the vacuous-gate issue
        if: ${{ !cancelled() && steps.control.conclusion == 'failure' && github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/publish-verify-control-issue.sh

      # The other half of the rolling issue (#1316): a GREEN run for main's
      # head, or a green sweep, closes it with a comment naming this run. Run
      # 37522284996 filed the issue for one 502 from the registry, the next
      # three runs were green, and it stayed open saying UNVERIFIED. Which
      # green runs count (never a superseded skip, never a manual run) is
      # scripts/publish-verify-close-issue.sh; //scripts:publish_verify_close_issue_test.
      # The same step closes the control's issues above, on any green run:
      # its control went red as expected (#1340).
      - name: Close the missing-artifacts issue (a green run for main's head, or a green sweep)
        if: success() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET: ${{ github.event.workflow_run.head_sha }}
          SUPERSEDED: ${{ steps.superseded.outputs.skip }}
          VERIFY_CONCLUSION: ${{ steps.verify.conclusion }}
          COSIGN_CONCLUSION: ${{ steps.cosign.conclusion }}
        run: ./scripts/publish-verify-close-issue.sh
