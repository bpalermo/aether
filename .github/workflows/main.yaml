name: main-post-merge

# Post-merge validation of `main` (issue #679).
#
# `ci.yaml` validates a PR's merge into its base as the base was when the run
# started (#1459: the merge commit against its first parent). That is the right
# scope for the PR's own change, but it is structurally blind to the combination
# of two concurrently-open PRs: the combined state does not exist anywhere until
# the second merge creates it, and until this workflow existed nothing looked at
# it. (Instance: #671 and #672 each registered CNI metrics against a base that
# did not contain the other; the squash of the second put `newCNIMetrics` at
# gocognit 16 against a limit of 15 on `main`, and the violation only surfaced
# days later on the unrelated PRs #676/#677.)
#
# So: on every push to `main`, re-run the same build+lint+unit-test leg `ci.yaml`
# runs, with the impact set computed as **the merge commit vs its first parent**
# (`HEAD^`) — i.e. exactly what this merge added to `main`, evaluated against the
# tree that now exists. `scripts/ci-impacted-targets.sh` falls back to a full
# `//...` build+test whenever bazel-diff cannot compute the set (no parent,
# unreachable base, tool failure), so `main` is never silently under-validated.
#
# This is a detector, not a preventer: it turns the skew into a red `main` run
# instead of a mystery failure on a bystander PR. Branch protection's
# `required_status_checks.strict` (require branches up to date before merging) is
# what actually prevents the bad merge.
#
# Nothing here is a required status check: this workflow runs on a push, after
# the merge, and deliberately does not touch the pull_request path. What `main`
# requires of a pull request is `ci` (ci.yaml), `proxy` (proxy.yml), `codeql`
# (codeql.yaml) and the code-scanning app's `CodeQL` (#1507; AGENTS.md, "Pull
# requests"). The `main` job below is what turns the run red when a leg did not
# do what `diff` decided (#1501), and a run that did not pass is recorded on a
# rolling issue by main-watch.yaml (#1506), which finds this workflow by its
# `name:` above and reads the `main` job by its name.
# Integration and e2e are not repeated here: `e2e.yaml` runs the heavy suite
# nightly (`schedule: 17 4 * * *`, plus `workflow_dispatch`) — it has no `push`
# trigger, so a `main` push is covered by the next nightly rather than
# immediately — and the integration leg is bounded by the same PR scope this job
# re-derives.
#
# Deliberately NO `concurrency` group (unlike `publish.yaml`/`proxy-release.yml`,
# serialised in #692). Those race because they write shared mutable state — a
# registry tag, a rolling branch. This workflow only reads: each run validates its
# own commit against its own first parent and writes nothing outside its own run.
# Serialising it would delay the detection it exists to provide, and a queued-run
# eviction would silently skip a commit's validation.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Same bazel-diff analysis as ci.yaml's `diff` job, on the commit pushed to
  # main and its first parent instead of a PR's merge commit and its first
  # parent. Analysis only — no BuildBuddy key needed here.
  #
  # No coarse `paths-filter` scoping (unlike ci.yaml): there is no required check
  # to keep reporting here, and a proxy-only merge naturally yields an empty
  # impact set, because proxy/ is a sibling Bazel workspace outside `//...`.
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_any: ${{ steps.impacted.outputs.has_any }}
      has_unit: ${{ steps.impacted.outputs.has_unit }}
      has_integration: ${{ steps.impacted.outputs.has_integration }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history so the first parent is reachable for the diff.
          fetch-depth: 0
      - name: Resolve first parent
        id: base
        run: |
          # A merge/squash commit's first parent is the previous tip of main, so
          # HEAD^..HEAD is precisely what this merge introduced. An empty value
          # makes the script fall back to a full run (root commit, shallow clone).
          if base="$(git rev-parse --verify -q 'HEAD^')"; then
            echo "sha=$base" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::HEAD has no first parent; falling back to a full //... run"
            echo "sha=" >>"$GITHUB_OUTPUT"
          fi
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
        with:
          # The repository-cache SAVER (see .github/actions/setup-bazel): this
          # job's warm-up fetches a superset of what every other job restores.
          cache-save: true
      - name: Warm the Bazel repository cache (fetch + analysis of //..., retried)
        run: scripts/ci-bazel-warmup.sh --config=ci //...
      - name: Download bazel-diff
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel-diff.jar" \
            https://github.com/Tinder/bazel-diff/releases/download/v26.0.1/bazel-diff_deploy.jar
      - name: Compute impacted targets
        id: impacted
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          BAZEL_DIFF_JAR: ${{ runner.temp }}/bazel-diff.jar
          OUT_DIR: ${{ runner.temp }}/bazel-diff-out
        run: |
          # Run from a copy outside the tree: the script git-checkouts the base and
          # head revisions, which would otherwise swap the script file mid-run.
          cp scripts/ci-impacted-targets.sh "$RUNNER_TEMP/impacted.sh"
          bash "$RUNNER_TEMP/impacted.sh"
      - name: Upload impacted target lists
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impacted-targets-main
          path: ${{ runner.temp }}/bazel-diff-out/impacted_*.txt
          if-no-files-found: error

  # Byte-for-byte the same legs as ci.yaml's `test` job: build every impacted
  # target (compile + lint on BuildBuddy RBE), run the impacted unit tests
  # (--config=ci implies --config=remote, which pins TestRunner to the local
  # strategy — tests must NOT run remotely), then the five linkage guards.
  #
  # `environment: main` (#1314): that environment's BUILDBUDDY_ORG_API_KEY is a
  # Read+Write BuildBuddy key, and it shadows the repository-level secret of the
  # same name, which is CAS-only. Tests execute on the runner, so their results
  # are "local results"; only a Read+Write key may store them in the action
  # cache. This job, on main, is therefore what lets a pull request's `test`
  # leg (CAS-only key: it can read those entries, never write them) skip a test
  # whose inputs did not change. The environment admits the `main` branch only,
  # so no pull request run can obtain the key; it holds nothing that publishes
  # (those credentials are in `release`).
  test:
    needs: diff
    if: needs.diff.outputs.has_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      # The same checked download as ci.yaml's legs (#1488): it fails when a
      # list is missing, when the lists are for another commit than this
      # checkout, or when an output of `diff` disagrees with its list.
      - name: Impacted target lists, checked against this checkout
        uses: ./.github/actions/impacted-lists
        with:
          artifact-name: impacted-targets-main
          has-any: ${{ needs.diff.outputs.has_any }}
          has-unit: ${{ needs.diff.outputs.has_unit }}
          has-integration: ${{ needs.diff.outputs.has_integration }}
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=ci --target_pattern_file=${{ runner.temp }}/impacted/impacted_build.txt
      - name: Build impacted targets
        run: |
          bazel build --config=ci \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME=${{ github.ref_name }} \
            --target_pattern_file=${{ runner.temp }}/impacted/impacted_build.txt
      - name: Unit tests
        if: needs.diff.outputs.has_unit == 'true'
        run: |
          bazel test --config=ci \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --target_pattern_file=${{ runner.temp }}/impacted/impacted_unit.txt
      # #673: the aether-proxy readiness probe must stay a stdlib-only binary —
      # its entire value is what it does NOT link (package init() runs before
      # main(), so a heavy import costs every pod every 2s and no argv check can
      # avoid it). //agent/cmd/proxy-ready:deps_test asserts this on the linked
      # ELF; this is the build-graph half, which fails on a forbidden dependency
      # even before the linker drops it as unreachable. Analysis-only and cheap —
      # the query runs against the cache the build step above just warmed.
      - name: Guard proxy-ready linkage
        run: scripts/check-proxy-ready-deps.sh --config=ci
      # #772 phase B2: the aether-proxy pod's PID 1 must stay the carved-out
      # supervisor, not the agent binary it used to be. It is staged onto the pod's
      # volume and re-launched on every hot restart, so every linked package is paid
      # in Go package init() — which runs before main(), so no argv check can avoid
      # it. //agent/cmd/proxy-supervisor:deps_test asserts this on the linked ELF;
      # this is the build-graph half.
      - name: Guard proxy-supervisor linkage
        run: scripts/check-proxy-supervisor-deps.sh --config=ci
      # Proposal 039: the csi.aether.io node plugin runs privileged on every node
      # with Bidirectional mount propagation, and talks only to the kubelet and
      # the kernel — a Kubernetes client, the xDS stack or SPIRE in its link set
      # is attack surface in the most privileged aether process.
      # //agent/cmd/uds-csi:deps_test asserts this on the linked ELF; this is
      # the build-graph half.
      - name: Guard uds-csi linkage
        run: scripts/check-uds-csi-deps.sh --config=ci
      # The two other slim binaries on every node. The CNI plugin is exec'd by the
      # container runtime for every pod ADD/DEL, and mesh-dns was carved out of the
      # agent (#583) so the node's resolver survives agent rolls without the
      # agent's payload. Each :deps_test pins the module set (allow-list + budget)
      # on the linked ELF; these are the build-graph halves.
      - name: Guard cni plugin linkage
        run: scripts/check-cni-deps.sh --config=ci
      - name: Guard mesh-dns linkage
        run: scripts/check-mesh-dns-deps.sh --config=ci

  # What makes the run red when `test` did not do what `diff` decided (#1501).
  #
  # `test` skips on `needs.diff.outputs.has_any == 'true'`. An output that was
  # never set reads as the empty string there and skips it exactly as `false`
  # does: a `diff` that succeeded without writing its outputs left a green run
  # that had tested nothing. scripts/ci-gate.sh reads the whole `needs` context
  # and requires `diff` to have succeeded and written true|false to each has_*
  # output, and `test` to have ended the way has_any says: "nothing impacted"
  # is three times `false`, written by `diff`. The same script, with another
  # table, decides the `ci` and `proxy` checks.
  #
  # No ruleset requires this job (nothing does on a push): when it fails, the
  # run of this commit on `main` is red, and main-watch.yaml files it (#1506).
  #
  # The rules in that script repeat each job's `if:`; //scripts:ci_gate_test
  # compares them with this file, and fails when a job is added here and not
  # to `needs` below and to the script. `refresh-pin-prs` is deliberately not
  # in `needs`: it reads no output of another job, and that test holds it so.
  main:
    if: always()
    needs: [diff, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Every job ended the way its conditions say it must
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh main

  # Keep the open chart-pin PRs (#727) current with `main`.
  #
  # `proxy-release`'s `bump-chart` opens the pin PR and arms auto-merge, but
  # auto-merge does NOT update a stale branch, and the `main` ruleset requires a
  # branch to be up to date before it merges. So the moment any other PR lands
  # first the pin PR goes `BEHIND` and would wait forever. `gh pr update-branch`
  # with the release token merges `main` into it, which re-triggers `ci` + `proxy`
  # (a user token's update is an ordinary `synchronize` event); auto-merge then
  # fires by itself once they report green.
  #
  # Deliberately independent of the `diff`/`test` legs above — no `needs`, and
  # `if: always()`: whether *this* commit's own validation passed says nothing
  # about whether an unrelated pin PR has gone stale, and the pin PR must be
  # refreshed either way.
  #
  # `environment: release` is what scopes `RELEASE_PAT` (an environment secret of
  # `release`, deployment branches = `main` only): GitHub injects it only into
  # jobs that declare the environment and refuses to start such a job from any
  # other ref (#727 addendum). With no token the job exits cleanly and the #703
  # manual flow is untouched — this is never load-bearing for a release.
  refresh-pin-prs:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      # Nothing is built or written in the repo here. `issues: write` is only for
      # the conflict note on the rolling tracking issue: the fine-grained
      # RELEASE_PAT carries Contents + Pull requests and deliberately no Issues
      # permission, so GITHUB_TOKEN — not the PAT — posts that comment.
      contents: read
      issues: write
    env:
      TRACKING_ISSUE_TITLE: proxy releases pending chart pin
    steps:
      - name: Refresh open chart-pin PRs
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The token is never echoed; `add-mask` defensively on top of Actions'
          # own masking of the secret value.
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::notice::no RELEASE_PAT in the release environment — chart-pin PRs are kept current by hand (#703)"
            exit 0
          fi
          echo "::add-mask::$RELEASE_PAT"
          if ! GH_TOKEN="$RELEASE_PAT" gh api user >/dev/null 2>&1; then
            echo "::warning::RELEASE_PAT was rejected by the GitHub API — skipping the chart-pin refresh; rotate it (docs/runbook.md §7)"
            exit 0
          fi

          # Two guards so this can only ever act on PRs the release flow itself
          # produced: the head branch pattern AND the body marker `bump-chart`
          # writes. mergeStateStatus can be UNKNOWN while GitHub is still
          # computing mergeability — that falls through to the no-op arm and the
          # next push to `main` re-evaluates it.
          # shellcheck disable=SC2016  # the backticks are jq string literals
          prs="$(GH_TOKEN="$RELEASE_PAT" gh pr list --state open --limit 100 \
            --json number,headRefName,body,mergeStateStatus \
            --jq '.[] | select(.headRefName | startswith("chore/proxy-image-bump-"))
                      | select(.body | contains("Auto-generated by the `proxy-release` run"))
                      | "\(.number) \(.mergeStateStatus)"')"
          if [ -z "$prs" ]; then
            echo "no open chart-pin PRs"
            exit 0
          fi

          # The rolling audit thread, exact-title matched (the search is fuzzy,
          # the select is not). Never created here — `proxy-release` owns it.
          issue="$(GH_TOKEN="$ISSUE_TOKEN" gh issue list --state open --limit 100 \
            --search "\"${TRACKING_ISSUE_TITLE}\" in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"${TRACKING_ISSUE_TITLE}\")] | .[0].number // empty")"

          echo "## Chart-pin PR refresh" >> "$GITHUB_STEP_SUMMARY"
          while read -r num state; do
            [ -n "$num" ] || continue
            case "$state" in
              BEHIND)
                echo "#${num} is BEHIND main — updating its branch"
                if GH_TOKEN="$RELEASE_PAT" gh pr update-branch "$num"; then
                  echo "- #${num}: \`BEHIND\` -> branch updated (\`ci\` + \`proxy\` re-run; auto-merge fires when green)" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::could not update the branch of #${num}"
                  echo "- #${num}: \`BEHIND\` -> \`gh pr update-branch\` FAILED, update it by hand" >> "$GITHUB_STEP_SUMMARY"
                fi
                ;;
              DIRTY)
                # A real conflict — almost always `charts/aether/Chart.yaml`,
                # whose next patch version another chart change took first. Not
                # something to resolve automatically: leave it and say so once.
                echo "::warning::#${num} conflicts with main and needs a human (likely the Chart.yaml version)"
                echo "- #${num}: \`DIRTY\` (conflict) -> left for a human" >> "$GITHUB_STEP_SUMMARY"
                marker="<!-- pin-conflict:${num} -->"
                if [ -z "$issue" ]; then
                  echo "::warning::no open '${TRACKING_ISSUE_TITLE}' issue to record the conflict on"
                elif GH_TOKEN="$ISSUE_TOKEN" gh issue view "$issue" --json comments \
                  --jq '.comments[].body' | grep -qF "$marker"; then
                  echo "conflict on #${num} already recorded on #${issue}"
                else
                  GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$issue" --body "$(
                    printf '%s\n' \
                      "${marker}" \
                      "" \
                      "Chart-pin PR #${num} **conflicts with \`main\`** and cannot be updated automatically." \
                      "" \
                      "Almost always \`charts/aether/Chart.yaml\`: another chart change took the patch" \
                      "version this pin PR bumped to. Rebase it (re-bump the version), or close it and" \
                      "re-run the \`proxy-release\` workflow for that commit — auto-merge stays armed" \
                      "either way (#727)." \
                      "" \
                      "Seen by ${RUN_URL}."
                  )"
                  echo "recorded the conflict of #${num} on #${issue}"
                fi
                ;;
              *)
                # CLEAN / BLOCKED / UNSTABLE / UNKNOWN: nothing to do. BLOCKED is
                # the normal steady state of an armed pin PR (required checks not
                # all green yet, or a required review outstanding).
                echo "#${num} is ${state} — nothing to do"
                echo "- #${num}: \`${state}\` -> nothing to do" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done <<< "$prs"
