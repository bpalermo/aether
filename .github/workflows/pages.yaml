name: pages

# Publishes aethermesh.dev from //website:site.
#
# The path filter here is safe (unlike in `ci`, where a skipped required check
# would block merges forever): correctness is already gated on the pull request,
# because //website:site_test is an ordinary Bazel test and bazel-diff marks it
# impacted by any website/** or README.md change. This workflow only deploys what
# `ci` already proved builds.
on:
  push:
    branches:
      - main
    # Every repository document the site renders, since the site holds no copy
    # of any of them: a docs or proposal edit *is* a site change. Keep this in
    # step with //:website_docs and website/hooks.py.
    paths:
      - "website/**"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "charts/README.md"
      - "proxy/README.md"
      - ".github/workflows/pages.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

# Never cancel a deploy in flight — a half-applied Pages deployment is worse than
# a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh //website:site
      # Local build on purpose: this is one genrule over a few hundred kilobytes
      # of markdown (~1 min cold), so the BuildBuddy round trip that `ci` and
      # `publish` need would cost more than it saves.
      - name: Build the site
        run: bazel build //website:site
      - name: Unpack the site
        run: |
          mkdir -p _site
          tar -xf bazel-bin/website/site.tar -C _site
          test -f _site/index.html
          test -f _site/architecture/index.html
          test -f _site/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
