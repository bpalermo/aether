name: proxy

# PR validation for the custom Envoy (//proxy, a separate bzlmod module, Bazel 8.7.0).
# Always triggers on every PR (no path filters) so the `proxy` gate check below
# always reports — symmetric with the control-plane `ci` workflow. The `changes`
# job scopes the work: the heavy Envoy compile only runs when proxy/ changes; on
# a control-plane-only PR the matrix skips and the `proxy` gate reports success.
# Both legs offload the compile to BuildBuddy RBE (amd64 = x64 pool, arm64 = arm64
# pool, driven from a native arm64 runner). Does NOT build/push the image — that
# happens on merge (proxy-release.yml).
on:
  pull_request:
    # `upgrade/**`: stacked PRs based on another upgrade branch must still get
    # the `proxy` gate, otherwise the required check never reports on them.
    branches: [main, "upgrade/**"]

permissions:
  contents: read
  pull-requests: read

# No CARGO_BAZEL_REPIN. Under WORKSPACE it was unavoidable — @envoy's
# bazel/dependency_imports_extra.bzl has a top-level
# `load("@envoy_rust_crate_index//:defs.bzl", ...)`, so WORKSPACE evaluation
# fetched the crate_universe repo whatever the extension set was. Under bzlmod
# the `crate` module extension is only evaluated when something in the build
# graph needs a repo from it, and //bazel/build_config compiles in no
# dynamic-modules extension, so nothing does.

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A docs-only edit under proxy/ must not run the Envoy compile either
          # (same reason as proxy-release.yml's paths filter). dorny's default
          # quantifier ORs the patterns, under which a leading '!' would match
          # every path the positive pattern does not and make the filter always
          # true; 'some-with-excludes' is the mode that treats '!' as an
          # exclusion — a file matches when at least one positive pattern
          # matches it and no negated one does.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            proxy:
              - 'proxy/**'
              - '!proxy/**/*.md'
              # The registry setting //proxy loads (@aether_registry).
              - 'bazel/registry/**'
              - '.github/workflows/proxy.yml'

  # Lint and format of the proxy workspace's Starlark and shell (#848). It runs
  # HERE, not only in the `ci` workflow, because `ci`'s `changes` filter
  # excludes `proxy/**/!(*.md)` outright — on a proxy-only PR the whole
  # control-plane workflow skips, so a gate that lived only there would be
  # silent in exactly the case that matters. This workflow is the one that
  # fires on a proxy change. (`ci` runs the same two checks on root changes,
  # where a tool bump or a .shellcheckrc edit can newly flag a proxy file.)
  #
  # Every step runs from the repository ROOT (no `working-directory: proxy`):
  # proxy/ is behind //.bazelignore, so the root's lint aspects cannot see it,
  # and scripts/lint-proxy.sh runs ShellCheck on the files git lists instead;
  # the root formatter (//:format) reaches proxy/ directly, the same
  # `git ls-files` way (see .gitattributes), and its check also runs
  # buildifier's linter (#1245).
  #
  # Cheap by construction — no toolchain, no C++, no Envoy — so it needs no RBE
  # and no BuildBuddy key, and it is a separate job from `test` rather than a
  # step inside it so it reports in seconds instead of waiting on the compile
  # matrix.
  #
  # `//scripts:all` is ShellCheck'd here because lint-proxy.sh lives there and a
  # gate that is itself unlinted is the same bug one level up; //e2e and //bazel
  # are the `ci` workflow's `shell` job, which is where a root-shell PR lands.
  shell:
    needs: changes
    if: needs.changes.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel

      - name: Warm the Bazel repository cache (fetch + analysis, retried)
        run: scripts/ci-bazel-warmup.sh --config=lint --@aspect_rules_lint//lint:fail_on_violation //scripts:all //:format.check @aspect_rules_lint//lint:shellcheck_bin

      # The //proxy workspace loads the one registry setting
      # (bazel/registry/registry.bzl, proposal 040) through its
      # local_path_override of @aether_registry. A proxy-only PR skips the `ci`
      # workflow, so a dropped override or a reintroduced copy must be caught
      # here too.
      - name: The image registry is one setting
        run: scripts/check-registry-config.sh

      # ShellCheck over every proxy shell script, discovered from git — no
      # mirror to keep complete. Exit 2 if it finds nothing to lint.
      - name: Lint the proxy workspace's shell
        run: scripts/lint-proxy.sh

      # The whole-repository format check (seconds), which since proxy/ left
      # rules-lint-ignored includes proxy Starlark (buildifier format AND lint,
      # #1245) and shell (shfmt). Same action as ci.yaml's `format` job; only the
      # two languages proxy/ has are asserted here.
      - name: Check formatting (proxy/ included)
        uses: ./.github/actions/format-check
        with:
          languages: |
            Starlark
            Shell

      # `--config=lint` plus fail_on_violation, NOT `--config=ci` — that pulls
      # in `--config=remote` and would need the BuildBuddy key for a job that
      # has no compile to offload.
      - name: ShellCheck the lint scripts themselves
        run: |
          bazel build \
            --config=lint \
            --@aspect_rules_lint//lint:fail_on_violation \
            //scripts:all

  test:
    needs: changes
    if: needs.changes.outputs.proxy == 'true'
    defaults:
      run:
        working-directory: proxy
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 offloads the heavy compile to BuildBuddy's x64 RBE pool.
          - arch: amd64
            runner: ubuntu-latest
            bazel_config: rbe-buildbuddy-amd64
          # arm64 offloads the heavy compile to BuildBuddy's arm64 RBE pool.
          # The driver MUST be a native arm64 runner: @clang_platform and Envoy's
          # @llvm_toolchain derive their exec constraints from the driver host's
          # arch, so an x64 driver produces an x86_64-exec cross toolchain that
          # cannot satisfy the aarch64 exec platform. Matches proxy-release.yml.
          - arch: arm64
            runner: ubuntu-24.04-arm
            bazel_config: rbe-buildbuddy-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
        with:
          workspace: proxy
          # The repository-cache SAVER (see .github/actions/setup-bazel): this
          # job's warm-up fetches a superset of what every other job restores.
          cache-save: true

      - name: Warm the Bazel repository cache (fetch + analysis of //..., retried)
        run: ../scripts/ci-bazel-warmup.sh --config=ci --config=${{ matrix.bazel_config }} //...

      # aether #651/#653, mirrored from proxy-release.yml's pre-publish gate.
      # //integration:build_id_test (in //... below) asserts the linked binary
      # carries a 20-byte .note.gnu.build-id, but 20 bytes alone does not prove
      # the id is a content hash — a commit stamp is 20 bytes too, which is what
      # #653 was. This asserts the width came from --build-id=sha1: the hermetic
      # toolchain passes --build-id=md5 earlier on the link line and lld honours
      # the LAST one, so ours must be final. Worth running at PR time and not
      # only at release since #697 moved the toolchain from LLVM 18 to LLVM 22
      # and its default --build-id could have changed position. Analysis-only,
      # so it costs no compile and shares the analysis with the test step below.
      - name: Verify --build-id=sha1 is the last on the link line
        run: |
          bazel aquery \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            'mnemonic("CppLink", //:envoy)' | tee /tmp/envoy-link.txt | grep -- '--build-id'
          test "$(grep -o -- '--build-id=[a-z0-9]*' /tmp/envoy-link.txt | tail -1)" = "--build-id=sha1"

      - name: Test (${{ matrix.arch }}, ${{ matrix.bazel_config }})
        # //... runs //:image_test (compiles Envoy + validates the image structure).
        # The branch name is attacker-controlled text: through env, never
        # interpolated into the script (actionlint `expression`).
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          bazel test \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.event.pull_request.head.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME="$BRANCH_NAME" \
            //...

      # Validate the agent's generated Envoy config against the proxy THIS PR
      # builds, not the released one. By default //agent/test/envoy_validate (root
      # workspace, `ci` workflow) runs the binary lifted from the chart-pinned
      # aether-proxy image, so a PR that compiles an extension out or changes a
      # carried patch was checked against the previous release and its NACKs
      # surfaced only after the release. This leg's runner arch == the binary's
      # arch (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm), so the binary
      # runs natively.
      #
      # No second Envoy build: //:envoy was just built by the test step above,
      # so this is a remote-cache hit whose only effect is that
      # --remote_download_toplevel puts the binary on local disk. The proxy
      # server is shut down afterwards to hand its memory to the root one.
      - name: Fetch the built Envoy binary (cache hit of the test step)
        run: |
          flags=(
            --config=ci
            --config=${{ matrix.bazel_config }}
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
          )
          bazel build "${flags[@]}" //:envoy
          out="$(bazel cquery "${flags[@]}" --output=files //:envoy 2>/dev/null)"
          install -m 0755 "$out" "$RUNNER_TEMP/envoy"
          bazel shutdown
          "$RUNNER_TEMP/envoy" --version

      # Root workspace (Bazel 9.2 from the root .bazelversion; Bazelisk picks it
      # up by cwd), hence `working-directory: .`. Entirely LOCAL: no
      # --config=remote — the root's test actions stay local anyway and the
      # BuildBuddy platform there is x86_64-only, which the arm64 leg could not
      # use. The warm-up fetches the root's Go deps with retries; it targets the
      # go_library, not the test, so it does not also fetch the pinned binary
      # the override replaces. The test logs
      # `envoy under validation: <path> (version: ...)` per test.
      - name: Warm the root Bazel repository cache (envoy_validate deps, retried)
        working-directory: .
        run: scripts/ci-bazel-warmup.sh "--repository_cache=$RUNNER_TEMP/root-repo-cache" //agent/test/envoy_validate:envoy_validate

      - name: envoy_validate against the built proxy (${{ matrix.arch }})
        working-directory: .
        timeout-minutes: 30
        run: agent/test/envoy_validate/validate-built-proxy.sh "$RUNNER_TEMP/envoy" "--repository_cache=$RUNNER_TEMP/root-repo-cache"

  # Single required status check — symmetric with the control-plane `ci` gate.
  # Always runs so it reports on every PR (including control-plane-only PRs where
  # the matrix skips).
  #
  # `shell` and `test` skipped has to pass on such a PR, but only because
  # `changes` said so (#1489). An output that was never set reads as the empty
  # string in their `if:` and skips both exactly as `false` does, so
  # scripts/ci-gate.sh reads the whole `needs` context and requires `changes`
  # to have written proxy=true|false and both jobs to have ended the way that
  # value says. A failed or cancelled job fails it, as before.
  #
  # The rules in that script repeat each job's `if:`; //scripts:ci_gate_test
  # compares them with this file, and fails when a job is added here and not
  # to `needs` below and to the script.
  proxy:
    if: always()
    needs: [changes, shell, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job ended the way its conditions say it must
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh proxy
