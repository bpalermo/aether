name: proxy

# PR validation for the custom Envoy (//proxy, a separate bzlmod module, Bazel 8.7.0).
# Always triggers on every PR (no path filters) so the `proxy` gate check below
# always reports — symmetric with the control-plane `ci` workflow. The `changes`
# job scopes the work: the heavy Envoy compile only runs when proxy/ changes; on
# a control-plane-only PR the matrix skips and the `proxy` gate reports success.
# Both legs offload the compile to BuildBuddy RBE (amd64 = x64 pool, arm64 = arm64
# pool, driven from a native arm64 runner). Does NOT build/push the image — that
# happens on merge (proxy-release.yml).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# No CARGO_BAZEL_REPIN. Under WORKSPACE it was unavoidable — @envoy's
# bazel/dependency_imports_extra.bzl has a top-level
# `load("@envoy_rust_crate_index//:defs.bzl", ...)`, so WORKSPACE evaluation
# fetched the crate_universe repo whatever the extension set was. Under bzlmod
# the `crate` module extension is only evaluated when something in the build
# graph needs a repo from it, and //bazel/build_config compiles in no
# dynamic-modules extension, so nothing does.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy:
              - 'proxy/**'
              - '.github/workflows/proxy.yml'

  test:
    needs: changes
    if: needs.changes.outputs.proxy == 'true'
    defaults:
      run:
        working-directory: proxy
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 offloads the heavy compile to BuildBuddy's x64 RBE pool.
          - arch: amd64
            runner: ubuntu-latest
            bazel_config: rbe-buildbuddy-amd64
          # arm64 offloads the heavy compile to BuildBuddy's arm64 RBE pool.
          # The driver MUST be a native arm64 runner: @clang_platform and Envoy's
          # @llvm_toolchain derive their exec constraints from the driver host's
          # arch, so an x64 driver produces an x86_64-exec cross toolchain that
          # cannot satisfy the aarch64 exec platform. Matches proxy-release.yml.
          - arch: arm64
            runner: ubuntu-24.04-arm
            bazel_config: rbe-buildbuddy-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # aether #651/#653, mirrored from proxy-release.yml's pre-publish gate.
      # //integration:build_id_test (in //... below) asserts the linked binary
      # carries a 20-byte .note.gnu.build-id, but 20 bytes alone does not prove
      # the id is a content hash — a commit stamp is 20 bytes too, which is what
      # #653 was. This asserts the width came from --build-id=sha1: the hermetic
      # toolchain passes --build-id=md5 earlier on the link line and lld honours
      # the LAST one, so ours must be final. Worth running at PR time and not
      # only at release since #697 moved the toolchain from LLVM 18 to LLVM 22
      # and its default --build-id could have changed position. Analysis-only,
      # so it costs no compile and shares the analysis with the test step below.
      - name: Verify --build-id=sha1 is the last on the link line
        run: |
          bazel aquery \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            'mnemonic("CppLink", //:envoy)' | tee /tmp/envoy-link.txt | grep -- '--build-id'
          test "$(grep -o -- '--build-id=[a-z0-9]*' /tmp/envoy-link.txt | tail -1)" = "--build-id=sha1"

      - name: Test (${{ matrix.arch }}, ${{ matrix.bazel_config }})
        # //... runs //:image_test (compiles Envoy + validates the image structure).
        run: |
          bazel test \
            --config=ci \
            --config=${{ matrix.bazel_config }} \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            --build_metadata=COMMIT_SHA=${{ github.event.pull_request.head.sha }} \
            --build_metadata=REPO_URL=https://github.com/${{ github.repository }} \
            --build_metadata=BRANCH_NAME=${{ github.head_ref }} \
            //...

  # Single required status check — symmetric with the control-plane `ci` gate.
  # Always runs so it reports on every PR (including control-plane-only PRs where
  # the matrix skips); fails only if a leg that actually ran failed.
  proxy:
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any proxy job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a required proxy job failed or was cancelled"
          exit 1
