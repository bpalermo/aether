# How a job of .github/workflows/ci.yaml gets the impacted target lists of the
# `diff` job (#1459, #1460): download the `impacted-targets` artifact into
# $RUNNER_TEMP/impacted, then refuse to go on unless scripts/ci-impacted-lists.sh
# accepts it. That script fails when a list is missing (a list that is not
# there is not an empty list), when the lists were computed for another commit
# than the one this job checked out, and when a has_* output of `diff` is not
# `true` or `false` or disagrees with its list.
#
# One action so that no job can download the lists and skip the check:
# //scripts:ci_gate_test fails a job of ci.yaml that downloads the artifact
# itself.
#
# Requires the repository to be checked out first, at the commit to build.
name: Impacted target lists (checked)
description: Download the diff job's impacted target lists and check them against this job's checkout and the diff job's outputs.

inputs:
  has-any:
    description: The has_any output of the diff job.
    required: true
  has-unit:
    description: The has_unit output of the diff job.
    required: true
  has-integration:
    description: The has_integration output of the diff job.
    required: true

runs:
  using: composite
  steps:
    - name: Download impacted target lists
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: impacted-targets
        path: ${{ runner.temp }}/impacted

    - name: The lists are complete, for this checkout, and agree with the diff job's outputs
      shell: bash
      env:
        HAS_ANY: ${{ inputs.has-any }}
        HAS_UNIT: ${{ inputs.has-unit }}
        HAS_INTEGRATION: ${{ inputs.has-integration }}
      run: scripts/ci-impacted-lists.sh "$RUNNER_TEMP/impacted"
