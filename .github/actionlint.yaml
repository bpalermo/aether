# actionlint configuration, read by //bazel/actionlint (make actionlint, the
# `actionlint` job in ci.yaml). Prefer fixing a finding, or a targeted
# `# shellcheck disable=SCxxxx # <why>` on the line, to an entry here.
paths:
  .github/workflows/publish-verify.yaml:
    ignore:
      # The rolling issue's printf format holds literal Markdown backticks in
      # single quotes; nothing is meant to expand. The file itself gets a
      # targeted shellcheck directive in its own pull request (release-
      # verification workflow changes are reviewed on their own); drop this
      # entry once that has merged.
      - 'SC2016:info:10:15:'
