schemaVersion: "2.0.0"

# Smoke checks for the custom aether-proxy image (//:image_test).
fileExistenceTests:
  - name: envoy binary
    path: /usr/local/bin/envoy
    shouldExist: true
    permissions: "-rwxr-xr-x"

metadataTest:
  entrypoint: ["/usr/local/bin/envoy"]

# NOTE: no commandTests — the tar driver can't execute binaries (no container
# runtime). The Envoy version is guaranteed by the pin in //MODULE.bazel (the
# `envoy` bazel_dep) rather than probed here; these structure checks confirm the
# binary is baked in and the entrypoint is set.
