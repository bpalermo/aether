apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: endpointpolicies.config.aether.io
  annotations:
    # Keep the CRD (and the CRs it owns) if this chart is uninstalled.
    helm.sh/resource-policy: keep
spec:
  group: config.aether.io
  # Namespaced: an EndpointPolicy attaches to a Service in its own namespace.
  scope: Namespaced
  names:
    kind: EndpointPolicy
    listKind: EndpointPolicyList
    plural: endpointpolicies
    singular: endpointpolicy
    shortNames:
      - epol
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: |
            EndpointPolicy declares how the node proxy delivers inbound traffic to a
            Service's pods (aether.config.v1.EndpointPolicySpec, proposal 034 Phase 1b):
            today, the Unix socket to dial instead of TCP loopback. The equivalent pod
            annotation (endpoint.aether.io/uds-socket) takes precedence. The schema
            below mirrors the proto rules; the AF_UNIX sun_path budget for the socket
            file (54 bytes under the default csi.aether.io root, proposal 039) is
            enforced by the aether-controller webhook.
          properties:
            spec:
              type: object
              required:
                - targetRef
                - udsSocket
              properties:
                targetRef:
                  type: object
                  description: |
                    The Service this policy attaches to (Gateway API policy attachment,
                    GEP-713 direct). Same-namespace by construction.
                  required:
                    - kind
                    - name
                  properties:
                    group:
                      type: string
                      description: API group of the target; only the core group is supported.
                      enum: ["", "core"]
                    kind:
                      type: string
                      enum: ["Service"]
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                udsSocket:
                  type: string
                  description: |
                    "<volume-name>/<socket-file>": the inline `csi: {driver: csi.aether.io}`
                    volume the target's pods declare (proposal 039; an emptyDir is no longer
                    a supported carrier) and the socket file the app creates inside it. The
                    socket file name has a 54-byte budget (the host path
                    /run/aether/uds/<pod-UID>/<file> must fit an AF_UNIX address, 107
                    bytes); the volume name costs nothing.
                  minLength: 3
                  maxLength: 64
                  pattern: '^[^/]+/[^/]+$'
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Socket
          type: string
          jsonPath: .spec.udsSocket
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
