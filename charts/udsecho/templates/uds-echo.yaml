# Annotation delivery path: the socket is declared in the pod template, next to
# the csi.aether.io volume it lives in (the two cannot drift). Requires the aether
# chart's csi.aether.io carrier (udsCsi.enabled, default on since proposal 039
# Phase 2). No Service object is written
# here on purpose: the registrar's mesh-Service generator skips names an
# existing Service owns — a hand-written one would suppress the mesh VIP and
# break mesh-DNS resolution for this name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uds-echo
  namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uds-echo
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.annotationPath.replicas }}
  selector:
    matchLabels: {app: uds-echo}
  template:
    metadata:
      labels:
        app: uds-echo
        aether.io/managed: "true"
      annotations:
        endpoint.aether.io/port: "8080"
        endpoint.aether.io/uds-socket: {{ .Values.socket | quote }}
    spec:
      serviceAccountName: uds-echo
      # Soft hostname spread: the whole UDS fleet landed on one node, feeding
      # the #629 density hot spot. Soft so single-node kind e2e still schedules.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: uds-echo}
      # fsGroup is REQUIRED by csi.aether.io: the per-pod tmpfs is
      # root:<fsGroup> mode 2770, which is how the distroless nonroot user can
      # create the socket in it (the plugin refuses a pod without one).
      securityContext: {fsGroup: 65532}
      containers:
        - name: app
          image: {{ .Values.image.ref }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--socket=/{{ .Values.socket }}"
            - "--text=served-by-uds-echo"
          volumeMounts:
            - name: {{ (split "/" .Values.socket)._0 }}
              mountPath: /{{ (split "/" .Values.socket)._0 }}
      volumes:
        - name: {{ (split "/" .Values.socket)._0 }}
          # The mesh socket carrier (proposal 039): a per-pod tmpfs the node
          # plugin mounts at /run/aether/uds/<pod-uid> after the proxy started,
          # so every request exercises the HostToContainer propagation of the
          # proxy's read-only view of that root.
          csi: {driver: csi.aether.io}
