# Default values for the udsecho validation chart.

# Namespace the workloads deploy into. Must be mesh-managed territory (the CNI
# intercepts the pods; the registrar generates their mesh Services). The
# workload NAMES are deliberately not overridable: the ServiceAccount name IS
# the mesh service identity (<ns>/<serviceAccount>), and the EndpointPolicy
# targetRef names the registrar-generated Service — renaming would silently
# decouple the three.
namespace: aether-test

image:
  # Substituted at package time with the digest-pinned reference produced by
  # //e2e/udsecho:image_push.
  ref: "{@//e2e/udsecho:image_push}"
  pullPolicy: IfNotPresent

# The socket, as <volume>/<file> — the same value the annotation and the
# EndpointPolicy carry. <volume> is the pods' csi.aether.io volume; <file> has a
# 54-byte budget (/run/aether/uds/<pod-uid>/<file> must fit AF_UNIX's 107).
socket: "s/a.sock"

# Annotation delivery path (uds-echo).
annotationPath:
  replicas: 2

# EndpointPolicy delivery path (uds-cr-echo + the policy). Disable to test
# annotation-only.
policyPath:
  enabled: true
  replicas: 2

# Shutdown of both echo Deployments (uds-echo and uds-cr-echo; not the client).
echo:
  # Seconds the kubelet holds SIGTERM back after the pod's deletion is
  # requested: a native `lifecycle.preStop.sleep` (Kubernetes >= 1.30; the
  # image is distroless and has no `sleep` binary for an exec hook). Mesh
  # sources mark the endpoint DRAINING at once and close their pools 1 s before
  # SIGTERM (the mesh reads a sleep hook's length; it cannot read an exec
  # hook's), so the app is never gone while callers still pick it. Without it
  # udsecho exits on SIGTERM right away and a caller's retry can land on a
  # refusing socket. 10 is what docs/workload-requirements.md ("Hitless rolling
  # restarts") asks of every mesh workload and what was measured as zero-loss.
  # 0 renders no hook (the behaviour before chart 2.0.7). Changing it rolls both
  # echo Deployments.
  preStopSleepSeconds: 10
  # The pods' terminationGracePeriodSeconds: the sleep, then udsecho's own
  # graceful shutdown (up to 5 s), must fit inside it, and a value below
  # preStopSleepSeconds + 5 fails the render. 30 is the Kubernetes default,
  # stated so the bound is in the pod spec rather than implied.
  terminationGracePeriodSeconds: 30

# Continuous light load on both services (failures-only logging with an OK
# heartbeat, so `kubectl logs` doubles as the soak error ledger).
client:
  enabled: true
  # Seconds between probe rounds (one request per service per round).
  interval: 1
  # Client image: needs /bin/sh, curl and date. A third-party image, so it is
  # pinned by the digest of its multi-arch index (linux/amd64 and linux/arm64);
  # the tag is kept for the reader and the digest is what the node pulls
  # (#1400; it was the tag alone until chart 2.0.3). The pin is listed in
  # scripts/third-party-images.txt, and `scripts/third-party-images.sh outdated`
  # says when the registry has moved past it (docs/runbook.md, "Refreshing
  # third-party image pins"). A changed value rolls the one-replica uds-client
  # Deployment.
  image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
