# Default values for the aether chart.
#
# Aether is one system: the agent (DaemonSet), the per-node Envoy proxy, the
# in-cluster registrar, and the mesh-config controller deploy together from this
# single chart. System config (OTEL, SPIRE, mesh domain) is set ONCE at the top
# level and referenced by every component — no umbrella/globals indirection. The
# proxy data plane is the only thing whose observability can be retuned at runtime
# (via the MeshConfig CR); everything else is deterministic deploy-time config.
# See docs/proposals/015_mesh-config.md.
#
# Startup taint (cold-start CNI gate, issue #261; lifecycle #569): this chart
# ships the aether.io/agent-not-ready toleration (all aether components — agent +
# proxy DaemonSets, controller/registrar/edge Deployments), the nodes/patch RBAC,
# the agent-side taint removal (it drops the taint once its CNI socket is serving),
# AND the controller-side node-taint guard (it RE-ARMS the taint on a node whose
# agent pod is missing/not-Ready past a ~30s grace, e.g. after a reboot or an agent
# outage). You SHOULD still register nodes WITH the taint so a brand-new node is
# gated before its agent's first reconcile:
#   kubelet:  --register-with-taints=aether.io/agent-not-ready=true:NoSchedule
#   Talos:    machine.kubelet.extraArgs."register-with-taints" (machineconfig)
# The agent removes the taint whenever it is present and CNI is serving (needs the
# chart's nodes/patch RBAC); the guard only ever adds it, never removes it.
# NOTE: the external SPIRE agent DaemonSet must also tolerate this taint — set it in
# your spire helm values (spire-agent.tolerations), NOT here.

# Override the chart name / fully-qualified resource name. Neither changes the
# node proxy's objects: its DaemonSet and ServiceAccount are `aether-proxy` and
# its ConfigMap `aether-proxy-config` whatever the release is called (#1540).
# Install this chart ONCE per cluster: the agent, the proxy, mesh-dns and
# uds-csi own node-level state, and a second release is refused at render time
# where the chart can see the first (docs/configuration.md, "One release per
# cluster").
nameOverride: ""
fullnameOverride: ""

# Namespace all aether resources deploy into. Defaults to the release namespace.
#
# create: false (the default since 2.4.21, #1403): the chart does not render the
# Namespace. Create it with `helm ... --create-namespace` or beforehand, and on a
# cluster that enforces Pod Security admission label it yourself BEFORE the
# install, or the agent, proxy, mesh-dns and uds-csi pods are refused (they need
# hostNetwork, hostPath and NET_ADMIN):
#   kubectl label namespace aether-system \
#     pod-security.kubernetes.io/enforce=privileged \
#     pod-security.kubernetes.io/audit=privileged \
#     pod-security.kubernetes.io/warn=privileged
#
# create: true renders the Namespace with those labels. It works ONLY when the
# release is stored in a different namespace (`helm -n <other> --set
# namespace.name=aether-system`): Helm writes the release record into the release
# namespace before it creates anything the chart renders, so for the release's
# own namespace the render fails with the ways out.
#
# Upgrading a release that was installed while this defaulted to true: nothing
# to do. A Namespace the release already owns is rendered whatever this says, and
# carries helm.sh/resource-policy: keep, so Helm never deletes it (not on an
# upgrade, and not on `helm uninstall`: delete it yourself then).
# Upgrading a release of a chart older than 2.4.21 installed with create: false:
# the first upgrade is refused until the namespace is annotated once
# (`kubectl annotate namespace <ns> helm.sh/resource-policy=keep`); the chart
# cannot see that such a release never rendered its namespace. See
# docs/runbook.md, "Chart 2.4.21".
namespace:
  create: false
  name: ""

# Cluster name passed to the agent and registrar (`--cluster-name`).
clusterName: talos-main

# Cross-cluster config authority (proposal 026 EM3, Option E). When set to a cluster
# name, ONLY that cluster's registrar exports GAMMA config and every cluster imports
# config ONLY from that origin (single source of truth, no drift). Empty = federated
# (every cluster may export; consumers trust any peer origin, highest-version wins).
# Passed to both the agent and registrar (`--control-cluster`).
controlCluster: ""

# Enable verbose logging on all components (`--debug`).
#
# EXCEPT the mesh-dns daemon since #684: it has its own opt-in
# `agent.meshDnsDaemon.debug` (default false) and this global toggle does not
# reach it. It is the one component on every managed pod's :53 path, and
# defaulting it to TRACE was not a decision anyone made — it inherited it.
debug: true

# DNS-style domain mesh authorities live under (<service>.<meshDomain>): clients
# address services as <service>.<meshDomain>; also the ODCDS catch-all suffix.
meshDomain: aether.internal

# System-wide OTEL config — enable once, every component inherits it. The proxy
# data plane may OVERRIDE its own access-log / tracing / metrics policy via the
# MeshConfig CR (see meshConfig below), defaulting to this.
otel:
  # Enable the OTel MeterProvider + push telemetry to the collector everywhere.
  enabled: false
  # OTLP gRPC collector endpoint (host:port, insecure), e.g.
  # "otel-collector.observability.svc:4317". Empty disables OTLP export and the
  # Envoy stats sink of the node proxy and the edge proxy. NOTE: this is a
  # deploy-time value: the chart passes it as --otlp-endpoint to the agent,
  # the proxy supervisor, mesh-dns, the registrar, the controller and the edge
  # control plane, and renders it into the two Envoy bootstraps; it is never
  # read from a runtime ConfigMap. uds-csi and cni-install are not passed it,
  # and the CNI plugin takes no endpoint: it exports
  # no telemetry of its own (#1166, #1185) and forwards its timings to the
  # agent, which exports them.
  endpoint: ""
  # Export component application logs over OTLP (tee'd into stderr).
  logs: false
  # Head-sampling ratio for traces (0.0-1.0); bounds exported spans only.
  traceSampleRate: 0.1
  # Export spans over OTLP (needs a collector traces pipeline).
  traceExport: false

# System-wide SPIRE config. `enabled` is the mesh-wide mTLS switch (agent,
# registrar, edge and the controller's identity gate); the webhook serving cert
# is controller.webhook.spire. The Workload API and broker socket paths are
# per-component plumbing.
spire:
  # false means "mesh mTLS is off" (cleartext between proxies; the agent, the
  # proxy, the registrar and the edge get no SPIRE wiring, and the identity
  # gate is off). It does NOT mean "SPIRE is not installed": with
  # controller.webhook.spire=true the controller still serves its admission
  # webhooks with a SPIRE SVID, as the only SPIRE client of the release. That
  # pair is supported (#1412).
  enabled: true
  # Workload API socket path, shared by agent, registrar, controller and edge.
  # Every template mounts the csi.spiffe.io volume at the FIXED directory
  # /run/secrets/workload-spiffe-uds, so only the socket FILE name within it is
  # configurable here: a path outside that directory is passed to the binaries
  # but names nothing they can reach. Every component resolves its trust
  # domain (mTLS peer authorization) from its own SVID over this socket — there
  # is no trustDomain value to configure (retired: it could silently disagree
  # with what SPIRE actually issues).
  workloadSocketPath: /run/secrets/workload-spiffe-uds/socket
  # SPIRE agent SPIFFE Broker Endpoint socket, over which the node agent brokers
  # an X.509-SVID for every pod on its node (proposal 036). hostPath is
  # bind-mounted at mountPath; the socket is socketName.
  #
  # REQUIRED: SPIRE >= 1.15.2 with its experimental broker enabled, and the
  # agent's SPIFFE ID registered as a broker. With the spiffe/spire chart
  # (>= 0.30) that is spire-agent.sockets.broker.{enabled,mountOnHost}=true plus
  # a brokerAPI.brokers.<key> entry and a matching
  # workloadAttestors.k8s.brokerAPI.brokers.<key> entry — see
  # docs/getting-started.md. hostPath below is where that chart puts the socket
  # directory on the node.
  brokerSocket:
    hostPath: /run/spire/agent/sockets/csi.spiffe.io/broker
    mountPath: /run/spire/broker-sockets
    socketName: broker.sock
  # How long a component may wait for SPIRE to issue its first SVID before the
  # waiting log line escalates from INFO to WARN. Startup no longer dies when the
  # Workload API is not serving yet (issue #740): it waits and keeps /healthz and
  # /readyz answering.
  #
  # It is ALSO the dwell before the spire-svid readiness check reports NotReady —
  # but ON THE AGENT ONLY (#740 PR 4). The controller, registrar and edge take NO
  # dwell: they are Deployments behind Services, so NotReady removes one replica
  # from one endpoint set, which is exactly the right handling of a pod that
  # cannot complete an mTLS handshake, and they go NotReady the instant they are
  # known to lack an identity. (Before PR 4 a registrar Pod could be Ready — and
  # therefore dialled — with no SVID; see the rev210 roll, 2026-09-07.) The agent
  # keeps a dwell because NotReady on the DaemonSet is what arms the node taint,
  # a fleet-level action a brief SPIRE hiccup must not trigger.
  #
  # REQUIRED: spire-server, spire-agent AND the SPIFFE CSI driver MUST tolerate
  # aether.io/agent-not-ready (:NoSchedule). Past this dwell an identity-less node
  # reports NotReady, the controller's node-taint guard re-arms that taint 30s
  # later, and — since #740 — the agent's own taint remover HOLDS it until every
  # readiness gate passes, which for an identity-less node means until SPIRE
  # recovers. That is the point (nothing new should be scheduled onto a node that
  # cannot give it an identity), but it also means a SPIRE that does not tolerate
  # the taint cannot be rescheduled onto the very nodes it has to attest: the
  # outage would fence out its own cure. On the reference cluster these tolerations were
  # applied in the platform's GitOps repository (2026-09-07).
  waitWarnAfter: 2m

# Proxy MeshConfig — the controller seeds and projects the singleton MeshConfig CR
# into a ConfigMap the agent mounts. The CR ONLY overrides the proxy data plane's
# observability; everything else is inherited from the system config above.
meshConfig:
  # Seed the singleton MeshConfig CR (name "default") when none is live (the
  # first install; an upgrade that finds it absent) — it is created once and
  # NEVER overwritten on upgrade or rollback (lookup-skip), so operators own it
  # via kubectl thereafter. The seed is a Helm hook (pre-install,pre-upgrade),
  # not an object of the release (#1471): it is in no revision's manifest, so
  # `helm rollback` to the revision that seeded it (normally the first) works,
  # and `--no-hooks` seeds nothing. The hook deletes nothing either: it names
  # a hook-delete-policy Helm does not act on (`never`), because Helm's
  # default deletes the live object of that name before creating the hook's.
  # A MeshConfig created while an upgrade is running is therefore never
  # deleted; that upgrade can fail on "already exists", and succeeds when run
  # again. With Helm 4's server-side apply the seed is applied to that object
  # instead (labels, annotations, and any `proxy` field below that it does
  # not set). docs/runbook.md, "Chart 2.4.24".
  # The edge's own MeshConfig (edge.enabled) hangs off this switch too. In an
  # edge namespace the chart creates (edge.namespaceCreate, since 2.4.25) it is
  # not a hook but an object of the release, rendered on every revision with
  # an empty spec, which leaves your edits alone (#1514; runbook, "Chart
  # 2.4.25").
  # Set false to manage the CR entirely yourself (do that with a tool that
  # renders with `helm template`: it would render the seed on every sync).
  createDefault: true
  # The MeshConfig spec.proxy seeded into the default CR (protojson field names of
  # aether.config.v1.MeshConfig.proxy). An empty block means the proxy inherits
  # everything from the system config. Used only at first-install seeding.
  proxy: {}
    # accessLogsEnabled: false
    # accessLogSuccessSampleRate: 100
    # tracingEnabled: false
    # traceSampleRate: 0.01
    # emitStatsPod: false

# --------------------------------------------------------------------- agent
agent:
  # GAMMA east-west L7 routing (proposal 018): the node agent watches HTTPRoutes
  # and GRPCRoutes parented to a Service and applies them on the outbound +
  # capture paths. Default ON since proposal 031: the reconciler CRD-detects the
  # Gateway API types and degrades with a warning when they are absent, so this
  # is safe without the CRDs installed. Kill switch — set false to disable the
  # watches (and drop the cluster-wide route RBAC).
  gamma: true
  # CNI conflist re-assert (#645): the agent watches the node's CNI config dir and
  # re-appends aether's chained aether-cni entry whenever a competing writer strips
  # it. kube-flannel's init container `cp -f`s its ConfigMap template over
  # 10-flannel.conflist on EVERY flannel pod recreation — which a Talos
  # bootstrap-manifest re-sync (boot, apply-config, k8s upgrade) triggers — silently
  # unmeshing every pod started afterwards, fleet-wide (incident 2026-08-29).
  # cni-install appends once per agent pod start; this keeps it appended. Default ON
  # (safety net); it never creates a conflist of its own. Needs the read-write
  # /etc/cni/net.d mount on the agent container.
  cniConflistReassert: true
  # How the agent DaemonSet rolls (proposal 041, #1123).
  updateStrategy:
    # false (default): delete-then-create (maxSurge 0, maxUnavailable 1). The
    # node's proxy has no ADS stream from the old agent's exit until the new
    # one serves: the whole pod replacement plus startup (7.6-15.8 s on the reference cluster
    # before #1123's first half, ~4-9 s after it).
    #
    # true: surge (maxSurge 1, maxUnavailable 0). The new agent starts beside
    # the old one as a STANDBY: it finds the node lock (/run/aether/agent.lock)
    # held, builds its whole first snapshot (identity, registry, capture
    # projection, client certificates) but binds no node socket and writes no
    # node file, and reports Ready once that snapshot is complete with its
    # registry and capture gates passed (a timeout does not count). The
    # DaemonSet controller then deletes the old pod; the kernel releases the
    # lock the instant it exits; the standby applies the CNI ADD/DEL the old
    # agent served meanwhile and binds. The gap is the proxy's reconnect
    # backoff plus that diff, ~0.1-0.4 s.
    #
    # Costs and caveats (docs/runbook.md, "Agent surge roll"):
    #   - each node briefly runs two agents, so it needs room for a second
    #     agent.resources request (system-node-critical preempts if it must);
    #     a node without it stalls the roll there, visibly (Pending surge pod);
    #   - an old agent stuck terminating keeps its standby a standby until its
    #     terminationGracePeriodSeconds (30 s) expires.
    #   - a registrar that cannot be reached keeps the standby NotReady, so the
    #     roll stalls rather than replacing a working agent.
    # Roll it out in TWO steps: first upgrade to this chart with surge: false
    # (every agent, registrar and lock-holder on the new version), then set
    # surge: true. Never both in one upgrade. See docs/runbook.md for why.
    surge: false
  # Cross-cluster config import (proposal 026): poll the registrar for GAMMA config
  # projections peer clusters exported and materialize them into the node proxy's
  # routes (merged with local; local wins). Default off; no-op unless the registry
  # backend has a cross-cluster config plane (etcd). Pairs with registrar.registryBackend=etcd.
  importConfig: false
  # East/west waypoint (proposal 019): when true, cross-cluster endpoints (a
  # different cluster_name than this one) are dialed at their node's routable IP +
  # the fixed tunnel port 18009 instead of their pod IP, and this node's
  # host-network proxy SNI-forwards inbound tunnel traffic to local pods.
  # Intra-cluster stays direct pod-to-pod. Needs cross-cluster endpoint
  # visibility (shared etcd) and a shared SPIRE trust domain across clusters.
  # Default off.
  eastWestWaypoint: false
  # East-west QUIC (proposal 038 Phase 4b) has NO on/off value: it is
  # unconditional (#979). Every service in a node's dependency set is dialled
  # over HTTP/3 (mTLS over QUIC, UDP 18008) instead of HTTP/2 by each local
  # ServiceAccount that has dialled it, through one per-source `quic:` cluster
  # per (ServiceAccount, destination) pair -- built on the pair's first request
  # (on-demand CDS, #1020), so the cost is the pairs actually used, bounded by
  # local ServiceAccounts x dependency-set services per node; the agent logs it
  # as "east-west QUIC fan-out". Services with endpoints behind the east/west
  # waypoint stay h2. MESH-WIDE PREREQUISITE (until envoyproxy/envoy#47740 is in
  # a plain proxy pin): every workload SVID must carry the DNS SANs
  # "<sa>.<ns>.<meshDomain>" and "*.<sa>.<ns>.<meshDomain>" (dnsNameTemplates on
  # the workloads' ClusterSPIFFEID) -- see docs/configuration.md, "SPIRE", and
  # docs/runbook.md, "East-west QUIC".
  # Idle timeout of every east-west QUIC twin's upstream connection pool
  # (#1054); h1/h2 pools keep 30s. An idle source h3 connection receives no
  # GOAWAY when the destination proxy hot-restarts, so it must close on its
  # own before the destination's parent exits: once the parent is gone, the
  # connection's next packet reaches the child and draws a stateless reset
  # (the source's request fails `503 UC ... Received_stateless_reset`). The
  # chart REFUSES to render unless this + 5s < proxy.hotRestart.parentShutdownTime
  # (the agent cannot check it: it never sees the proxy DaemonSet's value).
  # Cost: a (source, destination) pair idle between this and 30s pays a fresh
  # QUIC handshake on its next request.
  eastWestQuicIdleTimeout: 8s
  # M2-default flip (proposal 022, Step 4): make redirect-all the DEFAULT for
  # managed pods (Istio-style "capture what the app sends", zero per-pod config).
  # Every non-system pod on the node is redirect-all'd UNLESS it carries the
  # capture.aether.io/redirect-all="false" opt-out annotation (use it for infra /
  # hostNetwork / prober pods). false = per-pod OPT-IN via the same annotation
  # set to "true" (the passthrough chain itself is always present, proposal
  # 031). Carve out destinations
  # with capture.aether.io/exclude-outbound-ports / -ip-ranges (link-local +
  # multicast are always excluded). Default ON — validated HITLESS on the reference cluster
  # (2026-06-29 churn soak: external prober 100%, k6 0.012%, egress intact, stable
  # RSS through 6 proxy + 14 service rolls). This is the riskiest blast radius
  # (every meshed pod's egress); set false to revert to per-pod opt-in.
  captureRedirectAllDefault: true
  # Mesh DNS (proposal 018, mesh-global FQDN): a resolver answers <svc>.<ns>.<meshDomain>
  # from the generated mesh Services' ClusterIPs and forwards the rest to meshDnsUpstream;
  # the CNI DNATs each pod's :53 straight to HOST_IP:18054. Default ON. meshDnsUpstream
  # defaults to the resolver's own resolv.conf (kube-dns via ClusterFirstWithHostNet)
  # when empty, so no per-cluster config is needed; set it only to override.
  #
  # Issue #578: the resolver is DECOUPLED from the agent into the standalone
  # aether-mesh-dns DaemonSet (see meshDnsDaemon below) so agent rolls no longer gap
  # mesh DNS. The agent now only PERSISTS the record snapshot; the daemon serves
  # :18054, watches the snapshot, and — being surge-capable with SO_REUSEPORT — hands
  # off hitlessly across its own rolls. This `meshDns` toggle gates BOTH the agent's
  # persist path and the daemon deployment.
  meshDns: true
  meshDnsUpstream: []
  # The standalone mesh-DNS resolver DaemonSet (issue #578). Deployed exactly when
  # agent.meshDns is true. It mounts the agent's registry hostPath read-only and
  # serves HOST_IP:18054 from the snapshot the agent writes.
  meshDnsDaemon:
    # Its OWN image (#583 option B), carrying ONLY the slim /mesh-dns binary — no
    # controller-runtime, no xDS/go-control-plane, no CNI server, no SPIRE. The daemon
    # briefly shipped as an extra layer inside agent.image (the interim #583 measure),
    # which made every node pull the whole agent for a process that executes none of
    # it. Same repository+digest convention as agent.image: mirror to a private
    # registry by overriding `repository` alone; the digest is preserved.
    image:
      repository: "{@//agent/cmd/mesh-dns:image_push.repository}"
      digest: "{@//agent/cmd/mesh-dns:image_push.digest}"
      tag: ""
      pullPolicy: Always
    # Issue #674: the forward path keeps a small pool of already-connected UDP sockets
    # per upstream instead of dialling one per forwarded query (profiling put the dial
    # at 20.97% of this daemon's CPU, MORE than the exchange it served). Unset emits no
    # flag and uses the built-in default of 8; 0 DISABLES pooling and restores the
    # pre-#674 dial-per-query behaviour.
    #
    # This is an ESCAPE HATCH, not a tuning knob. Reuse trades away per-query source-port
    # randomisation for the socket's lifetime (a jittered 30s / 1000 queries, whichever
    # comes first); that is safe here because the socket is CONNECTED, so the kernel drops
    # any datagram not from the upstream's exact address and an off-path attacker cannot
    # land a spoofed answer at all.
    forwardPoolSize: null
    # Issue #729: how long the resolver keeps SERVING after SIGTERM before it closes
    # its SO_REUSEPORT listeners.
    #
    # The problem it fixes (#726 Phase 1): on a roll (maxSurge:1/maxUnavailable:0) the
    # DaemonSet controller deletes the predecessor the instant the successor passes its
    # first readiness probe, and the predecessor used to close its socket immediately.
    # Every datagram the kernel had already steered into that socket's queue was
    # discarded — one lost DNS query per roll, and because Go's resolver singleflights
    # by name, one lost query stalls every concurrent lookup of that name for a full
    # retransmit timeout (5s before #728, ~1s after).
    #
    # With a window, the predecessor instead: stops reporting ready, keeps answering,
    # and closes as soon as it observes a DIFFERENT instance answering on the same
    # address (it asks the reuseport group for a TXT identity stamp — a reply carrying
    # someone else's stamp proves the successor is both in the group and serving).
    # This ceiling therefore only bites when NO successor appears: a scale-down, a node
    # drain, or a surge that failed. Watch aether_mesh_dns_lame_duck_exits_total{reason}
    # — a healthy roll is `successor` on every node.
    #
    # terminationGracePeriodSeconds on the DaemonSet is DERIVED from this value (+5s),
    # so raising it cannot silently leave the kubelet SIGKILLing mid-window. Set "0s"
    # to disable the window entirely and restore the pre-#729 close-on-SIGTERM
    # behaviour. Not a tuning knob: the window ends on evidence, not on the clock.
    lameDuckMax: "10s"
    # Verbose (TRACE) logging for THIS daemon only. Issue #684: the top-level
    # `debug` is true by default and used to reach mesh-dns, so every node ran the
    # resolver at TRACE — on the one component that sits on every managed pod's
    # :53 path. The global toggle deliberately no longer reaches this daemon;
    # set this key to turn it on for a diagnosis:
    #
    #   helm upgrade ... --set agent.meshDnsDaemon.debug=true
    #
    # What it costs, measured rather than assumed: --debug only raises the slog
    # threshold (Info -> Trace). The mesh-DNS forward path logs NOTHING per query
    # at any level — the only Debug-level call site in the resolver is the
    # snapshot reload — so this is not a per-query cost and turning it off is not
    # the fix for the OTel log-queue CPU in #684 (that is a fixed 1 Hz poll in the
    # SDK's batch processor, independent of log volume). It is still off by
    # default: every record that IS emitted is fanned out to the OTLP log exporter
    # as well as stderr, at Trace that includes each snapshot reload during
    # rollout churn, and a per-node daemon should not ship debug logging to a
    # shared collector unless someone asked for it.
    debug: false
    # Issue #583 slimmed the readiness re-exec (the resolver alone, not the full
    # /agent); issue #683 removed it entirely — the probe execs the stdlib-only
    # /mesh-dns-ready binary (~1.7Mi, bundled in this same image) rather than
    # relaunching the 16.9Mi daemon every 15s, which was ~3-4% of this container's
    # CPU in runc/libcontainer exec and Go package init. The resident resolver is
    # ~12-15Mi RSS and a stdlib stat is a rounding error. These are conservative for
    # that footprint; revisit against live usage if needed. The probe process runs
    # inside THIS container's cgroup and counts against limits.memory: ~2.4Mi max
    # RSS per run (the same stat-a-marker binary as /proxy-ready, measured at 500
    # runs). This daemon sets no GOMEMLIMIT.
    #
    # CPU: a 50m REQUEST and deliberately NO CPU LIMIT (#1253), the same call as
    # the agent (#1116) and the authz sidecar. This daemon is every managed pod's
    # resolver, so its tail latency is every pod's lookup latency. At the old
    # 25m request / 100m limit it averaged ~24.5m and was STILL CFS-throttled in
    # 8.7 % of 100 ms periods (live cgroup on node E of the reference cluster: nr_throttled 16851 of
    # nr_periods 193397, ~1,632 s throttled over ~4.5 h): its CPU arrives in
    # bursts (a reload, a query storm at a rollout, a GC cycle), and a burst
    # past 10 ms in a period parks every query in flight until the next period.
    # The request still reserves CPU for scheduling and is the CFS weight under
    # contention (25m against the reference cluster's 800m proxy request was a ~1:32 weight on a
    # saturated node). A surge roll (maxSurge 1) needs a second 50m per node.
    # The pod was already QoS Burstable (requests != limits), so no QoS class
    # changes. To restore a cap, set limits.cpu (and see goMaxProcs below);
    # an empty limits.cpu renders no CPU limit.
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 64Mi
    # GOMAXPROCS for the mesh-dns container, set as an explicit env var (#1253).
    # Since Go 1.25 the runtime derives GOMAXPROCS from the cgroup CPU limit with
    # a floor of 2, so under the old 100m limit this daemon already ran with 2;
    # with the limit gone it would scale to the node's core count, and with it
    # the GC's background workers (25 % of Ps), which burst across the node for
    # a process whose work is a map lookup or a UDP round trip. 2 keeps today's
    # runtime behaviour exactly. 0 (or empty) omits the env var and hands
    # GOMAXPROCS back to the Go runtime.
    goMaxProcs: 2
  # Image as repository + digest (digest-pinned for immutability). Mirror to a
  # private registry by overriding `repository` alone; the digest is preserved.
  image:
    repository: "{@//agent/cmd/agent:image_push.repository}"
    digest: "{@//agent/cmd/agent:image_push.digest}"
    tag: ""
    # IfNotPresent, not Always (#1123): the reference is a digest, so the node
    # either holds exactly this image or pulls it; Always only adds a registry
    # round trip (token + manifest HEAD) to every agent pod start. That start
    # is spent with the node's proxy on no ADS stream: the kubelet measured
    # 1.44 s of image "pulling" (agent + cni-install, both already present) on
    # one 2026-10-02 reference-cluster agent restart. Set Always only for a mutable tag.
    pullPolicy: IfNotPresent
  # CPU: a 200m REQUEST and deliberately NO CPU LIMIT (#1116). The agent's xDS
  # snapshot builds are 5-25 ms CPU bursts on latency-critical paths (ODCDS
  # first-use answers, EDS / drain-mark propagation). Under a 200m CFS quota
  # (20 ms of CPU per 100 ms period) any build over ~20 ms spans at least two
  # periods, i.e. it turns into 100 ms steps -- and the kernel can throttle the
  # goroutine while it holds the snapshot-cache mutex, stalling every ADS stream
  # behind it (the residual ~80 ms p99 ADS wait measured after #1105/#1114). The
  # request still reserves 200m for scheduling and sets the CFS weight under
  # contention; the agent is idle between bursts.
  #
  # Trade-off, stated plainly: with no CPU limit (limits != requests) the agent
  # pod is QoS class Burstable, not Guaranteed. That moves it up the kubelet's
  # node-pressure eviction order (while its usage stays under requests.memory it
  # is only evicted after BestEffort pods and Burstable pods exceeding their
  # requests) and makes it ineligible for exclusive cores under the CPU manager's
  # static policy. An operator who needs Guaranteed sets limits.cpu equal to
  # requests.cpu AND requests.memory equal to limits.memory, and should raise the
  # CPU to at least 1000m so the quota is not the bottleneck again.
  #
  # Memory: 96Mi request / 128Mi limit (was 64Mi / 64Mi until chart 2.4.2). The
  # 2026-10-04 soak OOMKilled agents (exit 137, 3 kills on 2 of 5 nodes within
  # ~1 h of churn) at 64Mi: Go runtime memory (go_memory_used_bytes) is 44-61Mi
  # under soak load -- no leak, the same as the passing 10-03 soak -- and the
  # cgroup has to hold more than the Go runtime:
  #   - the EXEC probes (proposal 041, chart 2.3.0): every /agent-ready run is a
  #     process inside THIS container's cgroup, readiness every 2s and liveness
  #     every 10s, so two can overlap. Measured: 3.0Mi max RSS per run (2.8Mi
  #     p50; 500 runs of the static linux_amd64 image binary against a dummy
  #     socket under /usr/bin/time), plus runc's short-lived exec helper;
  #   - kernel socket buffers and the page cache of the files the agent writes.
  # GOMEMLIMIT is rendered at 90% of limits.memory (115.2Mi of 128Mi, the
  # aether.goMemLimit helper), never 100%: a Go limit equal to the cgroup limit
  # let the heap fill the whole cgroup before the GC tightened, which is what the
  # probe processes tipped over. Remove limits.memory and GOMEMLIMIT is omitted.
  # Surge rolls (updateStrategy.surge) run two agents per node for the overlap:
  # budget 2 x 200m / 96Mi of node requests.
  resources:
    requests:
      cpu: 200m
      memory: 96Mi
    limits:
      memory: 128Mi
  # GOMAXPROCS for the agent container, set as an explicit env var (#1116).
  # Since Go 1.25 the runtime derives GOMAXPROCS from the cgroup CPU limit; with
  # the limit removed above it would scale to the node's core count, and the
  # chart's old `resourceFieldRef: limits.cpu` falls back to node allocatable
  # just the same. Two Ps let a snapshot build run alongside the gRPC/watch
  # goroutines without the agent spreading across the whole node. Set to 0 (or
  # empty) to omit the env var and hand GOMAXPROCS back to the Go runtime (e.g.
  # alongside an explicit CPU limit, which the runtime then honours).
  goMaxProcs: 2
  # The agent reaches the registry only through the registrar (gRPC); it never
  # talks to an external registry backend and carries no backend credentials.

# CNI installer (init container). Its config is deterministic deploy-time data.
# The node's CNI directories, as the container runtime / kubelet see them on the
# HOST. cni-install copies the plugin binary into binDir and chains aether into
# the active conflist in confDir; the agent's conflist re-assert loop watches
# confDir. Both are hostPath-mounted at /host<dir> and the containers are told
# that path. Change them only for a runtime configured with non-standard
# directories (e.g. k3s's /var/lib/rancher/k3s/agent/etc/cni/net.d).
cni:
  binDir: /opt/cni/bin
  confDir: /etc/cni/net.d

cniInstall:
  image:
    repository: "{@//cni/cmd/cni-install:image_push.repository}"
    digest: "{@//cni/cmd/cni-install:image_push.digest}"
    tag: ""
    # IfNotPresent for the same reason as agent.image (#1123): digest-pinned,
    # and this init container sits on every agent pod start.
    pullPolicy: IfNotPresent
  # No CPU limit (#1335; was request = limit = 100m until chart 2.4.12). This
  # init container runs on EVERY agent pod start, ahead of the agent, and its
  # work is one short CPU burst: Go start-up, then a byte-for-byte compare of
  # the plugin already on the host against the one in the image (#1123's
  # "unchanged; not rewriting it" path), then a few small conflist reads. A
  # 100m quota is 10 ms of CPU per 100 ms CFS period, so the burst was parked
  # once per period: on the reference cluster all 40 agent starts of 2026-10-05..07 (8
  # rolls x 5 nodes, every one on the unchanged path) took 496-802 ms from the
  # installer's first log line to its last (median 598 ms), always a multiple
  # of ~100 ms, for at most 50-80 ms of CPU -- about half a second of pure
  # delay per agent start, on the path #1123 shortened. (Inferred from log
  # timestamps, not read from cAdvisor: a sub-second init container never
  # meets a 60 s scrape, so it has no container_cpu_cfs_* series at all.
  # docs/runbook.md, "cni-install CPU limit".)
  #
  # The 100m request stays: an init container's request only counts toward the
  # pod's effective request where it exceeds the sum of the app containers'
  # (the agent's 200m), so it costs the node nothing, and it is the container's
  # CFS weight while it runs. The pod was already QoS Burstable. No GOMAXPROCS
  # pin: the work is single-threaded and the process exits within the second.
  # To put a cap back, set limits.cpu; an empty value means "no limit".
  resources:
    requests:
      cpu: 100m
      memory: 32Mi
    limits:
      memory: 32Mi

# The csi.aether.io CSI node plugin (proposal 039): the mesh-owned carrier for a
# UDS-served workload's socket directory, and since 039 Phase 2 the ONLY one —
# UDS delivery (proposal 034) requires it. A pod that declares
#
#   securityContext: {fsGroup: <gid>}
#   volumes: [{name: s, csi: {driver: csi.aether.io}}]
#
# gets, at the volume's mountPath, a per-pod tmpfs the plugin mounts at
# <root>/<pod-uid> on the host: nosuid,nodev,noexec,nosymfollow, capped at
# `size`, mode 2770 owned by root:<fsGroup>. A pod WITHOUT an fsGroup is refused
# with a FailedMount event naming the fix.
#
# Renders the `aether-uds-csi` DaemonSet (privileged: it mounts in the host mount
# namespace, with Bidirectional propagation so its mounts reach the kubelet and
# the host) and the cluster-scoped CSIDriver object. The plugin registers itself
# with the kubelet (no node-driver-registrar sidecar) and makes no API calls.
#
# and annotates endpoint.aether.io/uds-socket: s/<file> (or is targeted by an
# EndpointPolicy naming s/<file>) is delivered over <root>/<pod-uid>/<file>. An
# emptyDir socket volume is NOT a carrier any more: the controller webhook denies
# such a pod, and a running one falls back to TCP (unpromoted), counted as
# aether.agent.uds.resolve_failures{reason="not_csi"}.
#
# Default ON. This one switch gates all of UDS delivery: the plugin DaemonSet +
# CSIDriver, the agent's --uds-csi-root (= root below), the proxy's read-only
# mount of root, and the agent's EndpointPolicy watch. On a node with no UDS
# workload the plugin is a small idle DaemonSet (5m CPU / 16Mi requested) that
# serves nothing. Set false only if no workload uses UDS delivery and you want
# one fewer privileged node component; pods asking for a socket then fall back
# to TCP (reason="disabled"). See docs/proposals/039_uds-csi-driver.md.
udsCsi:
  enabled: true
  # Its own slim image: the CSI + registration gRPC services and x/sys/unix, no
  # Kubernetes client (//agent/cmd/uds-csi:deps_test). Same repository+digest
  # convention as the other images.
  image:
    repository: "{@//agent/cmd/uds-csi:image_push.repository}"
    digest: "{@//agent/cmd/uds-csi:image_push.digest}"
    tag: ""
    pullPolicy: Always
  # The kubelet's --root-dir, and the ONLY place it appears on the CSI path: the
  # plugin's CSI socket (<kubeletRoot>/plugins/csi.aether.io/csi.sock), its
  # registration socket (<kubeletRoot>/plugins_registry/), and the pods dir the
  # kubelet's target paths live under all derive from it. The default is right
  # for kubeadm, kind and Talos; k0s is /var/lib/k0s/kubelet, microk8s
  # /var/snap/microk8s/common/var/lib/kubelet.
  kubeletRoot: /var/lib/kubelet
  # Host directory holding the per-pod tmpfs mounts (<root>/<pod-uid>). Under
  # /run so a reboot starts it empty (the kubelet republishes). The ONE source
  # of truth for the carrier path: the plugin's --root, the agent's
  # --uds-csi-root and the proxy's read-only mount all render from it. Keep it
  # short: the socket file budget is 107 - len("<root>/") - 36 (pod UID) - 1,
  # i.e. 54 bytes at the default, which is what admission checks.
  root: /run/aether/uds
  # Size cap of each per-pod tmpfs (bytes, or Ki/Mi/Gi). It holds a socket inode
  # and whatever else the app writes there; pages are charged to the app's
  # memory cgroup.
  size: 1Mi
  # Inode cap (nr_inodes) of each per-pod tmpfs: how many files, sockets and
  # directories it can hold, its own root directory included (#1107). Without it
  # the kernel default is half the node's RAM pages' worth, so a workload could
  # create files in its socket directory far past anything `size` bounds. At
  # least 8 (the chart refuses less).
  inodes: 64
  # Verbose logging for THIS daemon only (the global `debug` does not reach it).
  debug: false
  # Extra scheduling constraints. The aether.io/agent-not-ready toleration is
  # always rendered (like every aether DaemonSet): a UDS pod's volume must be
  # publishable as soon as the node admits it.
  nodeSelector: {}
  tolerations: []
  # CPU: a 5m REQUEST and deliberately NO CPU LIMIT (#1321), the same call as
  # the agent (#1116), mesh-dns (#1253) and the authz sidecar. The plugin serves
  # NodePublishVolume / NodeUnpublishVolume, so its latency is on the start (and
  # the termination) path of every UDS pod. At the old 5m request / 100m limit
  # it used 11-23 CPU-seconds per pod over an 8 h soak (under 1m on average) and
  # was STILL CFS-throttled in 57.6 % of the 100 ms periods it ran in (cAdvisor,
  # the reference cluster 2026-10-06: 20,248 throttled of 35,169 periods, 15 pods). All of its
  # CPU is bursts: a publish (mkdir, mount, bind), and every 30 s the liveness
  # probe, which is a whole second Go process (`/uds-csi --probe`) started
  # inside THIS container's cgroup. A burst past 10 ms in a period parks the
  # container, the RPC in flight included, until the next period.
  #
  # The request is unchanged: 5m is already several times the measured average,
  # and it is what the scheduler reserves on every node, UDS workload or not.
  # It is also the CFS weight under contention, and there 5m is small (1:100
  # against the proxy's 500m); a request sized to win that contest would
  # reserve far more than this plugin uses, on every node, for a case nobody
  # has measured. If cpu.pressure shows the plugin waiting on a saturated node
  # (docs/runbook.md, "uds-csi CPU throttling"), raise it then. The pod was
  # already QoS Burstable (requests != limits), so no
  # QoS class changes. Memory is unchanged and this daemon sets no GOMEMLIMIT.
  # To restore a cap, set limits.cpu (and see goMaxProcs below); an empty
  # limits.cpu renders no CPU limit.
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 32Mi
  # GOMAXPROCS for the uds-csi container, set as an explicit env var (#1321).
  # Since Go 1.25 the runtime derives GOMAXPROCS from the cgroup CPU limit with
  # a floor of 2, so under the old 100m limit this daemon already ran with 2;
  # with the limit gone it would scale to the node's core count -- and so would
  # every 30 s liveness-probe process, which inherits this env var -- for work
  # that is one gRPC call and a handful of syscalls. 2 keeps today's runtime
  # behaviour exactly. 0 (or empty) omits the env var and hands GOMAXPROCS back
  # to the Go runtime.
  goMaxProcs: 2

# Per-node Envoy proxy DaemonSet. Disable to deploy only the agent.
#
# NOTE — this DaemonSet uses TWO images: `proxy.image` (Envoy) for the runtime
# container, and `proxy.supervisor.image` for the install-supervisor
# initContainer, which stages the hot-restart supervisor and the stdlib-only
# `/proxy-ready` prober onto the pod's shared volume. Both staged binaries come
# out of that one image, built from one commit, so they cannot skew against each
# other.
proxy:
  enabled: true
  # External image (built by the //proxy workspace), pinned by proxy-release.yml's
  # bump-chart PR to the publishing commit SHA + index digest. Mirror by
  # overriding `repository`.
  #
  # `repository:` must be exactly image_reference("proxy") from
  # bazel/registry/registry.bzl: every pin reader (//bazel/proxy_pin, the publish-verify
  # sweep, ci.yaml's proxy-pin job, the bump-chart rewrite in
  # scripts/proxy-pin-lib.sh) accepts that reference and no other.
  image:
    repository: quay.io/aethermesh/proxy
    tag: 7ae32088c8fb9bdb176e55cdf11d438dd7ff5b83
    # Digest-pinned (option A): content-addressed, tamper-proof. The aether.image
    # helper prefers digest over tag. Multi-arch index for 7ae32088c8fb9bdb176e55cdf11d438dd7ff5b83.
    digest: "sha256:9b34278d9b92d79fe09c1ed208eb9cdc40bc557e0b8bc6941a54b9f695a7288d"
    pullPolicy: Always
  # The Envoy hot-restart supervisor (#772): its own binary and its own image
  # since it stopped being an `agent` subcommand. The initContainer runs it to
  # stage /opt/aether/supervisor and /opt/aether/proxy-ready; nothing else pulls
  # it. Mirror to a private registry by overriding `repository` alone; the digest
  # is preserved.
  supervisor:
    image:
      repository: "{@//agent/cmd/proxy-supervisor:image_push.repository}"
      digest: "{@//agent/cmd/proxy-supervisor:image_push.digest}"
      tag: ""
      pullPolicy: Always
    # Resources of the install-supervisor init container (#1344). It runs on
    # EVERY proxy pod start, ahead of the proxy: it copies the supervisor (itself,
    # ~16 MB) and the proxy-ready prober onto the pod's shared volume and exits.
    # Until chart 2.4.13 it rendered no `resources` at all: nothing throttled
    # it, but with no request it ran at the minimum CFS weight -- on a node
    # whose cores are saturated by a proxy handoff (#1093), which is exactly
    # when a proxy pod starts -- and was invisible to request accounting.
    #
    # requests 100m / 32Mi: the same request as cni-install, the agent pod's
    # init container of the same kind (one short burst, then exit). Measured on
    # a workstation build of the binary: the self-copy takes ~50 ms of CPU and
    # peaks at ~14 MB RSS, and still completes in an 8 MB memory cgroup (the
    # copy streams; the page cache it dirties is reclaimable). An init
    # container's request only counts toward the pod's effective request where
    # it exceeds the app containers' sum (the proxy's 500m / 512Mi), so this
    # reserves nothing more on the node; it is the container's CFS weight while
    # it runs.
    #
    # NO CPU limit, deliberately: a quota is what stretched cni-install's
    # 50-80 ms of work to 500-800 ms (#1335). The 64Mi memory limit is a
    # backstop, about 4x the measured peak. No GOMAXPROCS pin: the work is
    # single-threaded and the process exits within the second. To add a cap,
    # set limits.cpu; an empty value means "no limit".
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        memory: 64Mi
  logLevel: info
  # Emit Envoy's own application logs as one JSON object per line (bootstrap
  # application_log_config). Set false for Envoy's default text format.
  jsonLogs: true
  # Envoy hot restart tunables (the mechanism itself is not optional). See
  # docs/proposals/001_proxy-hot-restart.md.
  hotRestart:
    baseId: 0
    drainTime: 10s
    # Also the supervisor's admin re-verify budget: the epoch-identity probe
    # re-confirms on a fresh connection every parentShutdownTime/3 (floor 2s), so a
    # cross-pod takeover is diagnosed while the draining parent still lives
    # (proposal 001 lessons 3/6; agent/internal/proxy/hotrestart/adminprobe.go, #666).
    # Below ~6s the floor takes over and the supervisor logs the lost margin at
    # startup. Raising it also delays successor-pod readiness by the same amount.
    parentShutdownTime: 15s
    handoffDeadline: 0
    adminUnresponsiveDeadline: 0
    shmHostPath: /run/aether/shm
    # Envoy --drain-strategy for the hot-restart parent (and every other drain:
    # LDS listener removal, the pod-termination drain). One of immediate or
    # gradual (Envoy's own default).
    #
    # immediate (#1054): from the moment the drain starts, EVERY response on a
    # draining HTTP connection carries GOAWAY (h2) / an HTTP/3 GOAWAY, so a
    # source's h3 pool stops sending new requests to the parent and moves to
    # the child. Under gradual the GOAWAY is a coin flip per response weighted
    # by elapsed/drainTime, so a busy connection can lose every flip and still
    # be open when the parent exits at parentShutdownTime; its next packet then
    # reaches the child, which answers with a QUIC stateless reset the source
    # accepts, and the in-flight request fails (source `503 UC ...
    # Received_stateless_reset`). An IDLE connection gets no GOAWAY under
    # either strategy — agent.eastWestQuicIdleTimeout closes those first.
    #
    # Cost: reconnections bunch at the start of the drain instead of spreading
    # over drainTime (a burst of TLS/QUIC handshakes against the child), and it
    # is server-wide: h2 connections, LDS listener drains and the
    # pod-termination drain all switch too.
    #
    # Default is gradual. On the reference cluster immediate made the #1054 resets WORSE
    # (4/8/0 per roll vs 1–3 per run under gradual): every parent connection
    # closes at drain start, and those closes are what the source then sees
    # reset. The carried patches (#1064: the child unpauses its UDP listeners
    # only after the parent exits; #1066: the draining parent answers its own
    # time-wait connections) fixed the exit window under gradual. Keep
    # immediate as an explicit opt-in only.
    drainStrategy: gradual
    # Pass Envoy --skip-hot-restart-parent-stats (#1050). This was the
    # workaround for a hot-restart deadlock: the child asked the draining parent
    # for its stats on every 5s flush with a blocking, timeout-less recvmsg
    # while the parent's main thread forwarded QUIC/UDP datagrams to the child
    # with a blocking, timeout-less sendmsg, and each main thread could end up
    # waiting on the other forever (both epochs dead until the supervisor's
    # watchdog killed them). The carried Envoy patch in the aether-proxy image
    # (#1060: non-blocking forwarding, bounded child receives) removes the
    # deadlock itself, so the default is off again and the child merges the
    # parent's stats as upstream intends. Kept as an emergency switch: turning
    # it on only costs the parent's gauges and its last <=5s of counter deltas
    # in the child (counters are per-generation already, #708).
    skipParentStats: false
    # Supervisor --hot-restart-on-concurrency-change (#1136). Off (default): when
    # the live predecessor's Envoy worker count differs from the one the new pod
    # will run with (the rollout that changes proxy.concurrency, below), the new
    # pod does NOT hot-restart. It drains the predecessor (graceful drain over
    # drainTime, then stops it) and starts a fresh Envoy at epoch 0. On: hot-
    # restart anyway, which resets about half of the predecessor's live HTTP/3
    # connections on every node. An operator override, not a tuning knob.
    hotRestartOnConcurrencyChange: false
  # Envoy worker thread count (#1093). 0 = do not pass the flag, and Envoy picks
  # its own count: the smallest of the node's online CPUs, the CPUs the
  # container's affinity mask allows, and the CPU limit of the container's OWN
  # cgroup (resources.limits.cpu below) rounded DOWN to a whole CPU, never less
  # than 1 (#1442, #1455). That is one worker per core only while the container
  # has no CPU limit and no restricted mask, which is what the chart's defaults
  # give; with a 1500m limit it is one worker, with 2 or 2500m two. So, with 0:
  #   - changing resources.limits.cpu across a whole-CPU boundary changes the
  #     worker count, and that rollout is the drain + fresh start described
  #     below on every node, not a hot restart. Set an explicit count whenever
  #     you set a CPU limit.
  #   - only the container's own cgroup is read. A CPU limit on the pod as a
  #     whole, with none on this container, leaves one worker per core on a
  #     throttled pod (docs/runbook.md, "Sizing nodes for a proxy hot restart").
  # The chart never renders `--concurrency 0`: passed explicitly, that is ONE
  # worker, not this default (docs/configuration.md).
  # N > 0 passes `--concurrency N` to every Envoy epoch through the supervisor
  # (--envoy-arg), and Envoy runs exactly N whatever the limit or the mask. It
  # exists because on a
  # 4-core node a hot-restart handoff runs two Envoys at once — 8 worker threads
  # plus 2 main threads on 4 saturated cores — and #1093 needs to A/B a smaller
  # count.
  #
  # Changing it is a drain + fresh start, not a hot restart (#1136). A hot
  # restart between different worker counts re-steers the parent's QUIC
  # connections by the child's count (the reuse-port steering program belongs to
  # the whole socket group) and resets about half of them. So when the new pod's
  # supervisor finds a live predecessor with another count, it drains it
  # (graceful drain over hotRestart.drainTime, then stops it) and starts its own
  # Envoy fresh. Expect, on each node in turn, the drain window plus a short
  # data-plane gap while the fresh Envoy initializes (no listeners on the node);
  # every restart after that rollout is same-to-same and hitless again.
  # hotRestart.hotRestartOnConcurrencyChange forces the old hot restart.
  # Do not change it on a live mesh until both prerequisites are deployed: the
  # successor crash of a downward change (#1126) is fixed by the carried Envoy
  # patch envoy-aether1126-forwarded-udp-worker-index.patch, in proxy images
  # built from it or later, and the #1127 supervisor fix is the other one.
  # Must be a non-negative integer; the chart refuses to render otherwise.
  concurrency: 0
  # Pod terminationGracePeriodSeconds, and the same value passed to the supervisor
  # as --termination-grace. The deleted pod must keep its Envoy alive as the
  # successor's hot-restart parent until the successor's (xDS-gated, unbounded)
  # init and parent-shutdown timer have run, so this is deliberately generous.
  #
  # The supervisor needs to know it because it is the only non-arbitrary bound on
  # that wait: where no successor can ever appear — node shutdown, scale-down,
  # `kubectl delete daemonset`, a replacement stuck Pending — it waits until
  # terminationGrace minus (hotRestart.drainTime + 5s + 10s) and then drains Envoy
  # itself, instead of being SIGKILLed with connections open (#771). Keep it well
  # above hotRestart.drainTime + 15s or that fallback cannot fit and the supervisor
  # reverts to waiting for the SIGKILL.
  # `helm uninstall` is one of those terminations: each proxy pod then stays
  # Terminating for most of this value (#1472; docs/runbook.md, "Uninstalling").
  terminationGracePeriodSeconds: 180
  # Supervisor --shutdown-drain-immediately (#795): on SIGTERM, drain Envoy's
  # listeners straight away instead of first waiting (bounded by
  # terminationGracePeriodSeconds, above) for a surge replacement to hot-restart
  # it. The escape hatch for a deployment where no replacement pod can overlap
  # this one (docs/configuration.md). LEAVE IT OFF wherever a surge replacement
  # exists: that wait is what keeps pod delete, node drain, eviction and
  # preemption hitless.
  shutdownDrainImmediately: false
  # The /proxy-ready exec readiness probe runs inside this container's cgroup, so
  # each probe process counts against limits.memory alongside the supervisor and
  # BOTH Envoy epochs during a hot restart: ~2.4Mi max RSS per run (measured, 500
  # runs). Small next to 512Mi, but keep it in mind before trimming the limit.
  # The supervisor sets no GOMEMLIMIT; Envoy's heap is bounded by overload
  # (maxHeapSizeBytes, below).
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 512Mi
  # External authorization sidecar (proposal 027): an authz gRPC service co-located
  # in this DaemonSet pod, reached over a Unix socket. When enabled, the proxy
  # bootstrap gains a static `authz_sidecar` cluster and the agent emits a
  # DISABLED ext_authz entry on the HTTP filter chains — zero effect until an
  # HTTPFilter (extAuthz) opts a route/service in.
  authzSidecar:
    enabled: false
    # Built-in OPA preset (opt-in): runs the OPA envoy plugin with the policy below.
    opa:
      enabled: false
      # OPA >= 1.21 reads YAML under the 1.2 core schema: bare yes/no/on/off/y/n
      # are strings, not booleans. The preset passes OPA no YAML (flags and a
      # .rego file only); a policy that calls yaml.unmarshal, or a bundle/--data
      # YAML you add, must spell booleans true/false (#1222).
      #
      # A third-party image, so it is pinned by the digest of its multi-arch
      # index (linux/amd64 and linux/arm64): the tag is kept for the reader and
      # the digest is what the node pulls (#1401; it was the tag alone until
      # chart 2.4.22). The pin is listed in scripts/third-party-images.txt, and
      # `scripts/third-party-images.sh outdated` says when the registry has
      # moved past it (docs/runbook.md, "Refreshing third-party image pins").
      # The sidecar is a container of the proxy pod: a changed value here rolls
      # the proxy DaemonSet on every node where the preset is on.
      image: openpolicyagent/opa:1.21.1-envoy-static@sha256:b4a8bbe87c9405419d03d1a8b6b9f4b540e7ea8ff8832248d6339b30594b344b
      # Rego policy mounted via ConfigMap; must define the decision the plugin
      # queries (envoy/authz/allow by default). Required when opa.enabled.
      #
      # The sidecar WATCHES it (opa run --watch, #1383): a changed policy is
      # loaded by each node's sidecar when that node's kubelet delivers the
      # ConfigMap update, with no pod restart. 27-64 s was observed on one
      # node; it is not a bound (kubelet sync period plus its ConfigMap cache
      # delay, per node). That means no staging either: every node picks it up
      # independently, in no order, not one node at a time like a roll, and
      # nothing reports when the last one has. Confirm per proxy pod.
      # The chart does not validate it. VALIDATE IT BEFORE YOU CHANGE IT, with
      # the image the sidecar runs (`image` above, as you have set it), so the
      # check uses the OPA version that will load the policy:
      #   docker run --rm -v "$PWD/policy.rego:/policy/policy.rego:ro" \
      #     "<the value of proxy.authzSidecar.opa.image>" check /policy/policy.rego
      # A policy that does not parse or compile is not loaded by a running
      # sidecar (it keeps the last good one and logs the error), but a sidecar
      # that STARTS with it exits: after a sidecar restart every check on that
      # node fails per failureMode, and a new proxy pod never starts its proxy.
      # docs/runbook.md, "Changing the OPA policy".
      policy: ""
    # Bring-your-own authz container (used when opa.enabled is false). Must serve
    # envoy.service.auth.v3.Authorization on unix:///run/aether/authz/authz.sock.
    image:
      repository: ""
      tag: ""
      args: []
    # Check timeout and the REQUIRED failure mode: DENY (fail-closed, requests 403
    # when the sidecar is unreachable) or ALLOW (fail-open).
    #
    # Case- and whitespace-insensitive, and validated at render time: anything
    # that is not ALLOW or DENY fails `helm template`/`helm install` with a named
    # error. It used to be compared raw, so `allow` silently meant DENY (#770).
    timeout: 200ms
    failureMode: DENY
    # #1275: the sidecar is a Kubernetes NATIVE sidecar (an init container with
    # restartPolicy: Always; needs Kubernetes >= 1.29, enforced at render time).
    # The kubelet starts the proxy container only after this startupProbe passes
    # and stops the sidecar only after the proxy container has exited, so neither
    # a new nor a draining old Envoy runs without its authz.
    #
    # The default probe execs the staged stdlib-only proxy-ready prober inside
    # the sidecar's container: started = a connect(2) to
    # /run/aether/authz/authz.sock succeeds. That is the contract every sidecar
    # here must already meet (OPA preset or bring-your-own), so it works for
    # both. Budget: failureThreshold x periodSeconds before the kubelet restarts
    # the sidecar (image pulls do not count — probing starts once the container
    # has started); the old pod keeps serving meanwhile (maxUnavailable: 0).
    startupProbe:
      enabled: true
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
      # A full Kubernetes probe (exec/grpc/httpGet plus its timings) used
      # verbatim INSTEAD of the socket check, for a sidecar that is "started"
      # by some other test. Mind the pod is hostNetwork: a port probe answers for
      # whichever pod on the node holds the port. With enabled: false there is
      # no startupProbe at all and the kubelet counts the sidecar started as soon
      # as its process is; the ordering then guarantees "running", not "serving".
      override: {}
    # Optional probes for the sidecar, rendered verbatim; none by default. A
    # native sidecar's readinessProbe counts toward the pod's Ready (and so
    # gates a proxy roll); a livenessProbe failure restarts only the sidecar
    # — while it is down, checks fail per failureMode (403s under DENY).
    livenessProbe: {}
    readinessProbe: {}
    # The sidecar used to run with `resources: {}`: unbounded, and invisible to
    # node CPU/memory request accounting on a DaemonSet that is on every node.
    # OPA idles at ~10 Mi / ~0 m with a small policy (measured on 1.20.2); the
    # request reflects that, the memory limit leaves room for a real policy and
    # its decision cache. No CPU limit, deliberately: this is on the request path
    # of every authorized route and throttling it turns into ext_authz timeouts,
    # which under failureMode DENY are 403s. Applies to both the OPA preset and a
    # bring-your-own image.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  # Envoy overload manager graceful-degradation ladder; engages before the OOM
  # kill. Keep maxHeapSizeBytes at ~75% of resources.limits.memory.
  overload:
    enabled: true
    maxHeapSizeBytes: 402653184 # 384Mi = 75% of 512Mi

# ----------------------------------------------------------------------- edge
# North-south ingress gateway (proposal 003): an unprivileged Deployment running
# Envoy + an `agent edge` sidecar that serves it xDS. The edge dials mesh pods
# DIRECTLY over mTLS (no node DaemonSet in the path) and routes external traffic
# by Gateway API HTTPRoutes (proposal 018): per-FQDN, ordered path-matched rules to
# mesh services, attached to a Gateway of the edge's GatewayClass. Envoy fetches its
# single SVID straight from SPIRE over the workload socket (no agent SPIRE bridge).
# Disabled by default.
edge:
  enabled: false
  # Trusted proxies in front of the edge (topology fact, proposal 028): feeds BOTH
  # the HCM's client-address resolution and the geoip filter's XFF config.
  xffNumTrustedHops: 0
  # Edge best-practices config (proposal 029) — the fleet-default EdgeConfig the
  # GatewayClass parametersRef points at. Override per-Gateway with your own EdgeConfig
  # via Gateway.spec.infrastructure.parametersRef. Values are the Envoy edge defaults.
  config:
    name: ""                                # default "aether-edge-defaults"
    useRemoteAddress: true                  # edge trusts the connection source, not XFF
    # Canonical enum names (buf ENUM_VALUE_PREFIX): HEADERS_WITH_UNDERSCORES_ACTION_{ALLOW,REJECT_REQUEST,DROP_HEADER}.
    headersWithUnderscoresAction: HEADERS_WITH_UNDERSCORES_ACTION_REJECT_REQUEST
    streamIdleTimeout: 300s
    requestTimeout: 300s                    # 0s disables
    idleTimeout: 3600s
    perConnectionBufferLimitBytes: 32768    # 32 KiB
    http2:
      maxConcurrentStreams: 100
      initialStreamWindowSize: 65536        # 64 KiB
      initialConnectionWindowSize: 1048576  # 1 MiB
    http3:
      enabled: false                        # QUIC/HTTP3 UDP listener on the HTTPS port (M3)
  # GeoIP at the edge (proposal 028): emit x-geo-* request headers from a MaxMind
  # database. The reserved x-geo-* namespace is ALWAYS stripped from client
  # requests at the edge (the Envoy filter passes spoofed values through on a
  # lookup miss — aether does not). Databases are bring-your-own (licensing).
  geoip:
    enabled: false
    # Which headers to emit: country, city (both served by a city-type mmdb).
    headers: [country]
    database:
      # Secret containing the mmdb; mounted read-only. Key = the file name below.
      secretName: ""
      fileName: GeoLite2-City.mmdb
  # The edge is an ingress gateway, not a mesh workload, so it runs in its own
  # namespace, isolated from the control plane. namespaceCreate lets the chart
  # create it (with baseline PSA); set false if you manage the namespace yourself.
  # A namespace the chart creates is annotated
  # aether.io/edge-meshconfig-in-manifest: "true" (when meshConfig.createDefault
  # is on), and so is the MeshConfig in it: the edge's MeshConfig is then an
  # object of the release on every revision, so that `helm rollback` works to
  # each of them (#1514).
  namespace: aether-ingress
  namespaceCreate: true
  # Gateway replicas behind the Service; rolled with the standard RollingUpdate
  # + readiness gate (no hot-restart supervisor — nothing node-local to preserve).
  replicaCount: 2
  # How the gateway replicas are spread across nodes: see registrar.nodeSpread
  # (soft | required | none). Two ingress replicas on one node are a single
  # point of failure behind the load balancer.
  nodeSpread: soft
  # Non-empty REPLACES the constraint nodeSpread renders (it is not merged with
  # it). Empty = the nodeSpread constraint.
  topologySpreadConstraints: []
  # Empty = chart default, which depends on replicaCount (#812): with >= 2
  # replicas, `maxSurge: 0, maxUnavailable: 1` — no surge pod to be preempted on
  # a dense node, and the spread above keeps a replica serving behind the LB.
  # With exactly 1 replica, `maxSurge: 1, maxUnavailable: 0`, since a single
  # replica cannot roll without either a surge or an outage. Set to replace the
  # default entirely, e.g. to restore surging on a cluster with spare headroom.
  rollingUpdate: {}
  # The edge reuses the agent image (run as `agent edge`) and the proxy image
  # (plain Envoy entrypoint). Override agent.image / proxy.image to mirror.
  # Ports the edge's public-facing listeners bind (north-south). Privileged ports
  # (<1024, e.g. 80/443) are bound by granting the Envoy container
  # NET_BIND_SERVICE — the pod still runs unprivileged. With tls.enabled the edge
  # serves HTTPS on httpsPort and an HTTP->HTTPS redirect on httpPort; otherwise
  # plain HTTP on httpPort.
  httpPort: 80
  httpsPort: 443
  # Default namespace for Gateway TLS certificate Secrets. Empty = the edge's
  # own namespace. (Gateway/route watching is cluster-wide regardless; the
  # readiness listener is the fixed port 18021, a proposal 030 constant.)
  routeNamespace: ""
  # The edge routes exclusively via Gateway API (proposal 018): it serves the
  # HTTPRoutes attached to Gateways of this GatewayClass. Requires the Gateway API
  # CRDs installed (standard channel); the chart renders this GatewayClass bound to
  # the aether edge controller (gateway.aether.io/edge).
  gatewayClassName: aether
  # gateway controls the chart-managed Gateway resource for this edge deployment.
  # By default the chart creates one Gateway of the aether GatewayClass with HTTP
  # (and optionally HTTPS) listeners. Set create=false to manage your own Gateway
  # (you MUST add gateway.aether.io/http-redirect: "true" to that Gateway if you
  # want HTTP→HTTPS redirect). When tls.enabled=true the chart automatically adds
  # the http-redirect annotation to the generated Gateway.
  gateway:
    create: true
    # tlsSecretName / tlsSecretNamespace: the kubernetes.io/tls Secret holding the
    # downstream TLS cert. REQUIRED when tls.enabled=true and gateway.create=true.
    # The Secret must be in the edge namespace (or tlsSecretNamespace if set).
    tlsSecretName: ""
    tlsSecretNamespace: ""
    # address pins the Gateway's spec.addresses. Under proposal 021 Phase 2
    # (per-Gateway addressing) the edge controller requests this IP from MetalLB for
    # the Gateway's own LoadBalancer Service, so the edge keeps a stable address
    # (e.g. the IP api.example.com resolves to). Empty = MetalLB auto-assigns from
    # the pool.
    address: ""
    # hostname constrains the chart-managed Gateway's listeners (e.g.
    # "*.example.com"). Empty = listeners accept any host.
    hostname: ""
    # httpRoutes declares HTTPRoutes managed by this chart, each parented to the
    # chart-managed edge Gateway above. This is the supported, declarative
    # replacement for hand-applying HTTPRoute manifests (DEPRECATED). Each entry:
    #   - name: api
    #     hostnames: ["api.example.com"]
    #     rules:
    #       - backendRefs:
    #           - name: my-backend
    #             port: 8080
    # `rules` is a standard Gateway API HTTPRoute rules list (matches, backendRefs,
    # filters), passed through verbatim.
    httpRoutes: []
  # Downstream (external-facing) TLS. Certs are referenced per Gateway listener
  # (spec.listeners[].tls.certificateRefs, a kubernetes.io/tls Secret in the
  # watched namespace), read by the edge agent and served to Envoy over SDS
  # (SNI-selected, hot rotation, no pod roll). Aether does not issue certs — bring
  # your own (cert-manager, kubectl, …). The edge->pod upstream hop stays mTLS.
  tls:
    enabled: false
  # Envoy admin endpoint, bound to pod-local loopback (127.0.0.1) only — never
  # exposed via a Service. Off by default (it is an unauthenticated control surface
  # even on loopback); enable for diagnostics (config_dump/stats) and reach it with
  # `kubectl port-forward <edge-pod> 9901:9901`.
  admin:
    enabled: false
    port: 9901
  # The shared edge Service is always ClusterIP (per-Gateway LoadBalancer
  # Services own the external IPs — proposal 021 Phase 2, unconditional).
  service:
    port: 80
    httpsPort: 443
    # extraPorts declares additional TCP ports on the edge Service. Each entry
    # becomes a spec.ports item. Use this to expose the ports bound by Gateway
    # TCP/TLS listeners (TCPRoute/TLSRoute parented to the edge Gateway).
    # Example: [{name: postgres, port: 5432, protocol: TCP}]
    extraPorts: []
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      memory: 256Mi
  # GOMAXPROCS for the edge pod's `agent` container (the `agent edge` control
  # plane), set as an explicit env var (#1335) exactly like agent.goMaxProcs
  # (#1116). `resources` above carries no CPU limit, and since Go 1.25 the
  # runtime derives GOMAXPROCS from the cgroup CPU limit, so without this it
  # follows the node's core count (and the GC's background workers with it).
  # Measured on the reference cluster (cAdvisor, 2 replicas, the 45 h to 2026-10-07, light
  # edge traffic): the container averaged 1.8m and its busiest 5 minutes were
  # 4.4m -- well under
  # one percent of ONE core -- so 2 is not a ceiling it can feel; it is the
  # node agent's value, and leaves a P for a snapshot build next to the Gateway
  # API watches and the xDS stream. The `envoy` container is not a Go process
  # and is unaffected. Set to 0 (or empty) to omit the env var and hand
  # GOMAXPROCS back to the Go runtime (e.g. alongside an explicit CPU limit,
  # which the runtime then honours).
  goMaxProcs: 2
  # Envoy worker thread count for the edge pod's `envoy` container (#1344), the
  # same shape as proxy.concurrency (#1093): N > 0 passes `--concurrency N`,
  # 0 passes no flag and Envoy picks its own count -- what every chart before
  # 2.4.13 did: the smallest of the node's online CPUs, the CPUs the container's
  # affinity mask allows, and the CPU limit of the container's own cgroup
  # (edge.resources.limits.cpu) rounded down to a whole CPU, never less than 1
  # (#1455). One worker per node core only when the container has no CPU limit
  # and no restricted mask; a limit on the pod as a whole is not read.
  #
  # Default 2, the count the node proxies run with on the reference cluster since #1093.
  # The edge Envoy averages about 12m of CPU there, so two workers are far from
  # a ceiling, and each worker it does not start is a thread's idle wake-ups and
  # per-worker memory (connection pools, thread-local stats and config) saved.
  # Raise it for an edge that terminates real traffic volume: a worker is one
  # core's worth of TLS and HTTP work at most.
  #
  # Unlike proxy.concurrency, changing it is an ordinary rolling update: the
  # edge has no hot restart and no shared reuse-port socket group across pods,
  # so none of #1136's caveats apply. Each new replica simply starts with the
  # new count behind its readiness probe.
  # Must be a non-negative integer; the chart refuses to render otherwise.
  concurrency: 2
  # Envoy overload manager on the fixed_heap monitor (edge-configmap.yaml), the
  # same monitor the node proxy uses. The unprivileged edge pod COULD use
  # cgroup_memory, but fixed_heap keeps parity and is independent of the cgroup
  # layout. Keep maxHeapSizeBytes at ~75% of resources.limits.memory.
  overload:
    enabled: true
    maxHeapSizeBytes: 201326592 # 192Mi = 75% of 256Mi
  # Hitless-rollout drain. The per-Gateway LoadBalancer Services use
  # externalTrafficPolicy: Cluster, so on a rollout kube-proxy keeps routing to a
  # terminating pod for the endpoint-propagation window. Without a drain, the edge
  # Envoy receives SIGTERM and stops accepting BEFORE that endpoint is withdrawn,
  # so connections kube-proxy still steers to it are reset (measured ~0.25%/roll).
  #
  # Mirrors the node proxy's two-phase drain (proxy.hotRestart.drainTime = 10s, the
  # empirically 0-fail value): a native kubelet `sleep` preStop holds SIGTERM off
  # both containers for preStopSeconds. The pod is already Terminating, so kube-proxy
  # withdraws its endpoint during the sleep WHILE Envoy keeps accepting and serving
  # in-flight requests. Only after the sleep does Envoy get SIGTERM and drain
  # gracefully. terminationGracePeriodSeconds must comfortably exceed the sleep plus
  # Envoy's own graceful-shutdown drain. The native `sleep` lifecycle action (GA
  # k8s 1.30+) is used so no in-container shell is required — the edge Envoy/agent
  # images are distroless (no /bin/sleep, curl, or wget).
  drain:
    # Seconds the preStop sleep holds off SIGTERM so kube-proxy propagates the
    # endpoint removal while Envoy still serves. Matches proxy.hotRestart.drainTime.
    # 0 disables the preStop hook entirely.
    preStopSeconds: 10
    # Pod terminationGracePeriodSeconds. Must exceed preStopSeconds plus Envoy's
    # graceful drain so SIGKILL never lands mid-drain. Default 30 = 10s sleep +
    # ~15s Envoy drain + buffer.
    terminationGracePeriodSeconds: 30
  # SPIRE identity for the edge (when spire.enabled): create a ClusterSPIFFEID so
  # SPIRE issues the edge pod its SVID. Mirrors controller.webhook.clusterSpiffeID.
  spire:
    clusterSpiffeID:
      create: true
      # spire-controller-manager class name (e.g. "spire-mgmt-spire"). REQUIRED
      # when create=true; empty = not rendered (manage the ClusterSPIFFEID yourself).
      className: ""

# ----------------------------------------------------------------- registrar
registrar:
  image:
    repository: "{@//registrar/cmd/registrar:image_push.repository}"
    digest: "{@//registrar/cmd/registrar:image_push.digest}"
    tag: ""
    pullPolicy: Always
  # 2 replicas ALWAYS (directive 2026-06-11): exercises the multi-replica
  # write-behind topology permanently.
  replicaCount: 2
  # How the replicas are spread across nodes (#1434). One node lost must not
  # take every replica with it.
  #   soft (default): a topology spread constraint over kubernetes.io/hostname,
  #     maxSkew 1, whenUnsatisfiable ScheduleAnyway. A preference: the scheduler
  #     weighs it against its other scores, so it can lose, and a single-node
  #     cluster schedules every replica as before.
  #   required: the same constraint with DoNotSchedule (and nodeTaintsPolicy
  #     Honor, so a tainted control plane is not counted as an empty node). A
  #     replica is refused a node only while another node the pod could use
  #     holds fewer, so it never leaves a replica Pending for want of nodes:
  #     two replicas on a one-node cluster still both schedule. It does leave a
  #     replica Pending when the only emptier node has no room for it. A node
  #     that is NotReady or cordoned is not counted either, so while one is,
  #     replicas may share another node.
  #     Needs Kubernetes >= 1.27; the render fails below that.
  #   none: no constraint.
  # From Kubernetes 1.27 the constraint carries matchLabelKeys:
  # [pod-template-hash], so it counts the pods of one ReplicaSet: during a
  # rollout the old replicas are not counted beside the new ones. That, and
  # the controller's former default affinity (see controller.affinity), is how
  # both replicas could end up on one node under the soft constraint this
  # chart already rendered before 2.4.20. Nothing moves a running pod: the
  # constraint acts when a pod is scheduled, so replicas already on one node
  # stay there until the next rollout (or `kubectl rollout restart`).
  # Write none, not off: unquoted, off is the YAML boolean false, and the chart
  # rejects it.
  nodeSpread: soft
  # Non-empty REPLACES the constraint nodeSpread renders (it is not merged with
  # it). Empty = the nodeSpread constraint.
  topologySpreadConstraints: []
  # The CPU limit STAYS here, reviewed with the same data that removed it from
  # uds-csi (#1321): on the 2026-10-06 8 h soak the registrar was CFS-throttled
  # in 1.5 % of its periods (uds-csi: 57.6 %). A throttled period delays an
  # endpoint update on its way to the agents by less than 100 ms; it is not on
  # a request path. Against that, requests == limits makes this pod QoS
  # Guaranteed (last in the kubelet's node-pressure eviction order), which
  # dropping limits.cpu would give up, and GOMAXPROCS is derived from
  # limits.cpu (registrar-deployment.yaml: 1 at 100m), so without a limit it
  # would follow the node's core count. Revisit if the throttled fraction
  # grows with the fleet (docs/runbook.md, "uds-csi CPU throttling", has the
  # query): raise requests and limits together to keep Guaranteed.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 64Mi
  service:
    port: 443
    targetPort: 8443
  # Registry backend (`--registry-backend`): kubernetes, etcd.
  registryBackend: kubernetes
  # Multi-Cluster Services (MCS-API) phase 1 (`--enable-mcs`; proposals 018 + 006):
  # the leader registrar exports local ServiceExports to the registry and
  # materializes a ServiceImport (ClusterSetIP) + a local clusterset.local VIP
  # Service for every service exported anywhere in the clusterset. Requires the
  # etcd backend (the cross-cluster plane); no-ops/errors for kubernetes.
  # Default OFF — adds ServiceExport/ServiceImport RBAC only when enabled. The MCS
  # ServiceExport/ServiceImport CRDs must be installed separately (the upstream
  # sigs.k8s.io/mcs-api CRDs). DNS stays strictly local; the cross-cluster data
  # path (remote endpoint resolution) is a later phase.
  enableMCS: false
  # Region owning this registrar's etcd partition (etcd backend; proposal 006).
  # Keys are origin-first /aether/v1/regions/<region>/clusters/<clusterName>/…;
  # shared by every registrar on the same regional etcd.
  region: local
  # etcd client endpoints (used when registryBackend == etcd).
  etcd:
    endpoints: []
  # Peer regions' etcd endpoints for cross-region replication (proposal 006
  # Phase 2), one entry per peer region: "<region>=<endpoint>[,<endpoint>...]".
  # The leader registrar mirrors this region's own registry subtree verbatim
  # into each peer's etcd under an origin-heartbeat lease: if this region dies,
  # its mirror expires on the peers (TTL ~30s) — whole-region failover cleanup.
  # Requires registryBackend=etcd and a non-default region (one region = one
  # etcd). Empty = no replication.
  peerEtcd: []

# ---------------------------------------------------------------- controller
controller:
  image:
    repository: "{@//controller/cmd/controller:image_push.repository}"
    digest: "{@//controller/cmd/controller:image_push.digest}"
    tag: ""
    pullPolicy: Always
  # Two by default. Leader election is on, so the second replica is a warm
  # standby for the reconcilers and the node-taint guard — but the admission
  # webhooks are served by EVERY replica, and they are failurePolicy: Ignore:
  # while no replica answers, pods are admitted unmutated, so a pod created in an
  # aether.io/managed namespace silently comes up OUTSIDE the mesh and a managed
  # pod misses its ndots. With one replica, deleting the leader measured a 49 s
  # gap (the reference cluster, 2026-09-19); a node drain or an image pull makes it longer.
  replicaCount: 2
  # How the replicas are spread across nodes: see registrar.nodeSpread
  # (soft | required | none). Every replica serves the admission webhooks, so
  # two on one node share that node's fate. Until 2.4.20 this was a preferred
  # anti-affinity term in the default affinity below.
  nodeSpread: soft
  # Non-empty REPLACES the constraint nodeSpread renders (it is not merged with
  # it). Empty = the nodeSpread constraint.
  topologySpreadConstraints: []
  # Rendered as the pod's affinity when set; empty = none. Until 2.4.20 empty
  # meant a default: preferred podAntiAffinity away from the registrars' node
  # (and from the other controller replica). That default is gone (#1434): a
  # preferred anti-affinity term works in both directions, so it also pushed
  # each new registrar off the nodes holding a controller, as strongly as the
  # registrar's own spread pulled it there. Measured on a two-worker kind
  # cluster, about half the rollouts ended with both registrars (and as many
  # with both controllers) on one node. Independent of nodeSpread.
  affinity: {}
  # Pod-ndots mutating webhook (proposal 018, mesh-global FQDN): inject dnsConfig
  # ndots (= the mesh-domain label count) into managed pods so a mesh FQDN
  # (<svc>.<meshDomain>) resolves absolute-first, before the cluster.local search
  # list — without it, musl/Alpine clients fail to resolve mesh names. Scoped to
  # aether.io/managed pods, failurePolicy=Ignore. Default ON; pairs with mesh DNS.
  injectPodNdots: true
  # Namespace auto-injection (Istio-style): a pod created in a namespace labeled
  # aether.io/managed=true is given the aether.io/managed=true POD label by the
  # pod-mutating webhook, so the CNI meshes it without a per-pod label. A pod that
  # sets aether.io/managed=false opts out. Only acts on explicitly-labeled
  # namespaces (no-op otherwise), failurePolicy=Ignore. Default ON.
  namespaceInjection: true
  webhook:
    # Webhook serving cert source — DECOUPLED from mesh SPIRE (spire.enabled).
    #   false (default): a Helm self-signed cert (genSignedCert, caBundle baked
    #     into the webhook config). Validates out of the box, no SPIRE setup.
    #   true: serve with the controller's SPIRE X.509 SVID and inject the trust
    #     bundle into the caBundle at runtime. Requires the ClusterSPIFFEID below
    #     (or an equivalent) granting the controller the webhook Service DNS name
    #     in its dnsNames, else the apiserver's TLS hostname check fails. The
    #     controller is then granted get and update on its webhook configurations
    #     (no list, watch or patch since 2.4.27, #1456; a controller image older
    #     than chart 2.4.19's needs them): the
    #     validating one, and the pod-mutating one whenever namespaceInjection
    #     or injectPodNdots renders it (one condition for the object, the flag
    #     naming it and the grant: aether.controller.mutatingWebhook, #1411).
    spire: false
    # Rotation of the self-signed pair (spire=false only; #1364). The CA and the
    # serving certificate are generated once, valid for ten years, and every
    # upgrade reuses the Secret it finds, so an upgrade does not touch them.
    # Set this to any new value (a date is a good one) to generate a new pair
    # on the next upgrade. The value is stamped on the Secret
    # (aether.io/webhook-cert-rotation), so a later upgrade with the same value
    # reuses the new pair; clearing it rotates nothing, and neither does
    # putting the same value back later (the stamp stays). After the rotating
    # upgrade the webhooks trust both the old CA and the new one, and the
    # controller loads the new certificate without a restart. Rotate in a quiet
    # moment all the same: the Secret is patched before the webhook
    # configurations, and an upgrade that fails in between leaves the webhooks
    # failing open until it completes (docs/runbook.md). Empty = never rotate.
    # `helm template` cannot see the cluster and generates a new pair on every
    # render whatever this is: see docs/runbook.md, "Rendering the chart
    # reproducibly".
    certRotation: ""
    # When spire=true, have the chart create the controller's ClusterSPIFFEID with
    # the webhook Service DNS SANs, so SPIRE mode works without a manual entry.
    clusterSpiffeID:
      # false = "I register the controller's identity myself" (a ClusterSPIFFEID
      # or a registration entry of your own that gives its SVID the webhook
      # Service's DNS names): nothing is rendered and nothing is checked.
      create: true
      # spire-controller-manager class name for your SPIRE install (e.g.
      # "spire-mgmt-spire"). REQUIRED when spire=true and create=true: the
      # ClusterSPIFFEID is rendered only with it. Left empty in that case
      # (#1457), the render FAILS on a cluster that serves the ClusterSPIFFEID
      # API (spire-controller-manager installed), naming this value and
      # create=false; where the API is not served, and in a render that is not
      # told what the cluster serves (`helm template` without --api-versions),
      # nothing is rendered and the install notes carry a warning.
      className: ""
    # Egress identity gate (#1053). The pod-mutating webhook injects an
    # `aether-identity-ready` init container — FIRST, ahead of the pod's own init
    # containers — into every mesh-managed pod it admits. It asks the SPIRE
    # Workload API (a csi.spiffe.io volume mounted into that init container only)
    # for the pod's X.509 SVID and exits 0 once SPIRE has issued it, so the app
    # cannot send before the node proxy has a client certificate for it. Without
    # it, a pod that sends in its first seconds (SPIRE's entry sync; ~7.5 s on
    # the reference cluster) gets 503 UF connection_timeout until its SVID lands. The egress
    # twin of the inbound-readiness promotion gate.
    #
    # Fail closed: a pod whose SVID never comes stays in Init, and the init
    # container's log / termination message says what it is waiting for (see
    # docs/runbook.md, "Pod held in Init by aether-identity-ready"). Opt a single
    # pod out with the annotation `aether.io/identity-gate: "false"`.
    #
    # Rides the pod-mutating webhook: with namespaceInjection and
    # injectPodNdots both off that webhook does not render, and the controller
    # is passed --identity-gate=false and none of the gate's flags (#1432).
    # With webhook.spire=true that webhook's caBundle is patched by the
    # controller whenever it renders (either knob); unpatched, the apiserver
    # cannot call it and — failurePolicy: Ignore — the gate is silently
    # skipped. With spire.enabled=false the controller is always passed
    # --identity-gate=false (no SVID would ever come). Default ON.
    identityGate:
      enabled: true
      # Empty repository = the agent image (agent.image), which carries
      # /identity-ready as an extra layer and is already on every node. Set to
      # run it from a mirror.
      # A consequence, accepted (#1428): the image is an argument of the
      # controller (--identity-gate-image), so a new agent image digest changes
      # the controller's pod template and rolls the controller Deployment with
      # the agent DaemonSet. Pods already running keep the init container they
      # were admitted with. See docs/runbook.md, "Which workloads a chart
      # upgrade rolls".
      image:
        repository: ""
        digest: ""
        tag: ""
      # IfNotPresent: the agent image is digest-pinned, and the agent DaemonSet
      # has already pulled it onto the node, so a pod start never waits on a pull.
      pullPolicy: IfNotPresent
      # Give up after this long without an SVID (Go duration; the init container
      # exits 1 and the kubelet retries it with backoff). Empty = wait forever.
      timeout: ""
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: ""
          memory: 64Mi
  # The CPU limit STAYS here, reviewed with the same data that removed it from
  # uds-csi (#1321): on the 2026-10-06 8 h soak the controller was
  # CFS-throttled in 1.0 % of its periods (uds-csi: 57.6 %). Its
  # latency-relevant work is the admission webhooks, where a throttled period
  # adds less than 100 ms to a call the apiserver allows 5 s for
  # (controller-webhook.yaml, timeoutSeconds). GOMAXPROCS is derived from
  # limits.cpu (controller-deployment.yaml: 1 at 100m), so without a limit it
  # would follow the node's core count. Revisit if the throttled fraction
  # grows with pod-creation rate (docs/runbook.md, "uds-csi CPU throttling",
  # has the query): raise limits.cpu before removing it.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 64Mi
