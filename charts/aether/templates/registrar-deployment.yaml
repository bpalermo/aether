apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aether.registrar.fullname" . }}
  namespace: {{ include "aether.namespace" . }}
  labels:
    {{- include "aether.registrar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.registrar.replicaCount }}
  selector:
    matchLabels:
      {{- include "aether.registrar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aether.registrar.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aether.registrar.serviceAccountName" . }}
      # Tolerate the aether startup taint: the registrar is an aether-system
      # control-plane pod, not a mesh workload. The CNI plugin skips aether-system
      # pods (they never touch the agent), so it has no node-readiness dependency
      # and must not wait for the agent to untaint a node (#261).
      tolerations:
        - key: aether.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      # Spread the two replicas across nodes. Soft (ScheduleAnyway) on purpose:
      # single-node kind e2e must still schedule. Both replicas stacking onto
      # one node made main-worker-01 the density hot spot implicated in
      # #628/#629. Override via registrar.topologySpreadConstraints.
      {{- /* registrar.nodeSpread picks soft / required / none. From Kubernetes
             1.27 the constraint counts one ReplicaSet (matchLabelKeys), so a
             rollout's old replicas are not counted beside the new ones
             (#1434). See aether.nodeSpread. */}}
      {{- with include "aether.nodeSpread" (dict "ctx" . "name" "registrar" "values" .Values.registrar "selectorLabels" (include "aether.registrar.selectorLabels" .)) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: registrar
          image: {{ include "aether.image" .Values.registrar.image | quote }}
          imagePullPolicy: {{ .Values.registrar.image.pullPolicy }}
          args:
            - "--debug={{ .Values.debug }}"
            - "--cluster-name={{ .Values.clusterName }}"
            # Aether system config, inherited from the umbrella global block.
            # The config-export controller (proposal 026) resolves exported
            # backends as <svc>.<mesh-domain>, so it must be the agent's domain.
            - "--mesh-domain={{ .Values.meshDomain }}"
            {{- if .Values.otel.enabled }}
            - "--otel-enabled=true"
            {{- end }}
            {{- with .Values.otel.endpoint }}
            - "--otlp-endpoint={{ . }}"
            {{- end }}
            {{- if .Values.otel.logs }}
            - "--logs-enabled=true"
            {{- end }}
            - "--trace-sample-rate={{ .Values.otel.traceSampleRate }}"
            {{- if .Values.otel.traceExport }}
            - "--trace-export=true"
            {{- end }}
            - "--registry-backend={{ .Values.registrar.registryBackend }}"
            {{- if eq .Values.registrar.registryBackend "etcd" }}
            - "--etcd-endpoints={{ join "," .Values.registrar.etcd.endpoints }}"
            - "--region={{ .Values.registrar.region }}"
            {{- range .Values.registrar.peerEtcd }}
            - "--peer-etcd={{ . }}"
            {{- end }}
            {{- end }}
            - "--grpc-address=:{{ .Values.registrar.service.targetPort }}"
            {{- if .Values.registrar.enableMCS }}
            - "--enable-mcs"
            {{- end }}
            {{- if .Values.controlCluster }}
            - "--control-cluster={{ .Values.controlCluster }}"
            {{- end }}
            - "--spire-enabled={{ .Values.spire.enabled }}"
            {{- if .Values.spire.enabled }}
            - "--spire-workload-socket={{ .Values.spire.workloadSocketPath }}"
            - "--spire-wait-warn-after={{ .Values.spire.waitWarnAfter }}"
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.registrar.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
            - name: health
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Stamped onto every OTel signal (metrics/traces/logs) via
            # resource.WithFromEnv(), so logs are filterable per pod in
            # VictoriaLogs. Refs the env vars defined above ($(VAR) expansion).
            #
            # service.instance.id (#1560): the registrar has no node in its
            # resource, so nothing told its replicas apart unless a pipeline
            # promoted k8s.pod.name. Prometheus's OTLP ingestion maps this
            # attribute onto `instance` by itself, so each replica is its own
            # series, which AetherRegistrarSnapshotDiverged needs (it compares
            # hashes ACROSS replica series; one series is never two hashes).
            # The pod name changes on every roll and a pushed series has no
            # staleness marker, so the rules in docs/observability read only
            # samples of the last 150 s: see metric-labels.md there before
            # writing a rule or a panel over these series.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)"
            {{- /* 90% of limits.memory, never 100% (aether.goMemLimit). */}}
            {{- with include "aether.goMemLimit" .Values.registrar.resources }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          {{- if .Values.spire.enabled }}
          volumeMounts:
            - name: workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
          {{- end }}
          resources:
            {{- include "aether.resources" .Values.registrar.resources | nindent 12 }}
      {{- if .Values.spire.enabled }}
      volumes:
        - name: workload-socket
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
      {{- end }}
