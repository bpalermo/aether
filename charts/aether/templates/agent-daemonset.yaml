{{/*
Validate proxy.authzSidecar.failureMode unconditionally, not just on the branch
below that consumes it (#770): a typo should be rejected when it is written, not
silently carried until someone flips proxy.authzSidecar.enabled on.
*/}}
{{- $_ := include "aether.proxy.authzFailureMode" . -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "aether.agent.fullname" . }}
  namespace: {{ include "aether.namespace" . }}
  labels:
    {{- include "aether.agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "aether.agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    {{- if .Values.agent.updateStrategy.surge }}
    rollingUpdate:
      # Proposal 041: the new agent starts BESIDE the old one as a standby
      # (it finds /run/aether/agent.lock held), builds its whole first
      # snapshot, reports Ready, and takes the node over the instant the old
      # agent exits (the kernel releases the flock). The proxy's ADS gap is
      # the reconnect backoff plus the takeover diff instead of a whole pod
      # start (#1123).
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    rollingUpdate:
      # Delete-then-create: the node's proxy has no ADS stream from the old
      # agent's exit until the new one serves (#1123). See
      # agent.updateStrategy.surge.
      maxSurge: 0
      maxUnavailable: 1
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "aether.agent.podLabels" . | nindent 8 }}
    spec:
      hostNetwork: true
      # Resolve in-cluster Service names (e.g. the registrar) while on hostNetwork;
      # plain ClusterFirst is ignored for hostNetwork pods.
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "aether.agent.serviceAccountName" . }}
      priorityClassName: system-node-critical
      tolerations:
        # Tolerate the aether startup taint so the agent — which REMOVES it once
        # its CNI is serving — runs on a not-yet-ready node. Workload pods do NOT
        # tolerate it, so they wait until the agent untaints the node (#261). The
        # operator registers the taint via the kubelet (--register-with-taints).
        - key: aether.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: cni-install
          image: {{ include "aether.image" .Values.cniInstall.image | quote }}
          imagePullPolicy: {{ .Values.cniInstall.image.pullPolicy }}
          args:
            - "--debug={{ .Values.debug }}"
            # The host CNI dirs (cni.binDir / cni.confDir) as mounted below.
            - "--cni-bin-target-dir=/host{{ .Values.cni.binDir }}"
            - "--mounted-cni-net-dir=/host{{ .Values.cni.confDir }}"
            # No --otlp-endpoint (#1166): the CNI plugin exports no telemetry;
            # it reports its timings and capture-divert outcome to the agent,
            # which exports them with its own.
            # Capture is unconditional (proposal 031, netconf gate retired in
            # round 2); redirect-all-default is the remaining node-wide capture
            # knob (per-pod annotations override).
            {{- if .Values.agent.captureRedirectAllDefault }}
            - "--capture-redirect-all-default"
            {{- end }}
            {{- if .Values.agent.meshDns }}
            - "--mesh-dns"
            - "--host-ip=$(HOST_IP)"
            {{- end }}
          {{- if .Values.agent.meshDns }}
          env:
            # The node IP written into the netconf as the mesh-DNS DNAT target.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 0
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /host{{ .Values.cni.binDir }}
            - name: cni-conf-dir
              mountPath: /host{{ .Values.cni.confDir }}
          {{- /* #1335: no CPU limit by default (values.yaml, cniInstall.resources);
                 an empty limits.cpu renders "no limit" just like leaving the
                 key out (aether.resources). */}}
          resources:
            {{- include "aether.resources" .Values.cniInstall.resources | nindent 12 }}
      containers:
        - name: agent
          image: {{ include "aether.image" .Values.agent.image | quote }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - "--debug={{ .Values.debug }}"
            - "--cluster-name={{ .Values.clusterName }}"
            - "--node-name=$(NODE_NAME)"
            # Explicit boolean form: the binary default is true (031 kill
            # switch), so agent.gamma=false must be passed through.
            - "--gamma={{ .Values.agent.gamma }}"
            # Explicit boolean form: the binary default is true (safety net), so
            # agent.cniConflistReassert=false must be passed through (#645).
            - "--cni-conflist-reassert={{ .Values.agent.cniConflistReassert }}"
            # Where cni-conf-dir (cni.confDir on the host) is mounted below; the
            # conflist re-assert loop watches the active conflist here.
            - "--mounted-cni-net-dir=/host{{ .Values.cni.confDir }}"
            # The registrar stays in the release namespace, under a release-derived
            # name; the binary default assumes aether-registrar in aether-system,
            # so pass this release's Service address explicitly (as the edge does).
            - "--registrar-address={{ include "aether.registrar.address" . }}"
            {{- if .Values.agent.importConfig }}
            - "--import-config"
            {{- end }}
            {{- if .Values.controlCluster }}
            - "--control-cluster={{ .Values.controlCluster }}"
            {{- end }}
            {{- if .Values.proxy.authzSidecar.enabled }}
            - "--authz-sidecar"
            - "--authz-sidecar-timeout={{ .Values.proxy.authzSidecar.timeout }}"
            {{- if eq (include "aether.proxy.authzFailureMode" .) "ALLOW" }}
            - "--authz-sidecar-failure-mode-allow"
            {{- end }}
            {{- end }}
            {{- if .Values.udsCsi.enabled }}
            # UDS delivery (proposals 034/039): the csi.aether.io tmpfs root — the
            # SAME udsCsi.root the node plugin mounts under and the proxy mounts
            # at the identical path — so the rendered Envoy Pipe addresses
            # (<root>/<pod-uid>/<file>) need no translation.
            - "--uds-csi-root={{ include "aether.udsCsi.root" . }}"
            {{- else }}
            # UDS delivery off: with no carrier on the node the agent must not
            # render Pipe addresses it could never reach. Empty disables
            # resolution — pods requesting a socket fall back to TCP (counted as
            # aether.agent.uds.resolve_failures{reason="disabled"}).
            - "--uds-csi-root="
            {{- end }}
            {{- if .Values.agent.eastWestWaypoint }}
            - "--east-west-waypoint"
            {{- end }}
            # #1054: no idle h3 twin connection may outlive a destination's
            # hot-restart parent; the helper fails the render unless it is 5s
            # shorter than proxy.hotRestart.parentShutdownTime.
            - "--east-west-quic-idle-timeout={{ include "aether.agent.eastWestQuicIdleTimeout" . }}"
            {{- if .Values.agent.meshDns }}
            # Gates the agent's PERSIST path only (issue #578): the agent writes the
            # mesh record snapshot but no longer serves DNS — the standalone
            # aether-mesh-dns DaemonSet binds :18054 and forwards to --mesh-dns-upstream.
            - "--mesh-dns"
            {{- end }}
            # Aether system config, inherited from the umbrella global block.
            - "--mesh-domain={{ .Values.meshDomain }}"
            {{- if .Values.otel.enabled }}
            - "--otel-enabled=true"
            {{- end }}
            {{- with .Values.otel.endpoint }}
            - "--otlp-endpoint={{ . }}"
            {{- end }}
            {{- if .Values.otel.logs }}
            - "--logs-enabled=true"
            {{- end }}
            - "--trace-sample-rate={{ .Values.otel.traceSampleRate }}"
            {{- if .Values.otel.traceExport }}
            - "--trace-export=true"
            {{- end }}
            - "--spire-enabled={{ .Values.spire.enabled }}"
            # Proxy access-log / tracing / metrics overrides come from the mounted
            # MeshConfig ConfigMap (projected from the MeshConfig CR), defaulting to
            # the system config above.
            {{- if .Values.spire.enabled }}
            - "--spire-workload-socket={{ .Values.spire.workloadSocketPath }}"
            - "--spire-broker-socket={{ .Values.spire.brokerSocket.mountPath }}/{{ .Values.spire.brokerSocket.socketName }}"
            - "--spire-wait-warn-after={{ .Values.spire.waitWarnAfter }}"
            {{- end }}
            # Proposal 041: probes go over a Unix socket in this pod's own /tmp
            # emptyDir, never a TCP port. The pod is hostNetwork, so a port is a
            # NODE port: a surge pod declaring it would stay Pending (the
            # scheduler's NodePorts filter), could not bind it, and a port shared
            # with SO_REUSEPORT would let the OTHER agent answer for this one.
            - "--health-socket=/tmp/aether-agent-health.sock"
            - "--health-probe-bind-address=0"
          # No `ports:` (proposal 041). On a hostNetwork pod every containerPort
          # defaults to a hostPort, which keeps a surge pod Pending beside the
          # old one. They were informational only: metrics (:8080, bound once the
          # agent owns its node) is scraped by address, and health moved to the
          # pod-local socket above.
          livenessProbe:
            exec:
              command: ["/agent-ready", "--path=/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 10
          # Probed every 2 s from the start (#1123), not first at +5 s and then
          # every 10 s: a restarted agent's pod reported Ready ~10 s after its
          # container started on talos (2026-10-02), which paced every agent
          # roll node by node. failureThreshold keeps the time to NotReady at
          # 30 s, what the controller's node-taint guard (proposal 033) and
          # every operator alert were tuned against. /agent-ready is the
          # stdlib-only exec probe (proposal 041, open question 2): one fork
          # per period, of a binary that links no module.
          readinessProbe:
            exec:
              command: ["/agent-ready", "--path=/readyz"]
            periodSeconds: 2
            failureThreshold: 15
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            {{- /* 90% of limits.memory, never 100%: the exec probes above run
                   inside this container's cgroup (aether.goMemLimit). */}}
            {{- with include "aether.goMemLimit" .Values.agent.resources }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- /* #1116: explicit, not derived from limits.cpu -- the agent has
                   no CPU limit by default (values.yaml agent.resources). 0/empty
                   omits it so the Go runtime picks GOMAXPROCS itself. */}}
            {{- with .Values.agent.goMaxProcs }}
            - name: GOMAXPROCS
              value: {{ . | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Stamped onto every OTel signal (metrics/traces/logs) via
            # resource.WithFromEnv(), so logs are filterable per node/pod in
            # VictoriaLogs. Refs the env vars defined above ($(VAR) expansion).
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.node.name=$(NODE_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                {{- if .Values.spire.enabled }}
                # Access the SPIRE agent's SPIFFE Broker Endpoint socket from
                # this root-but-capability-dropped container. The SPIRE chart
                # creates it mode 0770 owned by the spire-agent uid:gid (1000
                # with its recommended securityContexts, root otherwise), so a
                # capability is what makes the connect work regardless of which.
                - DAC_OVERRIDE
                {{- end }}
          volumeMounts:
            # The node sockets (xds.sock, cni.sock) and the node-ownership lock
            # (agent.lock, proposal 041). The lock only works because every
            # agent pod on the node opens the SAME host file: a surge standby
            # blocks on the flock the old agent holds until it exits.
            - name: run-dir
              mountPath: /run/aether
              mountPropagation: HostToContainer
            - name: cni-netns-dir
              mountPath: /host/var/run/netns
              mountPropagation: HostToContainer
            - name: cni-registry-dir
              mountPath: /host/var/lib/aether/registry
              mountPropagation: HostToContainer
            # Read-WRITE, unlike everything else here: the agent re-asserts
            # aether's chained entry in the active conflist whenever a competing
            # writer strips it (#645 — kube-flannel `cp -f`s its ConfigMap
            # template over 10-flannel.conflist on every flannel pod recreation,
            # which a Talos bootstrap-manifest re-sync triggers). The cni-install
            # init container mounts the same dir for the one-shot append.
            - name: cni-conf-dir
              mountPath: /host{{ .Values.cni.confDir }}
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: mesh-config
              mountPath: /etc/aether
              readOnly: true
            {{- if .Values.spire.enabled }}
            - name: spire-workload-socket
              mountPath: /run/secrets/workload-spiffe-uds
              readOnly: true
            - name: spire-broker-socket
              mountPath: {{ .Values.spire.brokerSocket.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- include "aether.resources" .Values.agent.resources | nindent 12 }}
      volumes:
        - name: run-dir
          hostPath:
            path: /run/aether
            type: DirectoryOrCreate
        - name: cni-bin-dir
          hostPath:
            path: {{ .Values.cni.binDir }}
            type: DirectoryOrCreate
        - name: cni-conf-dir
          hostPath:
            path: {{ .Values.cni.confDir }}
            type: DirectoryOrCreate
        - name: cni-netns-dir
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
            # DirectoryOrCreate instead of Directory for the following reason - CNI may not bind mount this until a non-hostnetwork pod is scheduled on the node,
            # and we don't want to block CNI agent pod creation on waiting for the first non-hostnetwork pod.
            # Once the CNI does mount this, it will get populated and we're good.
        - name: cni-registry-dir
          hostPath:
            path: /var/lib/aether/registry
            type: DirectoryOrCreate
            # DirectoryOrCreate instead of Directory for the following reason - CNI may not bind mount this until a non-hostnetwork pod is scheduled on the node,
            # and we don't want to block CNI agent pod creation on waiting for the first non-hostnetwork pod.
            # Once the CNI does mount this, it will get populated and we're good.
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: tmp
          emptyDir: {}
        - name: mesh-config
          # Projected from the MeshConfig CR by the aether-controller. The name is
          # derived from the release (no chart value); the pod stays in
          # ContainerCreating until it exists. See proposal 015.
          configMap:
            name: {{ include "aether.meshConfigMapName" . }}
        {{- if .Values.spire.enabled }}
        - name: spire-workload-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: spire-broker-socket
          hostPath:
            path: {{ .Values.spire.brokerSocket.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
