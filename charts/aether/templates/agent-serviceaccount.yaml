apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aether.agent.serviceAccountName" . }}
  namespace: {{ include "aether.namespace" . }}
  labels:
    {{- include "aether.agent.labels" . | nindent 4 }}
  annotations:
    # Whether this render included the release's Namespace (#1403). Read back on
    # the next upgrade by aether.namespace.assertUpgradeKeeps: "false" says the
    # stored manifest cannot list a Namespace for Helm to delete.
    aether.io/release-namespace-rendered: {{ include "aether.namespace.rendered" . | quote }}
{{- if .Values.proxy.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aether.proxy.serviceAccountName" . }}
  namespace: {{ include "aether.namespace" . }}
  labels:
    {{- include "aether.proxy.labels" . | nindent 4 }}
{{- end }}
