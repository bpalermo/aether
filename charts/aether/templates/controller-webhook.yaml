{{/*
Webhook serving trust (controller.webhook.spire — decoupled from mesh SPIRE):

  controller.webhook.spire=true  — the controller serves the webhook with a SPIRE
    SVID and injects the SPIRE trust bundle into this config's caBundle at runtime,
    so no Secret is rendered and caBundle starts empty (failurePolicy: Ignore keeps
    the webhook fail-open until the controller injects the bundle).

  controller.webhook.spire=false (default) — a Helm self-signed CA and serving
    certificate, rendered as a Secret, with the CA baked into caBundle. Validates
    out of the box, independent of mesh SPIRE.

The self-signed pair is generated ONCE and reused (#1364). An install or upgrade
looks the Secret up in the cluster and renders the certificate it finds, so an
upgrade changes neither the Secret's data nor any caBundle. It generates a new
pair only when:

  - there is no Secret (a first install, or the Secret was deleted);
  - the Secret is incomplete (any of ca.crt / tls.crt / tls.key missing or
    empty): a half-written Secret is replaced, not rendered back half-empty;
  - controller.webhook.certRotation is set to a value other than the one the
    Secret was generated for (the aether.io/webhook-cert-rotation annotation).
    Changing the value rotates once; leaving it, or clearing it, rotates nothing.
    A reused Secret keeps its annotation when the value is cleared, so putting
    the same value back later (a reverted values change) does not rotate again.

A found Secret is always for the current names: the certificate's two SANs are
<service>.<namespace>.svc[.cluster.local], and the Secret is looked up as
<service>-cert in <namespace>, so another service name or namespace is another
Secret (not found, so generated).

A rotation is one upgrade, and it narrows the window in which the webhooks
cannot verify the controller's certificate without closing it: caBundle carries
the new CA AND the one being replaced, so the OLD certificate keeps verifying
after the upgrade, until the controller has picked the new one up from its
mounted Secret (controller-runtime's certwatcher, no restart). The next upgrade
renders the new CA alone.
What is left open: the Secret and the webhook configurations are separate
objects, and Helm patches the Secret first. A controller that loads the new
certificate before the webhook configurations are patched (a pod that starts in
between, or an upgrade that fails in between) serves a certificate the old
caBundle does not verify; the webhooks then fail open (failurePolicy: Ignore)
until the upgrade completes. Closing that needs the new CA trusted one upgrade
before the new certificate is served, which this chart does not do.

THE EXCEPTION: `lookup` returns nothing without a cluster, so `helm template`
and a client-side `--dry-run` generate a new pair on every render. Two renders
then differ in exactly the Secret's three values and the webhooks' caBundle. To
diff rendered manifests, mask those or render with controller.webhook.spire=true
(docs/runbook.md, "Rendering the chart reproducibly").
//charts/aether:aether_reproducible_masked_test pins that these are the only
render-time values in the chart.
*/}}
{{- $svc := include "aether.controller.webhookServiceName" . -}}
{{- $ns := include "aether.namespace" . -}}
{{- $caBundle := "" -}}
{{- if not .Values.controller.webhook.spire -}}
{{- $cn := printf "%s.%s.svc" $svc $ns -}}
{{- $altNames := list $cn (printf "%s.%s.svc.cluster.local" $svc $ns) -}}
{{- $secretName := printf "%s-cert" $svc -}}
{{- $rotation := toString (default "" .Values.controller.webhook.certRotation) -}}
{{- $existing := lookup "v1" "Secret" $ns $secretName -}}
{{- $have := dict -}}
{{- $generatedFor := "" -}}
{{- if $existing -}}
{{- $have = default (dict) $existing.data -}}
{{- $generatedFor = toString (dig "metadata" "annotations" "aether.io/webhook-cert-rotation" "" $existing) -}}
{{- end -}}
{{- $complete := and (index $have "ca.crt") (index $have "tls.crt") (index $have "tls.key") -}}
{{- $rotate := and $rotation (ne $rotation $generatedFor) -}}
{{- $secretCA := "" -}}
{{- $tlsCert := "" -}}
{{- $tlsKey := "" -}}
{{- /* What the Secret is stamped with: the value it was generated for. */ -}}
{{- $stamp := $rotation -}}
{{- if and $complete (not $rotate) -}}
{{- if not $rotation -}}
{{- $stamp = $generatedFor -}}
{{- end -}}
{{- $secretCA = index $have "ca.crt" -}}
{{- $tlsCert = index $have "tls.crt" -}}
{{- $tlsKey = index $have "tls.key" -}}
{{- $caBundle = $secretCA -}}
{{- else -}}
{{- $ca := genCA "aether-controller-ca" 3650 -}}
{{- $cert := genSignedCert $cn nil $altNames 3650 $ca -}}
{{- $secretCA = $ca.Cert | b64enc -}}
{{- $tlsCert = $cert.Cert | b64enc -}}
{{- $tlsKey = $cert.Key | b64enc -}}
{{- /* Keep trusting the CA being replaced until the controller has loaded the
       new certificate. Only a value that decodes to a PEM certificate is
       carried over; anything else would make the whole bundle unparseable. */ -}}
{{- $oldCA := "" -}}
{{- with index $have "ca.crt" -}}
{{- $oldCA = b64dec . -}}
{{- end -}}
{{- if and (hasPrefix "-----BEGIN CERTIFICATE-----" $oldCA) (hasSuffix "-----END CERTIFICATE-----" (trim $oldCA)) -}}
{{- $caBundle = printf "%s\n%s\n" (trim $ca.Cert) (trim $oldCA) | b64enc -}}
{{- else -}}
{{- $caBundle = $secretCA -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  {{- if $stamp }}
  annotations:
    aether.io/webhook-cert-rotation: {{ $stamp | quote }}
  {{- end }}
  labels:
    {{- include "aether.controller.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $secretCA }}
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "aether.controller.clusterScopedName" . }}
  labels:
    {{- include "aether.controller.labels" . | nindent 4 }}
webhooks:
  # One webhook entry, one /validate endpoint for every validated resource: the
  # controller dispatches by Kind (see controller/internal/webhook). Per-resource
  # rules carry their own scope (MeshConfig is the cluster-scoped singleton;
  # HTTPRoute is namespaced — its hostname-conflict check, proposal 018).
  - name: validate.config.aether.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Ignore so a down/un-injected webhook (e.g. during the controller's own
    # rollout, or before the SPIRE caBundle is injected) never wedges writes; the
    # consumers re-validate (the reconciler for MeshConfig; the edge, which also
    # runtime-dedups duplicate hosts, for HTTPRoute).
    failurePolicy: Ignore
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /validate
        port: 443
      {{- if not .Values.controller.webhook.spire }}
      caBundle: {{ $caBundle }}
      {{- end }}
    rules:
      - apiGroups: ["config.aether.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["meshconfigs"]
        scope: "Cluster"
      # HTTPFilter (proposal 025): fail-closed in-process proto-validate of the opaque
      # escape-hatch typedConfig. failurePolicy: Ignore (above) keeps a down webhook
      # from wedging writes; the agent reconciler skips an unresolvable/invalid filter.
      - apiGroups: ["config.aether.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httpfilters"]
        scope: "Namespaced"
      # EdgeConfig: proto-validate the edge-hardening/HTTP3 spec (proposal 029).
      - apiGroups: ["config.aether.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["edgeconfigs"]
        scope: "Namespaced"
      # EndpointPolicy (proposal 034 Phase 1b): reject a UDS socket the data plane
      # would refuse — bad path segment, or over the AF_UNIX sun_path budget — at
      # apply time. A missed validation only degrades the service to TCP delivery
      # (the agent re-resolves fail-closed), so failurePolicy: Ignore is safe here.
      - apiGroups: ["config.aether.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["endpointpolicies"]
        scope: "Namespaced"
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
        scope: "Namespaced"
{{- if include "aether.controller.mutatingWebhook" . }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "aether.controller.mutatingWebhookName" . }}
  labels:
    {{- include "aether.controller.labels" . | nindent 4 }}
webhooks:
  {{- if .Values.controller.namespaceInjection }}
  # Namespace auto-injection (Istio-style): pods created in a namespace labeled
  # aether.io/managed=true get the aether.io/managed=true POD label so the CNI
  # meshes them — no per-pod label needed. A pod with aether.io/managed=false opts
  # out. The handler also injects ndots into the now-managed pod.
  - name: namespace-inject.pods.aether.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Ignore: a down webhook must never block pod scheduling (a fail-closed pod
    # webhook is a cluster-wide outage). A missed injection just leaves a pod
    # unmeshed until its next admission.
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: Never
    # Fire on every pod in a managed namespace; the handler honors a per-pod
    # aether.io/managed=false opt-out.
    namespaceSelector:
      matchLabels:
        aether.io/managed: "true"
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /mutate
        port: 443
      {{- if not .Values.controller.webhook.spire }}
      caBundle: {{ $caBundle }}
      {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "Namespaced"
  {{- end }}
  {{- if .Values.controller.injectPodNdots }}
  # Inject dnsConfig ndots into pods ALREADY labeled aether.io/managed=true (the
  # explicit-label path, in any namespace) so a mesh FQDN (<svc>.<meshDomain>) is
  # resolved absolute-first, before the cluster.local search list — musl clients
  # otherwise fail to resolve mesh names (proposal 018, mesh-global FQDN).
  - name: ndots.pods.aether.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Ignore: a down webhook must never block pod scheduling (a fail-closed pod
    # webhook is a cluster-wide outage). Missing ndots only degrades musl mesh-DNS.
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: Never
    # Only pods that opted into the mesh; never control-plane / system pods.
    objectSelector:
      matchLabels:
        aether.io/managed: "true"
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /mutate
        port: 443
      {{- if not .Values.controller.webhook.spire }}
      caBundle: {{ $caBundle }}
      {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "Namespaced"
  {{- end }}
{{- end }}
