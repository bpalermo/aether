# Default values for the prober chart.

nameOverride: ""
fullnameOverride: ""

# Namespace the prober DaemonSet is deployed into. Must be a namespace whose pods
# are mesh-managed so the CNI plumbs the local egress listener (e.g. aether-test).
namespace:
  create: false
  name: ""

image:
  # Substituted at package time with the digest-pinned reference produced by
  # //prober/cmd/prober:image_push.
  ref: "{@//prober/cmd/prober:image_push}"
  pullPolicy: Always

# Probe settings (see prober flags).
probe:
  # Local mesh egress listener the prober dials.
  egress: "127.0.0.1:18081"
  # Proxy local-reply liveness route (agent emits a direct_response 200 here).
  livenessPath: "/-/-/live"
  # Reserved, non-service Host authority for the liveness probe.
  livenessAuthority: "liveness.aether.internal"
  # Probes/sec per target.
  rate: 5
  # Per-probe timeout.
  timeout: "2s"
  # Mesh authority suffix for the reachability tier.
  meshDomain: "aether.internal"
  # Optional reachability tier: echo upstream service names. When non-empty, the
  # pod gets config.aether.io/upstreams so the agent programs those clusters.
  reachabilityTargets: []
  # Optional mesh_dns tier: namespace-qualified FQDN authorities (host[:port],
  # default port 18081). Unlike liveness/reachability these are RESOLVED through the
  # mesh DNS path (CNI :53 DNAT → agent resolver → ClusterIP) rather than being
  # Host-overridden, so a real mesh-DNS outage becomes an alertable dns_* signal
  # (closes the blind spot behind issue #574). Only works because this pod is
  # mesh-managed. Each target's host is also added to config.aether.io/upstreams.
  #
  # Two targets on purpose — they exercise DIFFERENT resolver paths, and the
  # `target` label keeps them separable:
  #   *.aether.internal      -> answered authoritatively from the record snapshot
  #   *.svc.cluster.local    -> NOT a mesh name, so it is FORWARDED to kube-dns
  # Without the second, the forward path is unprobed: it carries the majority of a
  # real workload's lookups, yet organic forward traffic here is near zero, so a
  # kube-dns or upstream-failover regression would be invisible.
  meshDNSTargets:
    - "echo.aether-test.aether.internal:18081"
    - "echo.aether-test.svc.cluster.local:18081"

# OTel: push the probe SLI to the collector (host:port, insecure). Empty disables
# telemetry (the prober still runs but emits nothing).
telemetry:
  otlpEndpoint: ""

# The prober MEASURES mesh latency, so it must never be the thing adding it, and a CPU
# limit is exactly that thing: the limit is a CFS quota, and once a 100 ms period's
# quota is gone the runnable goroutine sleeps to the next period boundary — probe
# latency comes out quantised in ~100 ms steps no matter how fast the mesh answered.
#
# At the previous 50m limit that was not a theoretical risk, it was the dominant term in
# the SLI (issue #735). Measured on talos-main: the container was throttled in 81–90% of
# ALL CFS periods on every one of the five nodes, and the mesh_dns tier's p50 read 179 ms
# against a source-proxy `duration` of 29 ms for the very same requests — roughly 150 ms
# of the published SLI was the prober's own quota. Even the liveness tier, a local
# direct_response an unthrottled client measures at ~1 ms, read 9 ms p50 / 317 ms p99.
#
# The tier that costs the CPU is mesh_dns: it resolves and dials on EVERY probe by
# design (that is the SLI), and ~39% of the process's CPU goes to
# net.(*Resolver).tryOneName plus http.(*Transport).dialConn.
#
# Hence: a request that reflects real demand, and NO CPU limit. The workload is
# open-loop and rate-bounded (probe.rate × number of targets) so it cannot run away.
# The memory limit stays — it also feeds GOMEMLIMIT. Re-add limits.cpu here only with a
# quota that cannot bind (>= 1), never a fraction of a core.
resources:
  requests:
    cpu: 100m
    memory: 32Mi
  limits:
    memory: 64Mi
