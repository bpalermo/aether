apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prober.serviceAccountName" . }}
  namespace: {{ include "prober.namespace" . }}
  labels:
    {{- include "prober.labels" . | nindent 4 }}
  annotations:
    # Whether this render included the Namespace (#1405); read back on the next
    # upgrade by prober.namespace.assertUpgradeKeeps.
    aether.io/release-namespace-rendered: {{ include "prober.namespace.rendered" . | quote }}
