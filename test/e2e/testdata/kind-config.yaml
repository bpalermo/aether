kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Pinned (#1221) so the Kubernetes version is not whatever the kind binary
    # defaults to. The e2e framework reads a kind config, not a shell file, so
    # this is a COPY of KIND_NODE_IMAGE in e2e/kind-version.sh (#1251), the one
    # place Kubernetes is bumped; //e2e:kind_pin_test fails when they differ.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    labels:
      topology.kubernetes.io/region: us-east-1
      topology.kubernetes.io/zone: us-east-1a
