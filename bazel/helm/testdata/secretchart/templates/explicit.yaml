{{- /*
Secrets whose values no search for a `data:` line finds: an explicit key, a
key that is a block scalar, and values that reach `data` through a merge key.
They are masked because no value line of a possible Secret is printed at all.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-explicit-key
? data
: token: FORBIDDEN-explicit-key-token
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-multiline-key
? |-
  stringData
: token: FORBIDDEN-multiline-key-token
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-merge
  annotations: &payload
    token: FORBIDDEN-merge-token
stringData:
  <<: *payload
