{{- /*
Secrets whose values no search for a `data:` line finds: an explicit key, a
key that is a block scalar, and values that reach `data` through a merge key.
They are masked because no value line of a possible Secret is printed at all.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-explicit-key
? data
: token: FORBIDDEN-explicit-key-token
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-multiline-key
? |-
  stringData
: token: FORBIDDEN-multiline-key-token
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-merge
  annotations: &payload
    token: FORBIDDEN-merge-token
stringData:
  <<: *payload
---
{{- /* A typed list: its items are Secrets without a kind line of their own. */}}
apiVersion: v1
kind: SecretList
metadata:
  name: {{ .Release.Name }}-typed-list
items:
  - metadata:
      name: inner
    data:
      token: FORBIDDEN-typed-list-token
---
{{- /* A plainly-kinded outer object carrying a Secret whose nested kind has a YAML anchor. */}}
apiVersion: example.dev/v1
kind: Bundle
metadata:
  name: {{ .Release.Name }}-nested-anchored
spec:
  object:
    apiVersion: v1
    kind: &nested-kind Secret
    data:
      token: FORBIDDEN-nested-anchored-token
---
{{- /* A plainly-kinded outer object carrying a Secret whose nested kind is an indented explicit key. */}}
apiVersion: example.dev/v1
kind: Bundle
metadata:
  name: {{ .Release.Name }}-nested-explicit
spec:
  object:
    apiVersion: v1
    ? kind
    : Secret
    data:
      token: FORBIDDEN-nested-explicit-token
