{{- /* Secrets that are not the document's top-level object. */ -}}
apiVersion: v1
kind: List
metadata:
  name: {{ .Release.Name }}-list
items:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: nested
    data:
      token: FORBIDDEN-nested-token
  - data:
      token: FORBIDDEN-dash-token
    apiVersion: v1
    kind: Secret
    metadata:
      name: dash
