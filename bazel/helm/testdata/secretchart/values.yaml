# Not secrets: fixed strings the tests look for. Every value that a Secret
# document carries starts with FORBIDDEN, so "no test output contains
# FORBIDDEN" is the whole masking assertion; VISIBLE marks what must survive.
replicas: 2

# true makes templates/broken.yaml render invalid YAML (see that file).
broken: false

# true makes templates/random.yaml render a value generated at render time.
random: false
