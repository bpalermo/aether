# Prometheus alerting rules for the registrar's snapshot identity (#1193, #1322,
# #1329).
#
# Every registrar replica serves an endpoint snapshot listed from etcd at one
# store revision. The listing is a pure function of the revision, so two
# replicas at the SAME aether_registrar_snapshot_revision must report the SAME
# aether_registrar_snapshot_content_hash. A different hash at one revision means
# a replica is not serving what the store holds.
#
# aether_registrar_snapshot_content_hash carries the hash as its VALUE: the first
# 13 hex digits (52 bits) of the content hash in the snapshot version, as an
# integer. A float64 holds every integer up to 2^53 exactly, so Prometheus
# compares the values without loss. Two replicas serving different contents
# report the same value with probability 2^-52 (about 2.2e-16): enough for a
# divergence check between a few replicas, which is all this is.
#
# Install: merge into the Prometheus helm values under
#   serverFiles:
#     alerting_rules.yml:
#       groups: [...]
# See README.md in this directory. Deployed from
# bpalermo/k8s-talos-main -> clusters/talos-main/prometheus/values.yaml, where
# promtool unit tests (clusters/talos-main/prometheus/rules_test.yaml) run this
# expression in CI. In this repository `bazel test //:observability_rules_test`
# runs `promtool check rules` on this file; there is no unit test for it here.
#
# UPGRADING from a registrar without the value gauge (before #1329): this rule
# reads a metric an older replica does not export, so it is blind to that
# replica. Until every replica runs an image with the gauge, keep the previous
# expression (on aether_registrar_snapshot_content{content_hash}, which this
# release still exports) as a second arm:  (<expr below, without its unless>)
# or (<previous expr, without its unless>)  unless on (job) (...). Both arms
# return {job, revision}, so one divergence is one alert. docs/runbook.md,
# "Stored vs in place vs applied", has the full text. Drop the second arm once
# the registrar has rolled; the labelled metric goes away in the release after
# this one.

groups:
  - name: aether-registrar
    rules:
      # Inside out:
      #
      #   count_values without () ("revision", aether_registrar_snapshot_revision)
      #     one series per replica, with the replica's revision as a LABEL (value
      #     1). `without ()` keeps every label the series has, so this does not
      #     depend on what the pipeline calls the replica label (`node` on
      #     talos-main).
      #   content_hash * ignoring (revision) group_left (revision) ...
      #     the replica's hash (times 1), now labelled with its revision. The two
      #     gauges have the same labels, so the match is one to one per replica.
      #     A replica that reports no revision (kubernetes backend) has no match
      #     and drops out.
      #   count_values by (job, revision) ("hash", ...)
      #     one series per distinct hash at one revision.
      #   count by (job, revision) (...) > 1
      #     more than one hash at ONE revision. A replica that lags a revision is
      #     at a different revision and is not compared.
      #   unless ... queue_depth > 0
      #     a pending write-behind intent is overlaid on the listing (version
      #     `<rev>+<hash>`), so that replica is legitimately ahead of its
      #     revision. The queue-depth series exists only once something was
      #     queued; `unless ... > 0` is quiet only when a depth above zero is
      #     actually reported, so a missing series does not disable the rule.
      #
      # No staleness handling is needed (#1322 needed a timestamp() filter): a
      # content change moves the VALUE of the one series a replica has, so there
      # is no superseded series left in the 5-minute lookback.
      #
      # Timestamps. The registrar observes revision and hash in one callback from
      # one read of the snapshot, so the pair in one export is always consistent.
      # The OTel SDK stamps each instrument separately (they differ by up to a few
      # milliseconds on talos-main), and both travel in one OTLP request, which
      # the collector's batch processor does not split and Prometheus commits as
      # one append. The expression matches on labels, not on timestamps, so the
      # stamps do not matter. If a pipeline ever did deliver the two metrics
      # apart, an evaluation in between would pair a new revision with the old
      # hash for one evaluation; `for:` covers that.
      #
      # for: 3m. An agent RPC applied between two syncs changes a replica's
      # contents before its revision moves (at most the 200 ms sync debounce), and
      # one export can land in that window. Three minutes is more than two 60 s
      # exports. A real divergence does not heal by itself.
      #
      # etcd backend only: the kubernetes backend reports no revision, so this
      # expression returns nothing there.
      - alert: AetherRegistrarSnapshotDiverged
        expr: |
          count by (job, revision) (
            count_values by (job, revision) (
              "hash",
              aether_registrar_snapshot_content_hash
              * ignoring (revision) group_left (revision)
              count_values without () ("revision", aether_registrar_snapshot_revision)
            )
          ) > 1
          unless on (job) (max by (job) (aether_registrar_writebehind_queue_depth) > 0)
        for: 3m
        labels:
          severity: warning
          component: aether-registrar
        annotations:
          summary: "registrar replicas serve {{ $value }} different endpoint sets at store revision {{ $labels.revision }}"
          description: >-
            Registrar replicas report the same aether_registrar_snapshot_revision
            ({{ $labels.revision }}) with different values of
            aether_registrar_snapshot_content_hash, and no write-behind intent is
            pending. The listing is a pure function of the revision, so at least
            one replica is not serving what the store holds, and the agents
            watching it program different endpoints from the rest of the fleet.
            Compare `aether_registrar_snapshot_content_hash` per replica, then the
            registrar logs for sync errors and
            `aether_registrar_sync_errors_total`. Restarting the odd replica
            makes it list again, but keep its logs first: this is a bug, see
            docs/runbook.md, "Stored vs in place vs applied".
