# Alertmanager -> GitHub issue receiver.
#
# Turns firing alerts into a tracked GitHub issue (and closes it on resolve), so an
# alert survives the session it fired in. Every failure that has actually hurt this
# project was silence -- three red nightly e2e runs unnoticed, a churn driver dead for
# 17 minutes, an otel-collector shedding telemetry for six hours. A durable artifact
# beats a notification nobody is holding.
#
# Pairs with mesh-dns-alerts.yml (the rules) and the alertmanager values in README.md.
# Deploy into the o11y namespace, alongside prometheus/alertmanager.
#
#   kubectl apply -f docs/observability/alertmanager-github-receiver.yaml
#
# PREREQUISITE -- create the token secret first. Use a FINE-GRAINED PAT scoped to this
# repository only, with "Issues: Read and write" and nothing else. It is a repo-write
# credential living in-cluster; scope it deliberately:
#
#   kubectl create secret generic alertmanager-github-receiver \
#     -n o11y --from-literal=token='github_pat_...'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager-github-receiver
  namespace: o11y
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-github-receiver
  namespace: o11y
  labels:
    app.kubernetes.io/name: alertmanager-github-receiver
spec:
  selector:
    app.kubernetes.io/name: alertmanager-github-receiver
  ports:
    - name: http
      port: 9393
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-github-receiver
  namespace: o11y
  labels:
    app.kubernetes.io/name: alertmanager-github-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-github-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-github-receiver
    spec:
      serviceAccountName: alertmanager-github-receiver
      automountServiceAccountToken: false # it talks to GitHub, not the kube API
      containers:
        - name: receiver
          # PIN THIS. `latest` is what upstream documents, but this repo digest-pins
          # every image for a reason -- an unpinned receiver can change behaviour
          # under you between restarts. Resolve the digest once and pin it here.
          image: measurementlab/alertmanager-github-receiver:latest
          args:
            - -authtoken=$(GITHUB_AUTH_TOKEN)
            - -org=bpalermo
            - -repo=aether
            # Close the issue automatically when the alert resolves, so a recovered
            # condition does not leave a stale open issue to be triaged by hand.
            - -enable-auto-close
            # Label applied to created issues; also the matcher used for auto-close.
            - -alertlabel=alert:aether
          env:
            - name: GITHUB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alertmanager-github-receiver
                  key: token
          ports:
            - name: http
              containerPort: 9393
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
