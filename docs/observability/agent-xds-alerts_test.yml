  # The first limit above does not hold for a series per pod: a replacement
  # that is rejected before its first export is a NEW series that appears at
  # 1, whatever count the old pod ended on, and the second arm fires for its
  # first hour.
  - name: a replaced edge pod rejected before its first export fires
    interval: 1m
    input_series:
      - series: 'aether_agent_xds_nacks_total{job="aether-edge", node="n1", instance="edge-old", aether_xds_type_url="type.googleapis.com/envoy.config.listener.v3.Listener"}'
        values: '0x9 1x80'
      - series: 'aether_agent_xds_nacks_total{job="aether-edge", node="n1", instance="edge-new", aether_xds_type_url="type.googleapis.com/envoy.config.listener.v3.Listener"}'
        values: '_x91 1x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: AetherProxyRejectedListenerUpdate
        exp_alerts: []
      - eval_time: 90m
        alertname: AetherProxyRejectedListenerUpdate
        exp_alerts: []
      - eval_time: 91m
        alertname: AetherProxyRejectedListenerUpdate
        exp_alerts:
          - exp_labels:
              severity: warning
              component: aether-agent
              job: aether-edge
              node: n1
            exp_annotations:
              summary: "the proxy on n1 rejected a Listener update from aether-edge"
              description: "The proxy that aether-edge serves on n1 rejected (NACKed) at least one Listener response in the last hour. The agent published a listener the proxy cannot build, which is an agent defect: report it. The proxy applied the rest of that response, its removals and the listeners it could build, and a listener it kept that way is unknown to the agent after an agent restart, so nothing removes it when its pod goes. The agent's log line `envoy NACKed delta response` on that node names the listeners of the response (`added`, `removed`) and carries the proxy's reason (`error`). Once the cause is fixed, replace that proxy's pod (for the node agent, the aether-proxy pod on that node). The alert ends an hour after the last rejection, whatever was done. See docs/runbook.md, \"The proxy rejected a Listener update\"."
