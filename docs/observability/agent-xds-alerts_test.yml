  # A LIMIT of a series per pod. A pod rejected before its first export and
  # replaced nine minutes later: the second arm reads the old pod's last
  # sample for the five minutes a bare selector returns it, and the alert
  # ends there, not an hour after the rejection. The rejection fired when it
  # happened; the proxy it was sent to went with the pod.
