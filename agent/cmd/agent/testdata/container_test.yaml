schemaVersion: 2.0.0
metadataTest:
  entrypoint: ["/agent"]
  user: 65532 # nonroot
fileExistenceTests:
  - name: 'agent'
    path: '/agent'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    isExecutableBy: 'other'
  # The aether-proxy pod's readiness prober (#673) ships ONLY in the
  # proxy-supervisor image since the deprecated `agent proxy-supervisor` alias
  # was removed; assert it cannot silently creep back into this image.
  - name: 'no proxy-ready binary'
    path: '/proxy-ready'
    shouldExist: false
  # The egress identity gate (#1053): the pod-mutating webhook injects this
  # image with command ["/identity-ready"] as every mesh pod's first init
  # container, so it must be here and executable by the nonroot user.
  - name: 'identity-ready'
    path: '/identity-ready'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    isExecutableBy: 'other'
  # The slim mesh-DNS daemon now has its OWN image
  # (//agent/cmd/mesh-dns:mesh-dns_image, #583 option B). It was only ever bundled
  # here to avoid standing up a second publish pipeline; assert it is gone so the
  # agent image can't silently re-acquire it.
  - name: 'no mesh-dns binary'
    path: '/mesh-dns'
    shouldExist: false
