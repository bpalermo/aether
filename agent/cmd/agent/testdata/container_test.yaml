schemaVersion: 2.0.0
metadataTest:
  entrypoint: ["/agent"]
  user: 65532 # nonroot
fileExistenceTests:
  - name: 'agent'
    path: '/agent'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    isExecutableBy: 'other'
  # The aether-proxy pod's stdlib-only exec readiness probe (#673). Since #772
  # the chart stages it out of the proxy-supervisor image instead; this copy is
  # kept for the DEPRECATED `agent proxy-supervisor` alias, which a chart
  # predating #772 still runs from THIS image and which hard-fails without it.
  # Assert it until the alias goes.
  - name: 'proxy-ready'
    path: '/proxy-ready'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    isExecutableBy: 'other'
  # The slim mesh-DNS daemon now has its OWN image
  # (//agent/cmd/mesh-dns:mesh-dns_image, #583 option B). It was only ever bundled
  # here to avoid standing up a second publish pipeline; assert it is gone so the
  # agent image can't silently re-acquire it.
  - name: 'no mesh-dns binary'
    path: '/mesh-dns'
    shouldExist: false
