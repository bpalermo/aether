schemaVersion: 2.0.0
metadataTest:
  entrypoint: ["/mesh-dns"]
  user: 65532 # nonroot
fileExistenceTests:
  # The slim standalone mesh-DNS binary (#583). The DaemonSet runs it as its
  # command, so it must be executable by the (non-root) runtime user.
  - name: 'mesh-dns'
    path: '/mesh-dns'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    isExecutableBy: 'other'
  # The stdlib-only exec readiness prober (#683). Since #683 the kubelet execs
  # THIS instead of re-launching the whole daemon every 15s, so a missing or
  # non-executable one makes every mesh-dns pod permanently NotReady — which on
  # a maxSurge:1/maxUnavailable:0 DaemonSet also wedges the rollout.
  - name: 'mesh-dns-ready'
    path: '/mesh-dns-ready'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    isExecutableBy: 'other'
  # Guard against the agent image's payload leaking back in: this image exists to
  # NOT carry the full agent (#583 option B).
  - name: 'no agent binary'
    path: '/agent'
    shouldExist: false
